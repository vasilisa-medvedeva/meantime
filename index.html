  /* Sheet · 95:14 · Detent = Medium|Large */
  Sheet({detent="medium", build, dismissible=true, onDismiss, delay=0}){
    const layer=document.getElementById("sheetLayer");
    /* HIG Modality — одна шторка за раз: новая закрывает предыдущую, стопки не бывает */
    layer.querySelectorAll(".Sheet").forEach(x=>{ if(x._api) x._api.close(); else x.remove(); });
    layer.querySelectorAll(".Scrim").forEach(x=>x.remove());
    layer.style.pointerEvents="auto";
    const scrim=el("div","Scrim");
    const sheet=el("div","Sheet"); sheet.dataset.detent=detent;
    const grab=el("div","Sheet__grab");
    const body=el("div","Sheet__body");
    sheet.append(grab, body);
    layer.append(scrim, sheet);
    const api={
      el:sheet, body,
      close(){
        if(api._closed) return; api._closed=true;
        sheet.classList.add("is-out"); sheet.classList.remove("is-in"); scrim.classList.remove("is-in");
        setTimeout(()=>{ scrim.remove(); sheet.remove();
          if(!layer.querySelector(".Sheet")) layer.style.pointerEvents="none"; }, AFTER_SHEET());
        onDismiss && onDismiss();
      }
    };
    sheet._api=api;
    build(body, api);
    const show=()=>{ requestAnimationFrame(()=>{ scrim.classList.add("is-in"); sheet.classList.add("is-in"); }); };
    delay ? setTimeout(show, delay) : show();
    if(dismissible){
      scrim.addEventListener("click", api.close);
      dragToDismiss(sheet, api.close);
    }
    return api;
  }
};
function assign(n, txt){ n.textContent=txt; return n; }

/* реестр №7 — шторка тянется за пальцем, порог 25 % высоты или скорость > .5 px/ms */
function dragToDismiss(sheet, close){
  let y0=0,t0=0,dy=0,active=false;
  const down=e=>{ const p=e.touches?e.touches[0]:e;
    const body=sheet.querySelector(".Sheet__body");   /* у камеры тела шторки нет */
    if(body && body.scrollTop>0 && !e.target.closest(".Sheet__grab")) return;
    active=true; y0=p.clientY; t0=Date.now(); dy=0; sheet.style.transition="none"; };
  const move=e=>{ if(!active) return; const p=e.touches?e.touches[0]:e;
    dy=Math.max(0,p.clientY-y0); sheet.style.transform="translateY("+dy+"px)";
    if(e.cancelable) e.preventDefault(); };
  const up=()=>{ if(!active) return; active=false;
    const v=dy/Math.max(1,Date.now()-t0);
    sheet.style.transition="";
    if(dy > sheet.offsetHeight*0.25 || v>0.5){ sheet.style.transform=""; close(); }
    else sheet.style.transform="";
  };
  sheet.addEventListener("touchstart",down,{passive:true});
  sheet.addEventListener("touchmove",move,{passive:false});
  sheet.addEventListener("touchend",up);
  sheet.addEventListener("mousedown",down);
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",up);
}

/* Пауза «шторка ушла — можно открывать следующую». Была числом 320 мимо токена;
   решение 17.27 требует привязки к токену, иначе при смене длительностей разъедется. */
const AFTER_SHEET = ()=>MS("--motion-sheet-out")+20;

/* --- баннер сверху: в iOS нет тостов (реестр №24) --- */
function banner(text){
  const layer=document.getElementById("bannerLayer");
  const b=el("div","Banner t-body"); b.textContent=text;
  layer.append(b);
  requestAnimationFrame(()=>b.classList.add("is-in"));
  setTimeout(()=>{ b.classList.add("is-out"); b.classList.remove("is-in");
    setTimeout(()=>b.remove(), MS("--motion-alert")+60); }, 2500);
}

/* --- заставка (решение 17.4, реестр №34) -------------------------------
   Вордмарк на свечении героя, кросс-фейд туда и обратно, ~1200 мс.
   Ни спиннера, ни прогресса: это точка входа в демо, а не настоящая загрузка. */
function splash(){
  const dev=document.getElementById("device");
  const n=el("div","Splash");
  n.append(el("div","Hero__glow"), assign(el("h1","t-display t-logo"),"Meantime"));
  dev.append(n);
  requestAnimationFrame(()=>n.classList.add("is-in"));
  setTimeout(()=>{
    n.classList.add("is-out"); n.classList.remove("is-in");
    setTimeout(()=>n.remove(), MS("--motion-alert")+40);
  }, MS("--motion-sheet-in")+MS("--motion-reveal-hold"));
}
const SPLASH_MS = ()=>MS("--motion-sheet-in")+MS("--motion-reveal-hold")+MS("--motion-alert");

/* --- action sheet (реестр №23) --- */
function actionSheet(items){
  const layer=document.getElementById("sheetLayer");
  layer.style.pointerEvents="auto";
  const scrim=el("div","Scrim");
  const wrap=el("div","ActionSheet");
  const grp=el("div","ActionSheet__grp");
  const cancelGrp=el("div","ActionSheet__grp");
  const close=()=>{ wrap.classList.remove("is-in"); scrim.classList.remove("is-in");
    setTimeout(()=>{ wrap.remove(); scrim.remove();
      if(!layer.querySelector(".Sheet")) layer.style.pointerEvents="none"; },MS("--motion-menu")+20); };
  items.forEach(it=>{
    const b=el("button","ActionSheet__btn"); b.dataset.role=it.role||"default"; b.textContent=it.label;
    b.addEventListener("click",()=>{ close(); it.onTap && it.onTap(); });
    (it.role==="cancel"?cancelGrp:grp).append(b);
    if((it.role==="cancel"?cancelGrp:grp).children.length>1)
      (it.role==="cancel"?cancelGrp:grp).insertBefore(el("div","hair"), b);
  });
  wrap.append(grp, cancelGrp);
  layer.append(scrim, wrap);
  scrim.addEventListener("click",close);
  requestAnimationFrame(()=>{ scrim.classList.add("is-in"); wrap.classList.add("is-in"); });
  return {close};
}

/* ============================================================================
   §11 · Router — push/pop слайдом, zoom-from-thumbnail (решение 13.2),
   интерактивный свайп от края, следующий за пальцем (решение 13.4).
   ========================================================================= */
const MS = k => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(k))||0;
const Router = {
  stack:[], current:null, busy:false,
  root:{today:"03", diary:"07", effects:"11"},
  el(){ return document.getElementById("stack"); },

  build(route){
    const make = Screens[route];
    if(!make) throw new Error("no screen "+route);
    const s = el("div","Screen"); s.dataset.route=route;
    make(s);
    return s;
  },

  /* корень таба — без анимации содержимого (HIG, реестр №4) */
  tab(id){
    const route=this.root[id];
    if(this.stack.length===1 && this.current===route) return;
    this.stack.forEach(f=>f.el.remove());
    const s=this.build(route);
    this.el().append(s);
    this.stack=[{route, el:s, mode:"root"}];
    this.current=route;
    location.hash="#/"+route;
  },

  /* корень + экран поверх: «назад» с 06 возвращает на 03 в состоянии «после Keep» */
  resetTo(rootRoute, route){
    /* решение 17.34 — экран приходит слайдом поверх текущего, а корень под ним
       подменяется уже после анимации: зритель видит переход, «назад» по-прежнему ведёт на корень */
    if(this.busy) return; this.busy=true;
    const D=MS("--motion-screen");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    const old=this.stack.slice(), top=old[old.length-1];
    const s=this.build(route);
    s.style.transform="translateX(100%)"; s.style.willChange="transform";
    this.el().append(s); void s.offsetWidth;
    this.stack=old.concat([{route, el:s, mode:"slide"}]);
    requestAnimationFrame(()=>{
      s.style.transition="transform "+D+"ms "+ease; s.style.transform="translateX(0)";
      if(top){ top.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
        top.el.style.transform="translateX(-30%)"; top.el.style.opacity=".6"; }
    });
    setTimeout(()=>{
      old.forEach(f=>f.el.remove());
      const r=this.build(rootRoute); this.el().insertBefore(r, s);
      this.stack=[{route:rootRoute, el:r, mode:"root"},{route, el:s, mode:"slide"}];
      s.style.transition=""; s.style.willChange=""; this.busy=false;
    }, D+20);
    this.current=route; location.hash="#/"+route;
  },

  /* решение 17.35 — после «Keep in diary» человек уезжает сразу в дневник: экран приходит
     слайдом поверх проявления, а после анимации становится корнем вкладки Diary */
  switchTo(id){
    if(this.busy) return; this.busy=true;
    const route=this.root[id];
    const D=MS("--motion-screen");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    const old=this.stack.slice(), top=old[old.length-1];
    const s=this.build(route);
    s.style.transform="translateX(100%)"; s.style.willChange="transform";
    this.el().append(s); void s.offsetWidth;
    this.stack=old.concat([{route, el:s, mode:"slide"}]);
    requestAnimationFrame(()=>{
      s.style.transition="transform "+D+"ms "+ease; s.style.transform="translateX(0)";
      if(top){ top.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
        top.el.style.transform="translateX(-30%)"; top.el.style.opacity=".6"; }
    });
    setTimeout(()=>{
      old.forEach(f=>f.el.remove());
      this.stack=[{route, el:s, mode:"root"}];
      s.style.transition=""; s.style.willChange=""; this.busy=false;
    }, D+20);
    this.current=route; location.hash="#/"+route;
  },

  reset(route){
    this.stack.forEach(f=>f.el.remove());
    const s=this.build(route); this.el().append(s);
    this.stack=[{route, el:s, mode:"root"}];
    this.current=route; location.hash="#/"+route;
  },

  go(route, opts){
    opts=opts||{};
    if(this.busy) return; this.busy=true;
    const below=this.stack[this.stack.length-1];
    const s=this.build(route);
    const D=MS("--motion-screen"), DZ=MS("--motion-sheet-in");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    let mode = opts.cover ? "cover" : (opts.dissolve ? "dissolve" : (opts.from ? "zoom" : "slide")), origin=null;
    s.style.willChange="transform,opacity"; if(below) below.el.style.willChange="transform,opacity";
    const done=()=>{ s.style.transition=""; s.style.willChange=""; if(below) below.el.style.willChange=""; this.busy=false; };

    /* HIG Modality — полноэкранная модалка приходит снизу и снизу же уходит.
       Экран под ней остаётся на месте: он не «уехал назад», он накрыт (реестр №37). */
    if(mode==="cover"){
      /* решение 17.34 — полноэкранная модалка идёт по стандартной кривой: перелёт `ease-sheet`
         уместен на шторке в полэкрана, а на всём экране читается как дрожь */
      s.style.transform="translateY(100%)";
      this.el().append(s); void s.offsetWidth;
      requestAnimationFrame(()=>{
        s.style.transition="transform "+DZ+"ms "+ease;
        s.style.transform="translateY(0)";
      });
      setTimeout(done, DZ+20);
    }else if(mode==="dissolve"){
      /* решение 17.34 — спуск → проявление: в видоискателе и в проявлении одна и та же
         фотография, она остаётся на месте, меняется только интерфейс вокруг */
      s.style.opacity="0";
      this.el().append(s); void s.offsetWidth;
      requestAnimationFrame(()=>{
        s.style.transition="opacity "+D+"ms "+ease;
        s.style.opacity="1";
      });
      setTimeout(()=>{ if(below) below.el.style.visibility="hidden"; done(); }, D+20);
    }else if(mode==="zoom"){
      const dev=document.getElementById("device").getBoundingClientRect();
      const r=opts.from.getBoundingClientRect();
      origin={cx:r.left-dev.left+r.width/2, cy:r.top-dev.top+r.height/2, scale:Math.max(.08, r.width/dev.width)};
      s.style.transformOrigin=origin.cx+"px "+origin.cy+"px";
      s.style.transform="scale("+origin.scale+")";
      s.style.opacity="0";
      this.el().append(s); void s.offsetWidth;
      requestAnimationFrame(()=>{
        s.style.transition="transform "+DZ+"ms "+ease+", opacity "+DZ+"ms "+ease;
        s.style.transform="scale(1)"; s.style.opacity="1";
      });
      setTimeout(done, DZ+20);
    }else{
      s.style.transform="translateX(100%)";
      this.el().append(s); void s.offsetWidth;
      requestAnimationFrame(()=>{
        s.style.transition="transform "+D+"ms "+ease;
        s.style.transform="translateX(0)";
        if(below){ below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
          below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6"; }
      });
      setTimeout(done, D+20);
    }
    this.stack.push({route, el:s, mode, origin, from:opts.from||null});
    this.current=route; location.hash="#/"+route;
    return s;
  },

  back(){
    if(this.stack.length<2 || this.busy) return; this.busy=true;
    const top=this.stack.pop(), below=this.stack[this.stack.length-1];
    const D=MS("--motion-screen"), DZ=MS("--motion-sheet-in");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    void top.el.offsetWidth;
    if(top.mode!=="cover" && top.mode!=="dissolve"){
      below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      below.el.style.transform="translateX(0)"; below.el.style.opacity="1";
    }
    if(top.mode==="dissolve"){
      below.el.style.visibility="";
      top.el.style.transition="opacity "+D+"ms "+ease; top.el.style.opacity="0";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, D+20);
    }else if(top.mode==="cover"){
      const OUT=MS("--motion-sheet-out");
      const easeAccel=getComputedStyle(document.documentElement).getPropertyValue("--ease-accel");
      top.el.style.transition="transform "+OUT+"ms "+easeAccel;
      top.el.style.transform="translateY(100%)";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, OUT+20);
    }else if(top.mode==="zoom" && top.origin){
      top.el.style.transition="transform "+DZ+"ms "+ease+", opacity "+DZ+"ms "+ease;
      top.el.style.transform="scale("+top.origin.scale+")"; top.el.style.opacity="0";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, DZ+20);
    }else{
      top.el.style.transition="transform "+D+"ms "+ease;
      top.el.style.transform="translateX(100%)";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, D+20);
    }
    this.current=below.route; location.hash="#/"+below.route;
  },

  /* заменить верхний экран без анимации (например 06 → 06a после Keep as today) */
  swapTop(route){
    const top=this.stack.pop(); if(top) top.el.remove();
    const s=this.build(route); this.el().append(s);
    this.stack.push({route, el:s, mode:"slide"});
    this.current=route; location.hash="#/"+route;
  }
};

/* --- интерактивный свайп от края (решение 13.4, реестр №3) ---------------
   Жест ведёт ровно ту анимацию, которой экран был открыт: слайд — слайдом,
   zoom — обратным зумом. «Назад — зеркало того, как вошёл» держится и жестом. */
(function edgeSwipe(){
  const dev=document.getElementById("device");
  let act=false, x0=0, t0=0, dx=0, top=null, below=null;
  const W=()=>dev.getBoundingClientRect().width;

  const start=e=>{
    if(Router.busy || Router.stack.length<2) return;
    if(document.querySelector("#sheetLayer .Sheet")) return;
    const p=e.touches?e.touches[0]:e;
    const rel=p.clientX-dev.getBoundingClientRect().left;
    if(rel>20) return;
    act=true; x0=p.clientX; t0=Date.now(); dx=0;
    top=Router.stack[Router.stack.length-1]; below=Router.stack[Router.stack.length-2];
    top.el.style.transition="none"; below.el.style.transition="none";
  };
  const move=e=>{
    if(!act) return;
    const p=e.touches?e.touches[0]:e;
    dx=Math.max(0,p.clientX-x0);
    const k=Math.min(1, dx/W());
    if(top.mode==="zoom" && top.origin){
      const s=1+(top.origin.scale-1)*k;
      top.el.style.transform="scale("+s+")"; top.el.style.opacity=String(1-k*0.9);
    }else{
      top.el.style.transform="translateX("+dx+"px)";
      below.el.style.transform="translateX("+(-30+30*k)+"%)";
      below.el.style.opacity=String(.6+.4*k);
    }
    if(e.cancelable) e.preventDefault();
  };
  const end=()=>{
    if(!act) return; act=false;
    const v=dx/Math.max(1,Date.now()-t0);
    top.el.style.transition=""; below.el.style.transition="";
    if(dx>W()*0.3 || v>0.5){
      top.el.style.transform=""; top.el.style.opacity="";
      below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6";
      Router.back();
    }else{
      const D=MS("--motion-menu");
      const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
      top.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      top.el.style.transform= top.mode==="zoom" ? "scale(1)" : "translateX(0)";
      top.el.style.opacity="1";
      below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6";
      setTimeout(()=>{ top.el.style.transition=""; below.el.style.transition=""; }, D+20);
    }
  };
  dev.addEventListener("touchstart",start,{passive:true});
  dev.addEventListener("touchmove",move,{passive:false});
  dev.addEventListener("touchend",end);
  dev.addEventListener("mousedown",start);
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
})();

/* --- часы и отсчёт: один таймер на всё приложение (правило 4 карты) ------- */
const Countdown = {
  subs:new Set(),
  fmt(){ const s=S.countdown; const h=String(Math.floor(s/3600)).padStart(2,"0");
    const m=String(Math.floor(s%3600/60)).padStart(2,"0"); const q=String(s%60).padStart(2,"0");
    return h+":"+m+":"+q; },
  tick(){
    S.countdown = S.countdown>0 ? S.countdown-1 : 24*3600;
    const t=this.fmt();
    document.querySelectorAll("[data-countdown]").forEach(n=>{ n.textContent=t; });
  }
};
setInterval(()=>Countdown.tick(), 1000);

/* Центровка содержимого по высоте — применяется только к 03 (правка владельца).
   Оборачивает уже собранное содержимое в .Screen__mid: есть слак — блок встаёт по центру,
   кончился — обычный скролл сверху вниз. justify-content:center здесь нельзя,
   он обрезал бы верх при длинном содержимом. */
function centerBox(w){
  const mid=el("div","Screen__mid");
  while(w.firstChild) mid.append(w.firstChild);
  w.append(mid);
  w.classList.add("Screen__scroll--center");
}
function scrollBox(s, tabId, flush){

  s.append(w);
  if(tabId){ s.append(el("div","ScrimBottom")); s.append(UI.TabBar(tabId)); }
  return w;
}

/* три версии одного кадра: оригинал · дневной апгрейд · эффект (решения 15.6, 10.20).
   Зерно заглушки — today-original: один сюжет во всех состояниях (решение 17.1). */
const VERSION_OPTS=[null,{seed:"today-original",variant:"upgraded"},{seed:"today-original",variant:"effect"}];

/* позиция сегмента → кадр и вариант заглушки. Ключ — индекс, а не подпись:
   третья позиция называется именем купленного эффекта, а не всегда «Snow globe» */
const FRAME_VERSIONS=[
  {src:"today-original", opts:VERSION_OPTS[0]},
  {src:"today",          opts:VERSION_OPTS[1]},
  {src:"fx-after",       opts:VERSION_OPTS[2]}
];
/* Имя эффекта берётся из плитки каталога, а не из фикстуры (находка QA №2):
   фикстура одна на каталог, кадр тоже один — fx-after, это осознанный срез.
   todayPreset несёт маркер "EXTRA", имя живёт отдельно в effectName. */
const presetId    = n => String(n||"").toLowerCase().replace(/[^a-z]+/g,"_");
const effectTitle = ()=> S.effectName || "Snow globe";
const effectUpper = ()=> effectTitle().toUpperCase();
const effectPrice = ()=> S.effectPrice || 4;
const isExtra     = ()=> S.todayPreset==="EXTRA";
/* подстановка имени поверх фикстуры эффекта: preset, preset_id и подписи стадий */
/* Темп только для автодемо (?demo). Круг крутится на обложке кейса и должен укладываться
   в ~25 с, а человек, идущий прототипом руками, обязан получить прежние длительности:
   рендер, который «думает» полсекунды, читается как подделка.
   Порог снизу — кросс-фейд проявления: он идёт `latency_ms − --motion-reveal-hold`,
   при 0.6 это 1800 мс, то есть выше 1500, ниже которых разница между «до» и «после»
   перестаёт читаться и переключатель теряет смысл (решения 17.2, 15.6).
   Три стадии рендера при этом остаются различимы: 540 · 1260 · 600 мс. */
const DEMO_PACE = {
  /* решение 17.28 — кросс-фейд 2.5 с: latency − --motion-reveal-hold(600) = 2500.
     Главный кадр продукта: зритель должен увидеть, как результат наезжает на оригинал,
     а не как он мигает. В руках остаются прежние 4000 / 3.4 с. */
  latency:3500,
  stages:700      /* три стадии суммарно; каждая не короче 150 мс, иначе это мигание, а не процесс */
};

/* Решение 17.28 — переходы в демо идут примерно в 1.6 раза медленнее, чем в руках.
   Причина не в паузах: человек, нажавший сам, ждёт результата и короткий переход ему в помощь;
   зритель чужого прогона не знает, когда переход начнётся, и не успевает на него посмотреть.
   Значения 17.27 остаются действующими для ручного прохода — здесь только подмена
   на время, пока крутится демо. Зум от миниатюры идёт по sheet-in и растёт вместе с ним. */
const DEMO_MOTION = {
  "--motion-screen":"560ms",
  "--motion-sheet-in":"640ms",
  "--motion-sheet-out":"480ms",
  "--motion-menu":"400ms",
  "--motion-alert":"320ms"
};
function demoPace(fx){
  if(!fx || !Demo.on || !fx.stages) return fx;
  const c=Object.assign({},fx);
  const sum=fx.stages.reduce((a,st)=>a+st.ms,0) || 1;
  const k=DEMO_PACE.stages/sum;
  c.stages=fx.stages.map(st=>Object.assign({},st,{ms:Math.max(150,Math.round(st.ms*k))}));
  if(c.latency_ms){
    if(c.slow_threshold_ms) c.slow_threshold_ms=Math.round(c.slow_threshold_ms*DEMO_PACE.latency/c.latency_ms);
    c.latency_ms=DEMO_PACE.latency;
  }
  return c;
}

function effectFixture(fx){
  if(!fx || fx.scenario!=="effect") return fx;
  const name=effectTitle(), id=presetId(name);
  const c=Object.assign({},fx);
  if(c.preset)    c.preset=name;
  if(c.preset_id) c.preset_id=id;
  if(c.title)     c.title=c.title.replace(/Snow globe/g, name);
  if(c.stages)    c.stages=c.stages.map(st=>Object.assign({},st,{label:st.label.replace(/Snow globe/g,name)}));
  if(c.result)    c.result=Object.assign({},c.result,{preset:name.toUpperCase(),preset_id:id});
  return c;
}
/* Переключатель версий кадра (реестр №33, решения 15.6, 15.14, 17.1).
   hostFn возвращает контейнер, первый ребёнок которого — текущий кадр.
   Подмена кросс-фейдом в том же размере: «свет изменился», а не прыжок вёрстки. */
function versionSegment(labels, sel, hostFn, override){
  const swap = (i, ms)=>{
    const host = hostFn(); if(!host) return;
    const v = FRAME_VERSIONS[i]; if(!v) return;
    const old = host.firstChild;
    const nf = Img.make(v.src, null, (override && override[i]) || v.opts);
    nf.classList.add("Frame--fade");
    if(ms) nf.style.transitionDuration=ms+"ms";
    host.insertBefore(nf, old ? old.nextSibling : null);
    requestAnimationFrame(()=>nf.classList.add("is-in"));
    setTimeout(()=>{
      if(old && old.parentNode===host) old.remove();
      nf.classList.remove("Frame--fade","is-in"); nf.style.transitionDuration="";
    }, (ms || MS("--motion-menu"))+40);
  };
  const g = segment(labels, sel, (i)=>swap(i));
  /* кадр и подложка едут вместе — этим пользуется показ дельты (17.32) */
  g.swapTo = (i, ms)=>{ g.select(i, ms); swap(i, ms); };
  return g;
}

/* Однократный показ дельты (решение 17.32). Проявление кончилось — кадр сам один раз
   показывает оригинал и возвращается к результату. Разницу иначе видит только тот,
   кто сам нашёл переключатель, а дельта — главный аргумент продукта (решение 15.6).
   Отмена любым касанием: слушатель на фазе захвата, как у перехвата автодемо,
   поэтому срабатывает раньше обработчиков экрана, а само касание идёт дальше.
   При prefers-reduced-motion показ не запускается вовсе: мигание кадром — ровно то,
   от чего эта настройка защищает; мгновенная подмена была бы тем же миганием. */
function deltaPeek(seg){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const dev=document.getElementById("device");
  const F=MS("--motion-delta-fade"),
        H1=MS("--motion-delta-hold-result"),
        H2=MS("--motion-delta-hold-original");
  let live=true; const timers=[];
  const stop=()=>{ if(!live) return; live=false;
    timers.forEach(clearTimeout);
    ["pointerdown","touchstart","mousedown"].forEach(t=>dev.removeEventListener(t,stop,true)); };
  ["pointerdown","touchstart","mousedown"].forEach(t=>
    dev.addEventListener(t,stop,{capture:true,passive:true}));
  /* экран мог смениться раньше, чем показ отыграл — тогда просто гасим таймеры */
  const alive=()=>live && document.contains(seg);
  timers.push(setTimeout(()=>{ if(alive()) seg.swapTo(0,F); else stop(); }, H1));
  timers.push(setTimeout(()=>{ if(alive()) seg.swapTo(1,F); else stop(); }, H1+F+H2));
  timers.push(setTimeout(stop, H1+F+H2+F+80));
}

/* --- 05 · Проявление --------------------------------------------------- */
Screens["05"]=s=>{
  const path = S._fixture || "daily-frame/success";
  const isEffect = path.indexOf("effect/")===0;
  const w=scrollBox(s,null,true);
  w.style.padding="0 0 calc(var(--size-safe-bottom) + var(--space-4))";

  const hero=el("div","Hero flush");
  const reveal=el("div","Reveal");
  /* решение 17.2 — снизу настоящий оригинал, чёткий с первого кадра;
     сверху результат, пока прозрачный. Резкость больше не изображает проявку. */
  const before=Img.make("today-original");
  const after = isEffect ? Img.make("fx-after",null,VERSION_OPTS[2])
                         : Img.make("today",   null,VERSION_OPTS[1]);
  after.classList.add("Reveal__after");
  reveal.append(before, after);
  hero.append(reveal, el("div","Hero__glow"), el("div","Scrim7"));
  const ht=el("div","Hero__text stack gap2");
  const kick=assign(el("div","t-meta c-on-image"), fmtMDup(DEMO.today)+(isEffect?" · "+effectUpper():""));
  const title=assign(el("div","t-h1 c-on-image"),"Developing…");
  ht.append(kick,title); hero.append(ht);
  w.append(hero);

  const panel=el("div","stack gap4"); panel.style.padding="var(--space-5) var(--size-gutter) 0";
  panel.style.background="var(--color-bg-primary)";   /* решение 17.46 — панель непрозрачна: ничего под ней не просвечивает ни в один момент проявления */
  w.append(panel);

  AI.load(path).then(raw=>{
    const fx = demoPace(effectFixture(raw));
    if(!fx){ panel.append(assign(el("div","t-body c-error"),"Fixture not found: "+path)); return; }
    const stages=fx.stages||[{id:"reading",label:"Reading your frame",ms:600}];
    const rs=UI.RenderStages(stages);
    panel.append(rs);
    if(!isEffect && !S._serverNoteSeen){
      panel.append(assign(el("div","t-caption c-tertiary"),
        "Your frame goes to our servers to be developed and is deleted within 24 hours."));
      S._serverNoteSeen=true;
    }
    const actions=el("div","stack gap2"); panel.append(actions);
    const cancel=UI.Button({label: isEffect? "Cancel — no charge" : "Cancel — nothing is used yet",
      variant:"text", onTap:()=>{
        ctl.cancel();
        Analytics.track("ai_response_stopped",{scenario:fx.scenario,stage:ctl.stage,quota_spent:false});
        Router.back();
      }});
    actions.append(cancel);

    title.textContent = stages[0].label.replace("…","") + "…";
    const dur = fx.latency_ms || MS("--motion-render-fast");
    /* решение 17.2 — оригинал стоит чётким --motion-reveal-hold, затем верхний слой
       набирает непрозрачность за остаток рендера: кадр и подпись доходят вместе */
    const hold = MS("--motion-reveal-hold");
    /* решение 17.50 — кросс-фейд по симметричной кривой и только с декодированным кадром:
       раньше «после» вспыхивало внутри уже полупрозрачного слоя, если файл догружался
       во время проявления, а кривая --ease-standard отдавала 70 % смены первой трети времени.
       Длительность считаем от оставшегося: кадр и подпись «готово» по-прежнему сходятся. */
    const tFade0=Date.now();
    const startFade=()=>{
      const left=Math.max(MS("--motion-menu"), dur-(Date.now()-tFade0));
      after.style.transition="opacity "+left+"ms var(--ease-crossfade)";
      void after.offsetWidth; after.style.opacity="1";
    };
    const afterImg=after.querySelector(".Frame__img");
    setTimeout(()=>{
      if(afterImg.classList.contains("is-in")) return startFade();
      const cap=setTimeout(()=>{ clearInterval(iv); startFade(); }, Math.max(0, dur-hold-MS("--motion-menu")));
      const iv=setInterval(()=>{ if(afterImg.classList.contains("is-in")){ clearInterval(iv); clearTimeout(cap); startFade(); } }, 40);
    }, hold);

    const ctl = AI.run(fx,{
      onStage(i,st){
        rs.setStage(i); title.textContent = st.label.endsWith("…") ? st.label : st.label+"…";
        if(st.id===(fx.cancelable_until||"developing")) cancel.style.display="none";
      },
      onSlow(f){
        const n=assign(el("div","t-body c-thinking"), f.slow_notice);
        panel.insertBefore(n, actions);
      },
      onDone(f){
        /* решение 17.42 — «готово» без рывка: стадии гаснут по --motion-menu, заголовок меняется
           через короткий провал прозрачности, переключатель и кнопки проявляются по --motion-sheet-in,
           автопоказ дельты стартует уже на спокойном экране */
        const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
        const DM=MS("--motion-menu"), DI=MS("--motion-sheet-in");
        const h0=panel.offsetHeight;                       /* решение 17.44 — высота до смены содержимого */
        rs.finish();
        rs.style.transition="opacity "+DM+"ms "+ease; rs.style.opacity="0";
        setTimeout(()=>rs.remove(), DM+20);
        [title,kick].forEach(n=>{ n.style.transition="opacity "+DM+"ms "+ease; n.style.opacity="0"; });
        /* проявка кончилась — сводим два слоя в один: дальше кадром правит переключатель */
        after.style.opacity="1"; setTimeout(()=>{ after.style.transition=""; }, DM);
        after.classList.remove("Reveal__after");
        if(before.parentNode) before.remove();
        const small = !!(f.result && f.result.delta==="small");
        if(small){
          const v=after.querySelector(".Frame__vig"); if(v) v.style.opacity=".22";
          const ph=after.querySelector(".Frame__ph");
          if(ph) ph.setAttribute("style", Img.phVars("today-original","small-delta"));
        }
        setTimeout(()=>{
          title.textContent = fmtMD(DEMO.today)+(isEffect?" · "+effectTitle():" · Upgraded");
          kick.textContent = f.result.confidence==="low" ? "LOW CONFIDENCE" : "READY";
          [title,kick].forEach(n=>{ n.style.opacity="1"; });
        }, DM);
        /* решения 15.6, 17.1 — пара «до / после» доступна и на бесплатном пути.
           На 05 переключатель стоит ПОД кадром, а не над ним, как на 03/06/08/14:
           кадр здесь во всю ширину и прижат к верхнему краю, над ним только
           Dynamic Island. Место названо в отчёте как расхождение с заданием. */
        if(!isEffect && !panel.querySelector(".Segment")){
          const seg=versionSegment(["Original","Upgraded"], 1, ()=>reveal,
            small ? {1:{seed:"today-original",variant:"small-delta"}} : null);
          seg.style.marginBottom="var(--space-4)";
          seg.style.opacity="0"; seg.style.transition="opacity "+DI+"ms "+ease;
          panel.insertBefore(seg, panel.firstChild); void seg.offsetWidth;
          setTimeout(()=>{ seg.style.opacity="1"; }, DM);
          setTimeout(()=>{ seg.style.transition=""; deltaPeek(seg); }, DM+DI);   /* решение 17.32 — после того как панель успокоилась */
        }
        actions.innerHTML="";
        actions.style.opacity="0"; actions.style.transition="opacity "+DI+"ms "+ease;
        setTimeout(()=>{ actions.style.opacity="1"; }, DM);
        setTimeout(()=>{ actions.style.transition=""; }, DM+DI+20);
        if(f.notice) actions.append(assign(el("div","t-body c-thinking"), f.notice));
        if(isEffect) Screens._effectDone(actions, f);
        else Screens._dailyDone(actions, f);
        /* решение 17.44 — прозрачность была сглажена, а высота нет: панель со стадиями исчезала,
           и всё под ней подпрыгивало; потом вставлялись переключатель и кнопки, и содержимое
           сдвигалось вниз. Стадии уводим из потока и гасим, а высоту панели ведём одной
           плавной кривой от старой к новой */
        panel.style.position="relative";
        rs.style.position="absolute"; rs.style.left="var(--size-gutter)"; rs.style.right="var(--size-gutter)";
        rs.style.top="var(--space-5)"; rs.style.pointerEvents="none";
        const h1=panel.offsetHeight;
        panel.style.height=h0+"px"; panel.style.overflow="hidden"; void panel.offsetWidth;
        panel.style.transition="height "+DI+"ms "+ease; panel.style.height=h1+"px";
        setTimeout(()=>{ panel.style.transition=""; panel.style.height=""; panel.style.overflow=""; }, DI+40);
      },
      onFail(f){
        rs.remove();
        /* решение 17.2 — при ошибке верхний слой уходит в ноль: остаётся чистый оригинал,
           кадр никуда не делся. Размывать его обратно было бы неправдой */
        after.style.transition="opacity var(--motion-menu) var(--ease-standard)";
        after.style.opacity="0";
        title.textContent=f.title; kick.textContent="";
        actions.innerHTML="";
        actions.append(assign(el("div","t-body c-error"), f.body||""));
        (f.actions||[]).forEach(a=>actions.append(UI.Button({label:a.label,variant:a.variant,
          onTap:()=>Screens._failAction(a.id, f)})));
      }
    });
  });
};
Screens._dailyDone=(box, f)=>{
  S.attempts++;
  box.append(UI.Button({label:"Keep in diary",onTap:()=>{
    S.todayKept=true; S.todayPreset=f.result.preset; saveState();
    Analytics.track("day_kept",{with_filter:true,restored:false});
    Analytics.track("limit_reached",{limit_type:"daily_renders"});
    Router.resetTo("03","06");
  }}));
  box.append(UI.Button({label:"Choose another photo",variant:"secondary",onTap:()=>{
    if(S.attempts>=3){ Sheets.confirmCoins({name:"Upgrade again",price:2,extra:true}); return; }
    Router.back(); Sheets.gallery("library");
  }}));
  box.append(UI.Button({label:"Keep without the upgrade",variant:"text",onTap:()=>{
    S.todayKept=true; S.todayPreset="none"; saveState();
    Analytics.track("day_kept",{with_filter:false,restored:false});
    Router.resetTo("03","06");
  }}));
  if(f.result.confidence==="low")
    box.append(UI.Button({label:"Develop again — on us",variant:"text",onTap:()=>{
      Analytics.track("result_regenerated",{reason:"low_confidence"});
      S._fixture="daily-frame/success"; Router.swapTop("05");
    }}));
  else if(S.attempts>=3)
    box.append(UI.Button({label:"Develop again · ◎ 2",variant:"text",
      onTap:()=>Sheets.confirmCoins({name:"Upgrade again",price:2,extra:true})}));
};
Screens._effectDone=(box, f)=>{
  /* находка QA №1 — цена записана при покупке в confirmCoins, здесь её не трогаем */
  S.effectPreset=f.result.preset; saveState();
  box.append(UI.Button({label:"See result",onTap:()=>Router.swapTop("14")}));
};
Screens._failAction=(id, f)=>{
  if(id==="retry"){ S._fixture = f.scenario==="effect" ? "effect/success" : "daily-frame/success";
    Router.swapTop("05"); return; }
  if(id==="nofilter"){ S.todayKept=true; S.todayPreset="none"; saveState();
    Analytics.track("day_kept",{with_filter:false,restored:false}); Router.resetTo("03","06"); return; }
  if(id==="another"){ Router.back(); Sheets.gallery("library"); return; }
  if(id==="back"){ Router.tab("effects"); return; }
};

/* --- сегмент-контрол (реестр №11) -------------------------------------- */
function segment(items, sel, onChange){
  const g=el("div","Segment");
  const ind=el("div","Segment__ind"); g.append(ind);
  items.forEach((t,i)=>{
    const b=el("button","Segment__item t-caption"); b.textContent=t;
    b.setAttribute("aria-selected", String(i===sel));
    b.addEventListener("click",()=>{ g.select(i); onChange && onChange(i,t); });
    g.append(b);
  });
  function place(i){
    const items2=g.querySelectorAll(".Segment__item");
    const r=items2[i].getBoundingClientRect(), gr=g.getBoundingClientRect();
    ind.style.left=(r.left-gr.left)+"px"; ind.style.width=r.width+"px";
  }
  /* Внешнее переключение: нужно показу дельты (17.32), чтобы подложка ехала вместе
     с кадром и теми же длительностями. Иначе контрол врёт: кадр показывает одно,
     подпись другое — и заодно теряется подсказка, что переключатель вообще есть. */
  g.select=(i, ms)=>{
    [...g.querySelectorAll(".Segment__item")].forEach((x,j)=>x.setAttribute("aria-selected",String(j===i)));
    if(ms){ ind.style.transitionDuration=ms+"ms";
            setTimeout(()=>{ ind.style.transitionDuration=""; }, ms+40); }
    place(i);
  };
  requestAnimationFrame(()=>place(sel));
  return g;
}

function shareCtx(){
  const i = S._shareDay || DEMO.dayIndex;

function recapFull(fx, captionEl){

   лежат кадры прошлых дней, они на телефоне и есть.
   Предложенный кадр — `today-original`, а не `today`: обработка происходит ПОСЛЕ выбора,
   на экране проявления. Показать обработанный кадр здесь значило бы выдать результат

Sheets.gallery = (source)=>{

(function boot(){

     Буфер событий meantime.events не трогаем — он нужен для отчёта по метрикам. */
  try{ localStorage.removeItem("meantime.state"); }catch(e){}
  S.onboarded=true;   /* 01 и 02 выпали из пути по умолчанию, живут в дев-панели */
  EventLogView.node=document.getElementById("eventLog");

  /* дев-панель: сценарии фикстур, чтобы состояния AI были достижимы вручную */
  const bar=document.querySelector(".DevBar");
  const sel=document.createElement("select");   /* стиль в CSS, не инлайном: инлайн выиграл бы у витрины */
  Object.keys(FIXTURES).forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=k; sel.append(o); });
  sel.value="daily-frame/success";
  sel.addEventListener("change",()=>{ S._fixtureOverride=sel.value; });
  bar.insertBefore(sel, bar.children[1]);
  if(qs.get("fixture")) { S._fixtureOverride=qs.get("fixture"); sel.value=qs.get("fixture"); }

  document.getElementById("devLog").addEventListener("click",()=>{
    document.getElementById("eventLog").classList.toggle("is-on"); });
  document.getElementById("eventLog").addEventListener("click",function(){ this.classList.remove("is-on"); });
  document.getElementById("devReset").addEventListener("click",()=>{
    try{ localStorage.clear(); }catch(e){} location.href=location.pathname; });

  /* решение 17.4 — онбординг и выбор периода выпали из пути по умолчанию,
     но нужны для кейса: держим их достижимыми отсюда */
  const devBtn=(label,fn)=>{ const b=document.createElement("button");
    b.textContent=label; b.addEventListener("click",fn); bar.append(b); };
  devBtn("01 Onboarding",()=>{ S.todayKept=false; S.todayPreset=null; S.attempts=0;
    saveState(); Router.reset("01"); });
  devBtn("02 Period",()=>Sheets.period(false));

  Analytics.track("session_started",{returning:false,day_index:DEMO.dayIndex,period:S.period});

  /* решение 17.11 — экран из адреса не восстанавливается: `Router` пишет hash на каждом
     переходе, и обновление страницы открывало, например, модальный 09 без таб-бара.
     Старт всегда с пустого Today; hash чистится, чтобы следующее обновление тоже начало с нуля.
     Отладочный вход — явный `?screen=NN`. Запись hash во время работы остаётся:
     на ней держится кнопка «назад» в браузере. */
  const forced=qs.get("screen");
  Router.reset(forced && Screens[forced] ? forced : "03");

  /* Пара «до / после» весит 2.4 МБ на двоих, а первый экран, которому она нужна, —
     видоискатель камеры: до него ни один кадр не показывается, и браузеру нечего кэшировать.
     На 1.5 Мбит/с это давало ~6.9 с процедурной заглушки в видоискателе (замерено).
     Греем пару сразу после сборки первого экрана, пока идёт заставка и человек читает 03.
     Последовательно, а не параллельно: `today-original` нужен первым, и делить
     на него канал с `today` смысла нет. */
  Img.probe("today-original").then(()=>Img.probe("today"));
  /* hash, записанный первым же reset, сразу стираем: обновление страницы обязано
     начинаться с нуля. Дальнейшие переходы пишут hash как раньше — на нём «назад» браузера. */
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  splash();
})();

/* ============================================================================
   §12 · АВТОДЕМО (решение 14)
   Включается ?demo или кнопкой в дев-панели. Прогоняет сквозной путь ядра
   по кругу. Любое касание или клик мгновенно останавливает демо и отдаёт
   управление человеку — без задержек, подтверждений и «доиграет шаг».
   Выключается целиком: не вызывать Demo.start() — остального кода не касается.
   ========================================================================= */
const Demo = {
  on:false, timers:[], badge:null, waiter:null,

  /* Телеметрия для страницы кейса: прототип встраивается как живой мокап с ?demo,
     рядом идёт полоса прогресса. Полоса должна идти по настоящему кругу, а не по
     своему таймеру, поэтому раз в секунду отправляем родительскому окну, где мы.
     Вне рамки не шлём ничего: слать некому. */
  /* Полный период круга вместе с паузой 1200 мс между кругами — замерено прогоном,
     два круга подряд дали одно и то же: 25.8 с (сам круг 25.4 с). Полоса на странице кейса
     берёт длительность отсюда, поэтому число обязано быть измеренным, а не прикинутым. */
  totalMs:28900,   /* 17.49: +0.4 с — оригинал стоит секунду; 17.50: +0.4 с — кросс-фейд дельты 800 мс */
  t0:0, step:"", beat:null,

  tick(){
    if(window.parent===window) return;
    try{
      parent.postMessage({
        source:"meantime-demo",
        elapsed:this.on ? Math.min(this.totalMs, Date.now()-this.t0) : 0,
        total:this.totalMs,
        on:this.on,
        step:this.step
      },"*");
    }catch(e){}
  },
  /* смена шага сообщается сразу, не дожидаясь следующей секунды */
  at(name){ this.step=name; this.tick(); },

  ui(){
    if(this.badge) return;
    const dev=document.getElementById("device");
    this.badge=el("div","DemoBadge t-caption");
    this.badge.textContent="Demo paused · tap to resume";
    this.badge.addEventListener("click",e=>{ e.stopPropagation(); this.start(); });
    dev.append(this.badge);
  },

  /* перехват — на фазе захвата, чтобы сработать раньше любого обработчика экрана */
  arm(){
    if(this._armed) return; this._armed=true;
    const stop=(e)=>{ if(this.on && !(this.badge && this.badge.contains(e.target))) this.stop(); };
    const dev=document.getElementById("device");
    ["pointerdown","touchstart","mousedown","keydown","wheel"].forEach(t=>
      dev.addEventListener(t, stop, {capture:true, passive:true}));
    document.addEventListener("keydown", stop, {capture:true});
  },

  start(){
    this.ui(); this.arm();
    this.on=true; this.badge.classList.remove("is-on");
    Object.keys(DEMO_MOTION).forEach(k=>document.documentElement.style.setProperty(k,DEMO_MOTION[k]));
    document.querySelectorAll(".DemoTap").forEach(n=>n.remove());
    if(!this.beat) this.beat=setInterval(()=>this.tick(), 1000);
    this.tick();
    this.loop();
  },

  stop(){
    if(!this.on) return;
    this.on=false;
    this.timers.forEach(clearTimeout); this.timers=[];
    if(this.waiter){ this.waiter.reject && this.waiter.reject("stopped"); this.waiter=null; }
    document.querySelectorAll(".DemoTap").forEach(n=>n.remove());
    this.badge.classList.add("is-on");
    /* зритель перехватил управление — дальше он проходит прототип руками,
       и тайминги обязаны вернуться к значениям 17.27 */
    Object.keys(DEMO_MOTION).forEach(k=>document.documentElement.style.removeProperty(k));
    /* последнее сообщение с on:false — по нему полоса на странице гаснет
       и подпись меняется на «управление у вас». В этом весь смысл перехвата */
    if(this.beat){ clearInterval(this.beat); this.beat=null; }
    this.tick();
  },

  sleep(ms){
    return new Promise((res,rej)=>{
      if(!this.on) return rej("stopped");
      const id=setTimeout(()=>{ this.waiter=null; this.on ? res() : rej("stopped"); }, ms);
      this.timers.push(id);
      this.waiter={reject:()=>{ clearTimeout(id); rej("stopped"); }};
    });
  },

  /* видимый круг в точке тапа — иначе экраны просто мигают */
  async point(node){
    if(!this.on || !node) throw "stopped";
    const dev=document.getElementById("device").getBoundingClientRect();
    const r=node.getBoundingClientRect();
    const t=el("div","DemoTap");
    t.style.left=(r.left-dev.left+r.width/2)+"px";
    t.style.top =(r.top -dev.top +r.height/2)+"px";
    document.getElementById("device").append(t);
    requestAnimationFrame(()=>t.classList.add("is-on"));
    await this.sleep(420);
    t.remove();
  },

  async tap(node){ await this.point(node); if(!this.on) throw "stopped"; node.click(); },

  /* Перезапуск круга должен быть виден. Мгновенная подмена через Router.reset в записи
     читается как поломка, даже когда всё работает: экран просто перескакивает.
     Кросс-фейд по --motion-alert (в демо 320 мс) — короткий, но достаточный,
     чтобы глаз понял, что это переход, а не сбой. */
  async fade(to){
    const st=document.getElementById("stack"), D=MS("--motion-alert");
    st.style.transition="opacity "+D+"ms "+
      getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    st.style.opacity=String(to);
    await this.sleep(D);
    if(to===1){ st.style.transition=""; st.style.opacity=""; }
  },

  btn(label){
    const n=[...document.querySelectorAll(".Button__label")]
      .find(x=>x.textContent.trim()===label);
    return n ? n.closest(".Button") : null;
  },
  /* ждём появления элемента, но не бесконечно — демо не должно зависать */
  async until(fn, limit=9000){
    const t0=Date.now();
    while(this.on){
      const v=fn(); if(v) return v;
      await this.sleep(120);
      if(Date.now()-t0>limit) throw "timeout";
    }
    throw "stopped";
  },

  async loop(){
    try{
      while(this.on){
        await this.run();
        await this.sleep(400);          /* стык кругов: экран уже погашен, ждать нечего */
      }
    }catch(e){ if(e!=="stopped" && this.on){ console.warn("demo:",e); this.stop(); } }
  },

  /* сквозной путь ядра. Паузы стоят там, где есть что прочесть. ~45 с круг. */
  async run(){
    this.t0=Date.now(); this.at("today");
    /* экран уже затемнён хвостом прошлого круга; на первом круге гасить нечего */
    /* сброс в начало */
    Object.assign(S,{todayKept:false,todayPreset:null,attempts:0,subscriber:false,
      coins:DEMO.coinsStart,onboarded:true});
    S._fixtureOverride=null; S._fixture="daily-frame/success"; S._recapFixture="recap/success";
    document.querySelectorAll("#sheetLayer .Sheet,#sheetLayer .Scrim,.StoreKit").forEach(n=>n.remove());
    document.getElementById("sheetLayer").style.pointerEvents="none";
    Router.reset("03");
    await this.fade(1);                 /* круг открывается видимым переходом */

    /* Темп круга (решения 17.28, 17.29). Выдержки стоят ТОЛЬКО на содержательных экранах:
       поле дней, оба пейвола, композиция рекапа, результат проявления, сохранённый день.
       Три служебных места намеренно короткие и не растут: стартовый экран до нажатия,
       видоискатель камеры, пауза перед новым кругом — они ничего не рассказывают.
       Целевой вилки по длительности больше нет: выдержки выставлены по содержанию,
       круг получается такой, какой получается. Единственное защищённое место —
       кросс-фейд оригинала в результат, 2.5 с: там видна разница, ради которой всё. */
    /* 03 — карточка дня: вопрос, обещание квоты, тикающий отсчёт */
    await this.sleep(600);
    await this.tap(await this.until(()=>this.btn("Take a photo")));

    /* 04a — камера: пауза, чтобы зритель понял, что это видоискатель, а не фотография */
    this.at("camera");
    await this.until(()=>document.querySelector(".Camera__shutter"), 4000);
    await this.sleep(700);

    /* Галерея из круга убрана решением 17.25: открытие библиотеки — служебный экран,
       о продукте он не рассказывает ничего, а места занимал около трёх секунд.
       Освободившееся время ушло не в новые паузы, а в общее сокращение круга. */

    /* спуск — первый шаг core-flow, ради которого и заведён экран камеры */
    this.at("shutter");
    await this.tap(await this.until(()=>document.querySelector(".Camera__shutter")));

    /* 05 — проявление идёт своим ходом: этапы, строка про 24 часа */
    this.at("reveal");
    await this.until(()=>this.btn("Keep in diary"), 14000);
    /* Ждём, пока отыграет показ дельты (17.32), и только потом уходим: при короткой
       выдержке демо покидало 05 раньше, чем показ успевал начаться, и зритель его не видел.
       Считаем от токенов, а не числом, чтобы не разъехалось при следующей правке темпа. */
    await this.sleep(MS("--motion-delta-hold-result")+MS("--motion-delta-fade")*2
                     +MS("--motion-delta-hold-original")+1000);   /* 17.43: результат стоит 1 с после показа */
    await this.tap(this.btn("Keep in diary"));

    /* 06 — день сохранён: подпись кадра, счётчик, блок TOMORROW */
    this.at("kept");
    await this.sleep(2500);          /* сохранённый день со счётчиком (17.43) */
    await this.tap(await this.until(()=>this.btn("Open diary")));

    /* 07 — полка итогов и поле периода */
    this.at("diary");
    await this.sleep(4000);          /* поле дней — тезис продукта (17.43) */

    /* Пропущенный день с меткой +3 (9 сентября). За один шаг рассказывает три вещи,
       которых в круге не было: пропуск виден и ничего не обнуляет · приложение знает,
       что кадры того дня лежат на телефоне · догрузка стоит подписки.
       Заодно круг начинает показывать оба слоя монетизации, мягкий и сильный. */
    this.at("missed");
    const miss=await this.until(()=>
      document.querySelector('.DayCell[data-state="skipped-available"][data-day="36"]'));
    miss.scrollIntoView({block:"center",behavior:"smooth"});
    await this.sleep(450);
    await this.tap(miss);

    this.at("softPaywall");
    await this.until(()=>document.querySelector("#sheetLayer .Sheet"), 4000);
    await this.sleep(1500);          /* пейвол показывает, что экран есть; читать его будут на живом прототипе */
    await this.tap(await this.until(()=>this.btn("Not now")));
    await this.sleep(300);

    const card=await this.until(()=>document.querySelector(".RecapCard"));
    card.scrollIntoView({block:"center",behavior:"smooth"});
    await this.sleep(400);
    await this.tap(card);

    /* 10 — рекап во весь экран, через 600 мс приходит пейвол */
    this.at("recap");
    await this.sleep(4000);           /* композиция рекапа (17.43) */
    await this.until(()=>document.querySelector("#sheetLayer .Sheet"), 4000);
    await this.sleep(1000);           /* цены и список видны с первого взгляда; читают на живом прототипе */
    this.at("paywall");
    /* Тап по годовому плану убран: он выбран по умолчанию, нажатие ничего не меняло,
       и зритель считывал это как «нажали, а экран не отреагировал». */
    await this.tap(await this.until(()=>this.btn("Not now")));
    await this.fade(0);                 /* гасим сразу, без паузы на пустом экране */
  }
};
/* Панель витрины (решение 17.31). Строка состояния и доступность кнопки идут за Demo:
   пока круг крутится — «прототип проходит путь сам», кнопка выключена; как только зритель
   касается экрана и перехватывает управление — «управление у вас», кнопка снова живая.
   Перехват уже работает по реестру №31, здесь только отражение состояния. */
const StagePanel = {
  btn:null, note:null,
  init(){
    this.btn=document.getElementById("stageDemo");
    this.note=document.getElementById("stageNote");
    if(!this.btn) return;
    this.btn.addEventListener("click",()=>{ Demo.start(); this.sync(); });
    setInterval(()=>this.sync(), 400);
    this.sync();
  },
  sync(){
    if(!this.btn) return;
    const on = Demo.on;
    this.btn.disabled = on;
    this.btn.textContent = on ? "Идёт демо" : (this._ran ? "Ещё раз ↻" : "Демо ↻");
    if(on) this._ran = true;
    this.note.textContent = on ? "Прототип проходит путь сам. Коснитесь экрана — управление вернётся."
                               : (this._ran ? "Управление у вас." : "Экран кликабельный. Или посмотрите круг целиком.");
  }
};

(function demoBoot(){
  const qs=new URLSearchParams(location.search);
  const bar=document.querySelector(".DevBar");
  if(bar){
    const b=document.createElement("button");
    b.textContent="Run demo";
    b.addEventListener("click",()=>Demo.start());
    bar.append(b);
  }
  StagePanel.init();
  /* Автодемо стартует само только по ?demo — так кейс встраивает прототип в рамку.
     По прямой ссылке круг запускает человек кнопкой на панели витрины (решение 17.31). */
  /* решение 17.38 — на телефоне по прямой ссылке демо само не стартует, даже с ?demo в адресе:
     параметр тянется из рамки кейса, и человек, открывший адрес рамки, получал чужой прогон */
  const demoAllowed = window.parent!==window || matchMedia("(min-width:621px) and (min-height:901px) and (hover:hover)").matches;
  if(qs.get("demo")!==null && demoAllowed) setTimeout(()=>Demo.start(), SPLASH_MS()+MS("--motion-alert"));
})();
</script>
