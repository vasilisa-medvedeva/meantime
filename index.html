<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07090F">
<title>Meantime — prototype</title>
<style>
/* ============================================================================
   §1 · ТОКЕНЫ
   Источник: Figma Variables, коллекция «Meantime · Observatory»
   VariableCollectionId:86:2 · режим Dark · code syntax WEB
   Имя переменной перенесено один в один: color/bg/primary → --color-bg-primary
   ========================================================================= */
:root{
  /* --- цвет · 22 --- */
  --color-bg-primary:#07090F;
  --color-bg-gradient-top:#131C33;
  --color-bg-scrim-bottom:rgba(7,9,15,.92);
  --color-surface-raised:#101420;
  --color-surface-day-empty:#141824;
  --color-glass-fill:rgba(255,255,255,.08);
  --color-glass-floor:rgba(0,0,0,.40);
  --color-glass-hairline:rgba(255,255,255,.14);
  --color-glass-specular:rgba(255,255,255,.22);
  --color-border-default:rgba(255,255,255,.10);
  --color-text-primary:#EEF2FB;
  --color-text-secondary:#9AA6BF;
  --color-text-tertiary:#77839C;
  --color-text-on-image:#FFFFFF;
  --color-text-inverse:#07090F;
  --color-accent-default:#8FB3FF;
  --color-accent-glow:#4A6BE0;
  --color-accent-wash:rgba(143,179,255,.12);
  --color-ai-thinking:#6E8CFF;
  --color-ai-error:#FF8A7A;
  --color-scrim-image-zero:rgba(0,0,0,0);
  --color-scrim-image-strong:rgba(0,0,0,.90);

  /* --- space · 9 (шкала 4, ритм 8) --- */
  --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;

  /* --- radius · 5 --- */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:26px; --radius-full:999px;

  /* --- size · 12 --- */
  --size-tap-min:44px;      --size-button-h:50px;
  --size-day-cell:40px;     --size-day-step:48px;
  --size-tabbar-w:300px;    --size-tabbar-h:56px;
  --size-recap-card-w:224px;--size-recap-h:152px;   --size-recap-spine-w:36px;
  --size-hairline:1px;      --size-safe-top:59px;   --size-safe-bottom:34px;

  /* --- blur · 4 --- */
  --blur-glass:24px; --blur-glass-dense:32px; --blur-glow-sm:12px; --blur-glow-lg:28px;

  /* --- эффект-стили · 5 --- */
  --effect-glass:blur(var(--blur-glass)) saturate(160%);
  --effect-glass-dense:blur(var(--blur-glass-dense)) saturate(140%);
  --effect-glow-accent-sm:0 0 var(--blur-glow-sm) rgba(74,107,224,.55);
  --effect-glow-accent-lg:0 0 20px 2px rgba(74,107,224,.90), 0 0 36px 6px rgba(143,179,255,.45);
  --effect-chrome-shadow:0 8px 24px rgba(0,0,0,.55);

  /* ==========================================================================
     расширение прототипа — НЕ из Figma (решение 13)
     Каждая величина с источником. Кандидаты в коллекцию «Meantime · Observatory».
     ======================================================================= */
  --size-frame-w:390px;          /* решение 5.1 — кадр iOS */
  --size-frame-h:844px;          /* решение 5.1 */
  --size-gutter:var(--space-6);  /* поле 24…366, ux-brief «Общее для всех экранов» */
  --size-hero-h:560px;           /* ui-spec §05 — кадр 390×560 */
  --size-hero-day-h:520px;       /* ux-brief §08 — кадр 390×520 */
  --size-frame-square:342px;     /* ui-spec §06 — кадр 342×342 */
  --size-frame-square-sm:300px;  /* ui-spec §06a — кадр ужат до 342×300 */
  --size-filter-img-h:240px;     /* ui-spec §03 — образец кадра 342×240 */
  --size-recap-comp-h:250px;     /* ui-spec §10 — композиция 342×250 */
  --size-sheet-medium:440px;     /* компонент Sheet 95:14 */
  --size-sheet-large:720px;      /* компонент Sheet 95:14 */
  --size-effect-tile-h:190px;    /* ux-brief §11 — плитка 165×190 */
  --size-effect-prev-h:108px;    /* ux-brief §11 — превью 145×108 */
  --size-share-card-w:252px;     /* ux-brief §09 — карточка 9:16 */
  --size-share-card-h:448px;     /* ux-brief §09 */
  --size-pick-tile:110px;        /* ux-brief §04 — плитки ряда 110×110 */
  --size-pick-cell:94px;         /* ux-brief §04 — ячейка сетки 94 */
  --size-tomorrow-h:56px;        /* ui-spec §06 — блок TOMORROW сжат до 56 */

  /* моушен · hig-numbers.md + Material 3 Motion — interaction-registry.md */
  --motion-micro:100ms;  --motion-icon:150ms;  --motion-alert:200ms;
  --motion-menu:250ms;   --motion-sheet-out:300ms; --motion-screen:350ms;
  --motion-sheet-in:400ms;
  --motion-render-fast:4000ms; --motion-render-quality:6000ms;
  --motion-stream-char:22ms;
  --ease-standard:cubic-bezier(.32,.72,0,1);
  --ease-sheet:cubic-bezier(.34,1.2,.64,1);
  --ease-accel:cubic-bezier(.3,0,.8,.15);

  --blur-tabbar-glow:9px;      /* Figma 90:26 — feGaussianBlur stdDeviation 9; в blur/* такого нет */
  --size-tabbar-glow:56px;     /* Figma 90:26 — эллипс 56×56, центр на иконке (y −8 + 28 = 20) */
  --size-daycell-month-label:9px; /* решение 15.10 — «SEP 1» в 11 pt не влезает в ячейку 40;
                                     9 pt — названный владельцем пол, ниже не опускаемся */
  --size-device-radius:47px;   /* физический радиус угла iPhone — рамка показа, не продукт */
  --radius-indicator:3px;      /* индикаторы статус-бара — служебный chrome, не продуктовый радиус */
  --radius-hairline:1px;

  /* скрим на кадре: в Figma заведены только две крайние точки
     (color/scrim/image-zero и image-strong). Пять промежуточных стопов —
     это семь-стоповый градиент из ui-spec «Текст на кадре»; заводим их явно. */
  --color-scrim-image-1:rgba(0,0,0,.80);
  --color-scrim-image-2:rgba(0,0,0,.64);
  --color-scrim-image-3:rgba(0,0,0,.44);
  --color-scrim-image-4:rgba(0,0,0,.18);
  --color-scrim-image-5:rgba(0,0,0,.04);
  --color-scrim-sheet:rgba(0,0,0,.42);        /* затемнение под шторкой — с макета 107:78 */
  --color-scrim-corner:rgba(0,0,0,.55);       /* угловой скрим под вотермарком, ui-spec §06 */
  --color-scrim-kicker-fallback:rgba(0,0,0,.60); /* фолбэк решения 10.14, если все кадры ярче #CC */
  --color-bezel-outer:color-mix(in srgb,var(--color-text-primary) 6%,var(--color-bg-primary));
  --color-bezel-inner:color-mix(in srgb,var(--color-text-primary) 12%,var(--color-bg-primary));
  --color-devpanel-bg:color-mix(in srgb,var(--color-bg-primary) 94%,transparent);

  /* шрифтовой стек · hig-numbers.md. SF Pro в коде, Inter — фолбэк (решение 10.1) */
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
}

/* ============================================================================
   §2 · БАЗА И CHROME
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--color-bg-primary);
  font-family:var(--font-ui);
  color:var(--color-text-primary);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0;padding:0}

/* --- текстовые стили · 8, из Figma text styles --- */
.t-display{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.4px}
.t-h1{font-size:22px;line-height:28px;font-weight:600;letter-spacing:0}
.t-h2{font-size:17px;line-height:22px;font-weight:600;letter-spacing:0}
.t-body{font-size:17px;line-height:22px;font-weight:400;letter-spacing:0}
.t-caption{font-size:13px;line-height:18px;font-weight:400;letter-spacing:0}
.t-meta{font-size:11px;line-height:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase}
/* решение 10.4 / долг 10.15 — табличные цифры обязательны, в Figma их включить нельзя */
.t-counter{font-size:17px;line-height:22px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.t-counter-meta{font-size:11px;line-height:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.c-primary{color:var(--color-text-primary)}
.c-secondary{color:var(--color-text-secondary)}
.c-tertiary{color:var(--color-text-tertiary)}
.c-accent{color:var(--color-accent-default)}
.c-on-image{color:var(--color-text-on-image)}
.c-error{color:var(--color-ai-error)}
.c-thinking{color:var(--color-ai-thinking)}

/* --- сцена и устройство --- */
.Stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--space-4)}
.Device{
  position:relative;
  width:var(--size-frame-w);height:var(--size-frame-h);
  border-radius:var(--size-device-radius);overflow:hidden;
  background:var(--color-bg-primary);
  box-shadow:0 0 0 10px var(--color-bezel-outer), 0 0 0 12px var(--color-bezel-inner), var(--effect-chrome-shadow);
  touch-action:pan-y;
}
@media (max-width:460px),(max-height:900px){
  .Stage{gap:0}
  .Device{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .DevBar{display:none!important}
}

.ScreenStack{position:absolute;inset:0}
.Screen{
  position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(180deg,var(--color-bg-gradient-top) 0%,var(--color-bg-primary) 42%);
  will-change:transform,opacity;
}
.Screen__scroll{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:calc(var(--size-safe-top) + var(--space-2)) var(--size-gutter) calc(var(--size-safe-bottom) + var(--space-6));
}
.Screen__scroll--tab{padding-bottom:calc(var(--size-safe-bottom) + var(--size-tabbar-h) + var(--space-10))}
.Screen__scroll--flush{padding-left:0;padding-right:0}
.Screen__scroll--flush > *{padding-left:var(--size-gutter);padding-right:var(--size-gutter)}
.Screen__scroll--flush > .flush{padding-left:0;padding-right:0}

/* нижний скрим — третья правка решения 10.10: тёмный низ на любом положении скролла */
.ScrimBottom{
  position:absolute;left:0;right:0;bottom:0;height:190px;pointer-events:none;z-index:3;
  background:linear-gradient(180deg,transparent 0%,var(--color-bg-scrim-bottom) 78%);
}

/* --- статус-бар и home indicator (глобальный chrome) --- */
.StatusBar{
  position:absolute;top:0;left:0;right:0;height:var(--size-safe-top);z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--space-6) 0 var(--space-8);pointer-events:none;
}
.StatusBar__time{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0;pointer-events:auto;cursor:default}
.StatusBar__island{
  position:absolute;left:50%;transform:translateX(-50%);top:11px;
  width:124px;height:36px;border-radius:var(--radius-full);background:var(--color-text-inverse);
}
.StatusBar__ind{display:flex;align-items:center;gap:var(--space-1)}
.StatusBar__bar{width:17px;height:11px;border-radius:var(--radius-indicator);background:var(--color-text-primary);opacity:.55}
.StatusBar__bat{width:25px;height:12px;border-radius:var(--radius-indicator);border:1.5px solid var(--color-text-primary);opacity:.9;position:relative}
.StatusBar__bat::after{content:"";position:absolute;inset:1.5px;right:6px;background:var(--color-text-primary);border-radius:var(--radius-hairline)}
.HomeInd{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:140px;height:5px;border-radius:var(--radius-full);
  background:var(--color-text-primary);opacity:.35;z-index:45;pointer-events:none;
}

/* --- слои --- */
.SheetLayer,.BannerLayer{position:absolute;inset:0;z-index:30;pointer-events:none}
.BannerLayer{z-index:44}

/* ============================================================================
   §3 · КОМПОНЕНТЫ · 10 штук, 42 варианта — один в один с Figma
   ========================================================================= */

/* --- Button · 88:50 · Variant × State (12) ------------------------------- */
.Button{
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  width:100%;min-height:var(--size-button-h);height:var(--size-button-h);
  border-radius:var(--radius-full);
  font-size:17px;line-height:22px;font-weight:600;
  transition:transform var(--motion-micro) var(--ease-standard),
             opacity var(--motion-micro) var(--ease-standard),
             background-color var(--motion-micro) var(--ease-standard);
  user-select:none;
}
.Button[data-variant="primary"]{background:var(--color-accent-default);color:var(--color-text-inverse)}
.Button[data-variant="secondary"]{
  background:var(--color-glass-fill);color:var(--color-text-primary);
  border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass);-webkit-backdrop-filter:var(--effect-glass);
  position:relative;isolation:isolate;
}
/* «пол» решения 10.10 — вторичная кнопка стоит на кадре, фон под ней непредсказуем */
.Button[data-variant="secondary"]::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--color-glass-floor);z-index:-1;
}
.Button[data-variant="text"]{
  background:none;color:var(--color-accent-default);height:var(--size-tap-min);min-height:var(--size-tap-min);
}
.Button[data-state="pressed"],.Button:active{transform:scale(.97);opacity:.8}
.Button[data-state="disabled"]{
  background:var(--color-surface-raised);color:var(--color-text-tertiary);
  border-color:var(--color-border-default);pointer-events:none;transform:none;opacity:1;
}
.Button[data-state="disabled"]::before{background:none}
.Button[data-state="loading"]{pointer-events:none}
.Button[data-state="loading"] .Button__label{visibility:hidden}
.Button[data-state="loading"]::after{
  content:"";position:absolute;width:20px;height:20px;border-radius:var(--radius-full);
  border:2px solid currentColor;border-top-color:transparent;animation:spin 800ms linear infinite;
}
.Button{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- DayCell · 89:16 · State (6) ---------------------------------------- */
.DayCell{
  position:relative;width:var(--size-day-cell);height:var(--size-day-cell);
  border-radius:var(--radius-sm);overflow:visible;
  background:var(--color-surface-day-empty);
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--motion-micro) var(--ease-standard);
}
.DayCell::after{ /* тап-зона 44 при ячейке 40 — вылет псевдоэлементом, шаг 48 не трогаем */
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--size-tap-min);height:var(--size-tap-min);
}
.DayCell .Frame{border-radius:var(--radius-sm);overflow:hidden;position:absolute;inset:0}
.DayCell[data-state="kept"],.DayCell[data-state="kept-extra"],.DayCell[data-state="today"]{cursor:pointer}
.DayCell[data-state="kept"]:active,.DayCell[data-state="kept-extra"]:active,
.DayCell[data-state="today"]:active,.DayCell[data-state="skipped-available"]:active{transform:scale(.94)}
/* Kept-extra — единственная тихая точка в продукте (решение 9.2) */
.DayCell[data-state="kept-extra"]::before{
  content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;z-index:2;
  border-radius:var(--radius-full);background:var(--color-accent-default);
  box-shadow:var(--effect-glow-accent-sm);
}
/* Today — свечение, а не толщина обводки (решение 10.12) */
.DayCell[data-state="today"]{
  box-shadow:var(--effect-glow-accent-lg);
  outline:2px solid var(--color-accent-default);outline-offset:0;
}
/* Skipped-available — «+N» приглашением, без обводки (решения 10.7, 10.8) */
.DayCell[data-state="skipped-available"]{
  color:var(--color-accent-default);cursor:pointer;
  box-shadow:var(--effect-glow-accent-sm);
}
/* Future и Skipped-empty совпадают попиксельно — намеренно (решения 4.5, 10.7) */
.DayCell[data-state="future"],.DayCell[data-state="skipped-empty"]{background:var(--color-surface-day-empty)}
/* решение 15.5 — число дня месяца, только на ячейках с кадром.
   Текст лежит на кадре без плашки (10.11): читаемость угловым скримом,
   у которого нет видимого начала, — тот же приём, что у вотермарка. */
.DayCell__num{
  position:absolute;left:4px;bottom:2px;z-index:2;
  color:var(--color-text-on-image);
  text-shadow:0 1px 4px var(--color-scrim-image-strong);
  pointer-events:none;
}
.DayCell__num--month{
  font-size:var(--size-daycell-month-label);letter-spacing:.4px;
}
.DayCell__numScrim--wide{width:100%}
.DayCell__numScrim{
  position:absolute;left:0;bottom:0;width:75%;height:55%;z-index:1;pointer-events:none;
  border-radius:0 0 0 var(--radius-sm);
  background:radial-gradient(130% 130% at 0% 100%,
    var(--color-scrim-image-strong) 0%, var(--color-scrim-image-zero) 72%);
}

/* --- TabBar · 90:56 · Active (3) ---------------------------------------- */
.TabBar{
  position:absolute;bottom:calc(var(--size-safe-bottom) + var(--space-2));left:50%;
  transform:translateX(-50%);
  width:var(--size-tabbar-w);height:var(--size-tabbar-h);z-index:20;
  border-radius:var(--radius-full);
  background:var(--color-glass-fill);
  border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass);-webkit-backdrop-filter:var(--effect-glass);
  box-shadow:var(--effect-chrome-shadow);
  display:flex;isolation:isolate;overflow:hidden;
}
.TabBar::before{content:"";position:absolute;inset:0;background:var(--color-glass-floor);z-index:-1}
/* свечение — ровно как в Figma 90:26: круг 56, accent/glow 55 %, размытие 9.
   Свою версию (жёсткий диск 34 pt + двойная тень) убрал: под стеклом она читалась
   тёмным пятном, которого в макете нет. Геометрия и поведение прежние — центр на иконке,
   едет вместе с активным табом. */
.TabBar__glow{
  position:absolute;top:20px;left:0;
  width:var(--size-tabbar-glow);height:var(--size-tabbar-glow);
  transform:translate(-50%,-50%);border-radius:var(--radius-full);
  background:var(--color-accent-glow);opacity:.55;
  filter:blur(var(--blur-tabbar-glow));
  transition:left var(--motion-menu) var(--ease-standard);pointer-events:none;
}
.TabBar__item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--color-text-secondary); /* решение 10.10 — неактивный таб на secondary, не tertiary */
  transition:color var(--motion-icon) var(--ease-standard);
  z-index:1;
}
.TabBar__item[aria-selected="true"]{color:var(--color-accent-default)}
.TabBar__icon{width:22px;height:22px;display:block;transition:transform var(--motion-icon) var(--ease-standard)}
.TabBar__item:active .TabBar__icon{transform:scale(.9)}

/* --- RecapCard · 91:21 · State (2) -------------------------------------- */
.RecapCard{
  position:relative;flex:0 0 auto;
  width:var(--size-recap-card-w);height:var(--size-recap-h);
  border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;
  background:var(--color-surface-raised);
  transition:transform var(--motion-micro) var(--ease-standard);
}
.RecapCard:active{transform:scale(.98)}
.RecapComp{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.RecapComp .Frame{border-radius:0}
/* решение 10.11 — текст на кадре, без плашки; скрим в семь стопов, чтобы у него не было начала */
.Scrim7{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,
    var(--color-scrim-image-strong) 0%,
    var(--color-scrim-image-1) 14%,
    var(--color-scrim-image-2) 28%,
    var(--color-scrim-image-3) 40%,
    var(--color-scrim-image-4) 55%,
    var(--color-scrim-image-5) 75%,
    var(--color-scrim-image-zero) 100%);
}
.RecapCard__text{position:absolute;left:var(--space-3);right:var(--space-3);bottom:var(--space-3);z-index:2}
.RecapCard[data-state="composing"]{cursor:default}
.RecapCard[data-state="composing"] .RecapComp{filter:blur(6px) saturate(.4);opacity:.5}

/* --- RecapSpine · 91:29 ------------------------------------------------- */
.RecapSpine{
  position:relative;flex:0 0 auto;
  width:var(--size-recap-spine-w);height:var(--size-recap-h);
  border-radius:var(--radius-md);overflow:hidden;cursor:pointer;
  background:var(--color-surface-raised);
}
.RecapSpine .Scrim7{ /* тот же приём, но от левого края: текст стоит вертикально */
  background:linear-gradient(90deg,

  pickedFrame:null,
  effectPreset:null,

  entered:false,
  countdown:DEMO.countdownStart,
  onboarded:false
};
const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function dayDate(i){ const d=new Date(DEMO.periodStart); d.setDate(d.getDate()+i-1); return d; }
function fmtMD(d){ return MONTH[d.getMonth()]+" "+d.getDate(); }
function fmtMDup(d){ return (MONTH[d.getMonth()]+" "+d.getDate()).toUpperCase(); }
function dayState(i){
  if(i===DEMO.dayIndex) return S.todayKept ? (S.todayPreset==="SNOW GLOBE" ? "kept-extra":"kept") : "today";
  if(i>DEMO.dayIndex) return "future";
  if(i in DEMO.skipped) return DEMO.skipped[i]>0 && S.photoDatesAllowed ? "skipped-available" : "skipped-empty";
  return "kept";
}
/* решение 15.10 — первый СОХРАНЁННЫЙ кадр месяца несёт метку месяца вместо числа.
   В демо-состоянии это AUG 5 (старт периода) и SEP 1. Октябрь и ноябрь метки не получают:
   их дни ещё впереди, кадров у них нет, а пустая ячейка чисел не несёт (решение 16.2). */
function firstKeptOfMonth(i){
  const d=dayDate(i), st=dayState(i);
  if(!(st==="kept"||st==="kept-extra"||(st==="today"&&S.todayKept))) return false;
  for(let j=1;j<i;j++){
    const p=dayDate(j), ps=dayState(j);
    if(p.getMonth()===d.getMonth() && p.getFullYear()===d.getFullYear() &&
       (ps==="kept"||ps==="kept-extra")) return false;
  }
  return true;
}

/* кадр дня: 16 уникальных кадров переиспользуются по сетке (скил demo-imagery) */
function frameOf(i){
  if(i===DEMO.dayIndex) return "today";
  return "day-" + String(((i-1)%16)+1).padStart(2,"0");
}
function saveState(){ try{ localStorage.setItem("meantime.state", JSON.stringify(S)); }catch(e){} }
function loadState(){
  try{ const r=localStorage.getItem("meantime.state"); if(r) Object.assign(S, JSON.parse(r)); }catch(e){}
}

/* ============================================================================
   §6 · Img — кадры из ./assets, процедурная заглушка из токенов (решение 8.12)
   Пути только относительные — прототип уезжает на GitHub Pages (решение 12.2).
   ========================================================================= */
const Img = {
  status:{},   // name -> "ok" | "miss" | Promise
  hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); },
  /* заглушка целиком из токенов: угол, фаза и лёгкий поворот тона — детерминированы по имени */
  /* variant меняет ту же сцену, а не берёт другую: одно зерно, три сдвига
     из решения 15.6 — тональность и направление света, отделение объекта, температура */
  phVars(name, variant){
    const h=this.hash(name);
    let ang=((h)%140)+110, px=((h>>5)%80)+10, py=((h>>9)%60)+10,
        qx=((h>>13)%80)+10, qy=((h>>17)%70)+25,
        hue=((h>>21)%50)-25, sat=0.85+((h>>25)%40)/100;
    /* Сцена обязана остаться узнаваемой: композицию не зеркалим, двигаем свет.
       Решение 15.6 — за один переход меняются три вещи и только они:
       тональность и направление света · отделение объекта от фона · температура. */
    if(variant==="upgraded"){          /* дневной апгрейд */
      ang+=12;                                        /* тональность: градиент разворачивается */
      px=Math.min(88,px+20); py=Math.max(8,py-14);    /* направление света: ключевой свет уходит вверх-вправо */
      qx=Math.min(90,qx+10); qy=Math.max(12,qy-8);
      hue+=10; sat*=1.34;                             /* температура холоднее, цвет плотнее */
    }else if(variant==="small-delta"){ /* кадр уже хороший: глубина и зерно, тон почти тот же */
      ang+=5; py=Math.max(8,py-5); hue+=3; sat*=1.10;
    }else if(variant==="effect"){      /* эффект за монеты: другой мир, разница обязана быть крупной */
      ang+=88; px=100-px; py=100-py; qx=100-qx; hue-=46; sat*=1.75;
    }
    return "--ang:"+ang+"deg;--ang2:"+(((h>>3)%180))+"deg;"+
           "--px:"+px+"%;--py:"+py+"%;--qx:"+qx+"%;--qy:"+qy+"%;"+
           "--hue:"+hue+"deg;--sat:"+sat.toFixed(2)+";";
  },
  probe(name){
    if(this.status[name]) return Promise.resolve(this.status[name]);
    const p = new Promise(res=>{
      const im=new Image();
      im.onload  = ()=>{ this.status[name]="ok";   res("ok"); };
      im.onerror = ()=>{ this.status[name]="miss"; res("miss"); };
      im.src = "./assets/"+name+".jpg";
    });
    this.status[name]=p; return p;
  },
  /* Frame: заглушка стоит сразу, настоящий кадр приходит кросс-фейдом, раскладка не дёргается */
  make(name, cls, opts){
    opts=opts||{};
    const f=document.createElement("div");
    f.className="Frame"+(cls?" "+cls:"");
    f.dataset.img=name;
    const ph=document.createElement("div");
    ph.className="Frame__ph";
    ph.setAttribute("style", this.phVars(opts.seed||name, opts.variant));
    f.append(ph);
    /* отделение объекта от фона — виньетка поверх, только у обработанных вариантов */
    if(opts.variant){
      const v=document.createElement("div"); v.className="Frame__vig";
      v.style.opacity = opts.variant==="upgraded" ? ".55" : ".72";
      f.append(v);
    }
    const im=document.createElement("div"); im.className="Frame__img";
    f.append(im);
    Promise.resolve(this.status[name] instanceof Promise ? this.status[name] : this.probe(name)).then(r=>{
      if(r==="ok"){ im.style.backgroundImage="url(./assets/"+name+".jpg)"; requestAnimationFrame(()=>im.classList.add("is-in")); }
    });
    return f;
  }
};

const AI = {
  cache:{},
  async load(path){
    if(this.cache[path]) return this.cache[path];
    try{
      const r = await fetch("./fixtures/ai/"+path+".json", {cache:"no-store"});
      if(r.ok){ const j = await r.json(); this.cache[path]=j; return j; }
    }catch(e){ /* file:// — ожидаемо, идём в инлайн-копию */ }
    this.cache[path] = FIXTURES[path];
    return FIXTURES[path];
  },
  /* прогон этапов; onStage(i,stage), onProgress(0..1), onSlow(), onDone(fx), onFail(fx) */
  run(fx, cb){
    const ctl = {cancelled:false, stage:null, timers:[]};
    const t = (fn,ms)=>{ const id=setTimeout(fn,ms); ctl.timers.push(id); return id; };
    ctl.cancel = ()=>{ ctl.cancelled=true; ctl.timers.forEach(clearTimeout); };
    Analytics.track("ai_request_started",{scenario:fx.scenario,preset_id:fx.preset_id||null,tier:fx.tier||null});
    const t0 = Date.now();

    if(fx.error_type && !fx.stages){       // мгновенные отказы вроде filter-missing
      t(()=>{ if(!ctl.cancelled) cb.onFail && cb.onFail(fx); }, fx.fail_after_ms||600);
      return ctl;
    }
    if(fx.error_type){                     // сбой посреди этапов
      let acc=0;
      (fx.stages||[]).forEach((s,i)=>{ t(()=>{ if(!ctl.cancelled){ctl.stage=s.id; cb.onStage&&cb.onStage(i,s);} }, acc); acc+=s.ms; });
      t(()=>{ if(ctl.cancelled) return;
        Analytics.track("ai_response_failed",{scenario:fx.scenario,error_type:fx.error_type});
        cb.onFail && cb.onFail(fx); }, fx.fail_after_ms||2500);
      return ctl;
    }
    let acc=0;
    (fx.stages||[]).forEach((s,i)=>{
      t(()=>{ if(!ctl.cancelled){ ctl.stage=s.id; cb.onStage && cb.onStage(i,s); } }, acc);
      acc += s.ms;
    });
    if(fx.slow_threshold_ms && fx.latency_ms > fx.slow_threshold_ms)
      t(()=>{ if(!ctl.cancelled) cb.onSlow && cb.onSlow(fx); }, fx.slow_threshold_ms);
    t(()=>{
      if(ctl.cancelled) return;
      Analytics.track("ai_response_completed",{scenario:fx.scenario,latency_ms:Date.now()-t0,
        fixture:fx.fixture,tier:fx.tier||null});
      if(fx.result && fx.result.confidence==="low")
        Analytics.track("ai_low_confidence_shown",{preset_id:fx.preset_id||null});
      cb.onDone && cb.onDone(fx);
    }, fx.latency_ms);
    return ctl;
  },
  /* стриминг подписи: посимвольно, чанк по словам (реестр №14) */
  stream(el, text, done){
    const step = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--motion-stream-char")) || 22;
    if(step===0){ el.textContent=text; done&&done(); return {cancel(){}}; }
    let i=0, id=null;
    const tick=()=>{
      let n=i+1; while(n<text.length && text[n]!==" ") n++;   // чанк по словам
      i=Math.min(n+1,text.length); el.textContent=text.slice(0,i);
      if(i<text.length) id=setTimeout(tick, step*(i-Math.max(0,i-6)));
      else done&&done();
    };
    tick();
    return {cancel(){ clearTimeout(id); }};
  }
};

   §9 · UI — фабрики компонентов. Один в один с Figma: имя PascalCase,
   варианты Figma живут в data-* теми же словами.
   ========================================================================= */
const el=(tag,cls,txt)=>{ const n=document.createElement(tag); if(cls) n.className=cls;
  if(txt!=null) n.textContent=txt; return n; };
const frag=(...kids)=>{ const f=document.createDocumentFragment(); f.append(...kids); return f; };

const UI = {
  /* Button · 88:50 · Variant = Primary|Secondary|Text × State = Default|Pressed|Disabled|Loading */
  Button({label, variant="primary", state="default", onTap, icon}){
    const b=el("button","Button");
    b.dataset.variant=variant; b.dataset.state=state;
    const s=el("span","Button__label"); s.textContent=label;
    if(icon){ const i=el("span",null,icon); b.append(i); }
    b.append(s);
    if(onTap) b.addEventListener("click", e=>{ if(b.dataset.state==="disabled") return; onTap(e); });
    return b;
  },

  /* DayCell · 89:16 · State = Kept|Kept-extra|Today|Future|Skipped-available|Skipped-empty */
  DayCell({state, index, count, onTap}){
    const c=el("button","DayCell");
    c.dataset.state=state; c.dataset.day=index;
    c.setAttribute("aria-label","Day "+index);
    const hasFrame = (state==="kept"||state==="kept-extra"||(state==="today"&&S.todayKept));
    if(hasFrame){
      c.append(Img.make(frameOf(index), null,
        index===DEMO.dayIndex ? {seed:"fx-before",variant:"upgraded"} : null));
      /* решение 16.2 — число несут все три состояния с кадром: kept, kept-extra, today.
         Пустые (skipped-available с +N, skipped-empty, future) — не несут. */
      const d=dayDate(index), isMonthMark=firstKeptOfMonth(index);
      const scrim=el("div","DayCell__numScrim"+(isMonthMark?" DayCell__numScrim--wide":""));
      c.append(scrim);
      const n=el("span","DayCell__num t-counter-meta"+(isMonthMark?" DayCell__num--month":""));
      /* решение 15.10 — на границе месяца строка читалась бы «31 · 1 · 2 · 3…»,
         и по полю встречались два «5» и два «6» */
      n.textContent = isMonthMark ? (MONTH[d.getMonth()].toUpperCase()+" "+d.getDate())
                                  : String(d.getDate());
      c.append(n);
    }
    if(state==="skipped-available"){
      const n=el("span","t-h2"); n.textContent="+"+count; c.append(n);
    }
    if(onTap) c.addEventListener("click", ()=>onTap(index, state, c));
    return c;
  },

  /* TabBar · 90:56 · Active = Today|Diary|Effects */
  TabBar(active){
    /* решение 16 — один набор SF Symbols, все три сплошные, одного оптического веса.
       Активная вкладка различается ЦВЕТОМ, не подменой контура на заливку.
       Заливка стоит всегда и у всех; активная — accent, неактивные — text/secondary. */
    /* решение 16 — один набор SF Symbols, все три сплошные, одного оптического веса.
       Активная вкладка различается ЦВЕТОМ, не подменой контура на заливку:
       заливка стоит всегда и у всех, активная — accent, неактивные — text/secondary. */
    /* решение 16 — набор ВЗЯТ ИЗ FIGMA, TabBar `90:56`, свою версию не рисуем.
       Геометрия снята через Figma MCP с узлов 90:22 / 90:27 / 90:33, viewBox 22×22,
       все три занимают полную ширину 22. Цвета заменены на currentColor: активность
       различается ЦВЕТОМ (accent против text/secondary), заливка стоит всегда у всех трёх,
       контур на заливку нигде не подменяется. Фигур «обводка без заливки» нет. */
    const ICONS={
      /* camera.fill — корпус и выступ видоискателя одной фигурой, объектив ВЫЧТЕН

  /* Sheet · 95:14 · Detent = Medium|Large */
  Sheet({detent="medium", build, dismissible=true, onDismiss, delay=0}){
    const layer=document.getElementById("sheetLayer");
    /* HIG Modality — одна шторка за раз: новая закрывает предыдущую, стопки не бывает */
    layer.querySelectorAll(".Sheet").forEach(x=>{ if(x._api) x._api.close(); else x.remove(); });
    layer.querySelectorAll(".Scrim").forEach(x=>x.remove());
    layer.style.pointerEvents="auto";
    const scrim=el("div","Scrim");
    const sheet=el("div","Sheet"); sheet.dataset.detent=detent;
    const grab=el("div","Sheet__grab");
    const body=el("div","Sheet__body");
    sheet.append(grab, body);
    layer.append(scrim, sheet);
    const api={
      el:sheet, body,
      close(){
        if(api._closed) return; api._closed=true;
        sheet.classList.add("is-out"); sheet.classList.remove("is-in"); scrim.classList.remove("is-in");
        setTimeout(()=>{ scrim.remove(); sheet.remove();
          if(!layer.querySelector(".Sheet")) layer.style.pointerEvents="none"; }, 320);
        onDismiss && onDismiss();
      }
    };
    sheet._api=api;
    build(body, api);
    const show=()=>{ requestAnimationFrame(()=>{ scrim.classList.add("is-in"); sheet.classList.add("is-in"); }); };
    delay ? setTimeout(show, delay) : show();
    if(dismissible){
      scrim.addEventListener("click", api.close);
      dragToDismiss(sheet, api.close);
    }
    return api;
  }

/* реестр №7 — шторка тянется за пальцем, порог 25 % высоты или скорость > .5 px/ms */
function dragToDismiss(sheet, close){
  let y0=0,t0=0,dy=0,active=false;
  const down=e=>{ const p=e.touches?e.touches[0]:e;
    if(sheet.querySelector(".Sheet__body").scrollTop>0 && !e.target.closest(".Sheet__grab")) return;
    active=true; y0=p.clientY; t0=Date.now(); dy=0; sheet.style.transition="none"; };
  const move=e=>{ if(!active) return; const p=e.touches?e.touches[0]:e;
    dy=Math.max(0,p.clientY-y0); sheet.style.transform="translateY("+dy+"px)";
    if(e.cancelable) e.preventDefault(); };
  const up=()=>{ if(!active) return; active=false;
    const v=dy/Math.max(1,Date.now()-t0);
    sheet.style.transition="";
    if(dy > sheet.offsetHeight*0.25 || v>0.5){ sheet.style.transform=""; close(); }
    else sheet.style.transform="";
  };
  sheet.addEventListener("touchstart",down,{passive:true});
  sheet.addEventListener("touchmove",move,{passive:false});
  sheet.addEventListener("touchend",up);
  sheet.addEventListener("mousedown",down);
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",up);
}

/* --- action sheet (реестр №23) --- */
function actionSheet(items){
  const layer=document.getElementById("sheetLayer");
  layer.style.pointerEvents="auto";
  const scrim=el("div","Scrim");
  const wrap=el("div","ActionSheet");
  const grp=el("div","ActionSheet__grp");
  const cancelGrp=el("div","ActionSheet__grp");
  const close=()=>{ wrap.classList.remove("is-in"); scrim.classList.remove("is-in");
    setTimeout(()=>{ wrap.remove(); scrim.remove();
      if(!layer.querySelector(".Sheet")) layer.style.pointerEvents="none"; },260); };
  items.forEach(it=>{
    const b=el("button","ActionSheet__btn"); b.dataset.role=it.role||"default"; b.textContent=it.label;
    b.addEventListener("click",()=>{ close(); it.onTap && it.onTap(); });
    (it.role==="cancel"?cancelGrp:grp).append(b);
    if((it.role==="cancel"?cancelGrp:grp).children.length>1)
      (it.role==="cancel"?cancelGrp:grp).insertBefore(el("div","hair"), b);
  });
  wrap.append(grp, cancelGrp);
  layer.append(scrim, wrap);
  scrim.addEventListener("click",close);
  requestAnimationFrame(()=>{ scrim.classList.add("is-in"); wrap.classList.add("is-in"); });
  return {close};
}

/* ============================================================================
   §11 · Router — push/pop слайдом, zoom-from-thumbnail (решение 13.2),
   интерактивный свайп от края, следующий за пальцем (решение 13.4).
   ========================================================================= */
const MS = k => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(k))||0;
const Router = {
  stack:[], current:null, busy:false,
  root:{today:"03", diary:"07", effects:"11"},
  el(){ return document.getElementById("stack"); },

  build(route){
    const make = Screens[route];
    if(!make) throw new Error("no screen "+route);
    const s = el("div","Screen"); s.dataset.route=route;
    make(s);
    return s;
  },

  /* корень таба — без анимации содержимого (HIG, реестр №4) */
  tab(id){
    const route=this.root[id];
    if(this.stack.length===1 && this.current===route) return;
    this.stack.forEach(f=>f.el.remove());
    const s=this.build(route);
    this.el().append(s);
    this.stack=[{route, el:s, mode:"root"}];
    this.current=route;
    location.hash="#/"+route;
  },

  /* корень + экран поверх: «назад» с 06 возвращает на 03 в состоянии «после Keep» */
  resetTo(rootRoute, route){
    this.reset(rootRoute);
    const s=this.build(route); this.el().append(s);
    this.stack.push({route, el:s, mode:"slide"});
    this.current=route; location.hash="#/"+route;
  },

  reset(route){
    this.stack.forEach(f=>f.el.remove());
    const s=this.build(route); this.el().append(s);
    this.stack=[{route, el:s, mode:"root"}];
    this.current=route; location.hash="#/"+route;
  },

  go(route, opts){
    opts=opts||{};
    if(this.busy) return; this.busy=true;
    const below=this.stack[this.stack.length-1];
    const s=this.build(route);
    const D=MS("--motion-screen"), DZ=MS("--motion-sheet-in");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    let mode = opts.from ? "zoom" : "slide", origin=null;

    if(mode==="zoom"){
      const dev=document.getElementById("device").getBoundingClientRect();
      const r=opts.from.getBoundingClientRect();
      origin={cx:r.left-dev.left+r.width/2, cy:r.top-dev.top+r.height/2, scale:Math.max(.08, r.width/dev.width)};
      s.style.transformOrigin=origin.cx+"px "+origin.cy+"px";
      s.style.transform="scale("+origin.scale+")";
      s.style.opacity="0";
      this.el().append(s);
      requestAnimationFrame(()=>{
        s.style.transition="transform "+DZ+"ms "+ease+", opacity "+DZ+"ms "+ease;
        s.style.transform="scale(1)"; s.style.opacity="1";
      });
      setTimeout(()=>{ s.style.transition=""; this.busy=false; }, DZ+20);
    }else{
      s.style.transform="translateX(100%)";
      this.el().append(s);
      requestAnimationFrame(()=>{
        s.style.transition="transform "+D+"ms "+ease;
        s.style.transform="translateX(0)";
        if(below){ below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
          below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6"; }
      });
      setTimeout(()=>{ s.style.transition=""; this.busy=false; }, D+20);
    }
    this.stack.push({route, el:s, mode, origin, from:opts.from||null});
    this.current=route; location.hash="#/"+route;
    return s;
  },

  back(){
    if(this.stack.length<2 || this.busy) return; this.busy=true;
    const top=this.stack.pop(), below=this.stack[this.stack.length-1];
    const D=MS("--motion-screen"), DZ=MS("--motion-sheet-in");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
    below.el.style.transform="translateX(0)"; below.el.style.opacity="1";
    if(top.mode==="zoom" && top.origin){
      top.el.style.transition="transform "+DZ+"ms "+ease+", opacity "+DZ+"ms "+ease;
      top.el.style.transform="scale("+top.origin.scale+")"; top.el.style.opacity="0";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, DZ+20);
    }else{
      top.el.style.transition="transform "+D+"ms "+ease;
      top.el.style.transform="translateX(100%)";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, D+20);
    }
    this.current=below.route; location.hash="#/"+below.route;
  },

  /* заменить верхний экран без анимации (например 06 → 06a после Keep as today) */
  swapTop(route){
    const top=this.stack.pop(); if(top) top.el.remove();
    const s=this.build(route); this.el().append(s);
    this.stack.push({route, el:s, mode:"slide"});
    this.current=route; location.hash="#/"+route;
  }
};

/* --- интерактивный свайп от края (решение 13.4, реестр №3) ---------------
   Жест ведёт ровно ту анимацию, которой экран был открыт: слайд — слайдом,
   zoom — обратным зумом. «Назад — зеркало того, как вошёл» держится и жестом. */
(function edgeSwipe(){
  const dev=document.getElementById("device");
  let act=false, x0=0, t0=0, dx=0, top=null, below=null;
  const W=()=>dev.getBoundingClientRect().width;

  const start=e=>{
    if(Router.busy || Router.stack.length<2) return;
    if(document.querySelector("#sheetLayer .Sheet")) return;
    const p=e.touches?e.touches[0]:e;
    const rel=p.clientX-dev.getBoundingClientRect().left;
    if(rel>20) return;
    act=true; x0=p.clientX; t0=Date.now(); dx=0;
    top=Router.stack[Router.stack.length-1]; below=Router.stack[Router.stack.length-2];
    top.el.style.transition="none"; below.el.style.transition="none";
  };
  const move=e=>{
    if(!act) return;
    const p=e.touches?e.touches[0]:e;
    dx=Math.max(0,p.clientX-x0);
    const k=Math.min(1, dx/W());
    if(top.mode==="zoom" && top.origin){
      const s=1+(top.origin.scale-1)*k;
      top.el.style.transform="scale("+s+")"; top.el.style.opacity=String(1-k*0.9);
    }else{
      top.el.style.transform="translateX("+dx+"px)";
      below.el.style.transform="translateX("+(-30+30*k)+"%)";
      below.el.style.opacity=String(.6+.4*k);
    }
    if(e.cancelable) e.preventDefault();
  };
  const end=()=>{
    if(!act) return; act=false;
    const v=dx/Math.max(1,Date.now()-t0);
    top.el.style.transition=""; below.el.style.transition="";
    if(dx>W()*0.3 || v>0.5){
      top.el.style.transform=""; top.el.style.opacity="";
      below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6";
      Router.back();
    }else{
      const D=MS("--motion-menu");
      const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
      top.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      top.el.style.transform= top.mode==="zoom" ? "scale(1)" : "translateX(0)";
      top.el.style.opacity="1";
      below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6";
      setTimeout(()=>{ top.el.style.transition=""; below.el.style.transition=""; }, D+20);
    }
  };
  dev.addEventListener("touchstart",start,{passive:true});
  dev.addEventListener("touchmove",move,{passive:false});
  dev.addEventListener("touchend",end);
  dev.addEventListener("mousedown",start);
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
})();

/* --- часы и отсчёт: один таймер на всё приложение (правило 4 карты) ------- */
const Countdown = {
  subs:new Set(),
  fmt(){ const s=S.countdown; const h=String(Math.floor(s/3600)).padStart(2,"0");
    const m=String(Math.floor(s%3600/60)).padStart(2,"0"); const q=String(s%60).padStart(2,"0");
    return h+":"+m+":"+q; },
  tick(){
    S.countdown = S.countdown>0 ? S.countdown-1 : 24*3600;
    const t=this.fmt();
    document.querySelectorAll("[data-countdown]").forEach(n=>{ n.textContent=t; });
  }
};
setInterval(()=>Countdown.tick(), 1000);

/* --- 05 · Проявление --------------------------------------------------- */
Screens["05"]=s=>{
  const path = S._fixture || "daily-frame/success";
  const isEffect = path.indexOf("effect/")===0;
  const w=scrollBox(s,null,true);
  w.style.padding="0 0 calc(var(--size-safe-bottom) + var(--space-4))";

  const hero=el("div","Hero flush");
  const reveal=el("div","Reveal");
  reveal.append(isEffect ? Img.make("fx-after",null,{seed:"fx-before",variant:"effect"})
                       : Img.make("today",null,{seed:"fx-before",variant:"upgraded"}));
  const veil=el("div","Reveal__veil"); veil.style.opacity=".32";
  hero.append(reveal, veil, el("div","Hero__glow"), el("div","Scrim7"));
  const ht=el("div","Hero__text stack gap2");
  const kick=assign(el("div","t-meta c-on-image"), fmtMDup(DEMO.today)+(isEffect?" · SNOW GLOBE":""));
  const title=assign(el("div","t-h1 c-on-image"),"Rendering…");
  ht.append(kick,title); hero.append(ht);
  w.append(hero);

  const panel=el("div","stack gap4"); panel.style.padding="var(--space-5) var(--size-gutter) 0";
  w.append(panel);

  AI.load(path).then(fx=>{
    if(!fx){ panel.append(assign(el("div","t-body c-error"),"Fixture not found: "+path)); return; }
    const stages=fx.stages||[{id:"reading",label:"Reading your frame",ms:600}];
    const rs=UI.RenderStages(stages);
    panel.append(rs);
    if(!isEffect && !S._serverNoteSeen){
      panel.append(assign(el("div","t-caption c-tertiary"),
        "Your frame goes to our servers to render, and is deleted within 24 hours."));
      S._serverNoteSeen=true;
    }
    const actions=el("div","stack gap2"); panel.append(actions);
    const cancel=UI.Button({label: isEffect? "Cancel — no charge" : "Cancel — nothing is used yet",
      variant:"text", onTap:()=>{
        ctl.cancel();
        Analytics.track("ai_response_stopped",{scenario:fx.scenario,stage:ctl.stage,quota_spent:false});
        Router.back();
      }});
    actions.append(cancel);

    title.textContent = stages[0].label.replace("…","") + "…";
    const dur = fx.latency_ms || 4000;
    reveal.style.transition="filter "+dur+"ms linear";
    veil.style.transition="opacity "+dur+"ms linear";
    reveal.style.filter="blur(7px) saturate(.35)";
    requestAnimationFrame(()=>{ reveal.style.filter="blur(0px) saturate(1)"; veil.style.opacity="0"; });

    const ctl = AI.run(fx,{
      onStage(i,st){
        rs.setStage(i); title.textContent = st.label.endsWith("…") ? st.label : st.label+"…";
        if(st.id===(fx.cancelable_until||"developing")) cancel.style.display="none";
      },
      onSlow(f){
        const n=assign(el("div","t-body c-thinking"), f.slow_notice);
        panel.insertBefore(n, actions);
      },
      onDone(f){
        rs.finish(); rs.remove();
        if(f.result && f.result.delta==="small"){
          const v=reveal.querySelector(".Frame__vig"); if(v) v.style.opacity=".22";
          const ph=reveal.querySelector(".Frame__ph");
          if(ph) ph.setAttribute("style", Img.phVars("fx-before","small-delta"));
        }
        title.textContent = fmtMD(DEMO.today)+(f.result.preset==="SNOW GLOBE"?" · Snow globe":" · Upgraded");
        kick.textContent = f.result.confidence==="low" ? "LOW CONFIDENCE" : "READY";
        actions.innerHTML="";
        if(f.notice) actions.append(assign(el("div","t-body c-thinking"), f.notice));
        if(isEffect) Screens._effectDone(actions, f);
        else Screens._dailyDone(actions, f);
      },
      onFail(f){
        rs.remove(); reveal.style.filter="blur(7px) saturate(.35)"; veil.style.opacity=".32";
        title.textContent=f.title; kick.textContent="";
        actions.innerHTML="";
        actions.append(assign(el("div","t-body c-error"), f.body||""));
        (f.actions||[]).forEach(a=>actions.append(UI.Button({label:a.label,variant:a.variant,
          onTap:()=>Screens._failAction(a.id, f)})));
      }
    });
  });
};
Screens._dailyDone=(box, f)=>{
  S.attempts++;
  box.append(UI.Button({label:"Keep in diary",onTap:()=>{
    S.todayKept=true; S.todayPreset=f.result.preset; saveState();
    Analytics.track("day_kept",{with_filter:true,restored:false});
    Analytics.track("limit_reached",{limit_type:"daily_renders"});
    Router.resetTo("03","06");
  }}));
  box.append(UI.Button({label:"Choose another photo",variant:"secondary",onTap:()=>{
    if(S.attempts>=3){ Sheets.confirmCoins({name:"Upgrade again",price:2,extra:true}); return; }
    Router.back(); Sheets.picker("library");
  }}));
  box.append(UI.Button({label:"Keep without the upgrade",variant:"text",onTap:()=>{
    S.todayKept=true; S.todayPreset="none"; saveState();
    Analytics.track("day_kept",{with_filter:false,restored:false});
    Router.resetTo("03","06");
  }}));
  if(f.result.confidence==="low")
    box.append(UI.Button({label:"Render once more — on us",variant:"text",onTap:()=>{
      Analytics.track("result_regenerated",{reason:"low_confidence"});
      S._fixture="daily-frame/success"; Router.swapTop("05");
    }}));
  else if(S.attempts>=3)
    box.append(UI.Button({label:"Render again · ◎ 2",variant:"text",
      onTap:()=>Sheets.confirmCoins({name:"Upgrade again",price:2,extra:true})}));
};
Screens._effectDone=(box, f)=>{
  S.effectPreset=f.result.preset; S.effectSpent=4; saveState();
  box.append(UI.Button({label:"See result",onTap:()=>Router.swapTop("14")}));
};
Screens._failAction=(id, f)=>{
  if(id==="retry"){ S._fixture = f.scenario==="effect" ? "effect/success" : "daily-frame/success";
    Router.swapTop("05"); return; }
  if(id==="nofilter"){ S.todayKept=true; S.todayPreset="none"; saveState();
    Analytics.track("day_kept",{with_filter:false,restored:false}); Router.resetTo("03","06"); return; }
  if(id==="another"){ Router.back(); Sheets.picker("library"); return; }
  if(id==="back"){ Router.tab("effects"); return; }
};

/* --- сегмент-контрол (реестр №11) -------------------------------------- */
function segment(items, sel, onChange){
  const g=el("div","Segment");
  const ind=el("div","Segment__ind"); g.append(ind);
  items.forEach((t,i)=>{
    const b=el("button","Segment__item t-caption"); b.textContent=t;
    b.setAttribute("aria-selected", String(i===sel));
    b.addEventListener("click",()=>{
      [...g.querySelectorAll(".Segment__item")].forEach((x,j)=>x.setAttribute("aria-selected",String(j===i)));
      place(i); onChange && onChange(i,t);
    });
    g.append(b);
  });
  function place(i){
    const items2=g.querySelectorAll(".Segment__item");
    const r=items2[i].getBoundingClientRect(), gr=g.getBoundingClientRect();
    ind.style.left=(r.left-gr.left)+"px"; ind.style.width=r.width+"px";
  }
  requestAnimationFrame(()=>place(sel));
  return g;
}

function recapFull(fx, captionEl){
  const box=el("div","RecapFull");
  const comp=el("div","RecapComp");
  ["TL","TR","BL","BR"].forEach(q=>{
    const it=(fx.quadrants||[]).find(x=>x.q===q);
    if(!it){ comp.append(el("div","Frame")); return; }
    const f=Img.make(it.asset);
    if(it.locked && !S.subscriber) f.dataset.locked="1";
    comp.append(f);
  });
  box.append(comp, el("div","Scrim7"));
  const t=el("div","RecapFull__text stack gap2");
  captionEl.textContent = "“"+fx.caption+"”";
  t.append(assign(el("div","t-meta c-on-image"),fx.kicker), captionEl,
           assign(el("div","t-counter-meta c-on-image"),fx.stat));
  box.append(t);
  /* решение 10.14 — фолбэк, если все четыре кадра ярче #CC */
  const allBright=(fx.quadrants||[]).every(q=>q.luma>0.80);
  if(allBright || fx.kicker_scrim_fallback){
    const f=el("div"); f.style.cssText="position:absolute;inset:0;z-index:1;pointer-events:none;"+
      "background:linear-gradient(0deg,var(--color-scrim-kicker-fallback) 0%,transparent 62%)";
    box.insertBefore(f, t);
  }
  return box;
}
function composeRecap(holder, fx){
  const box=el("div","RecapFull");
  const comp=el("div","RecapComp");
  ["TL","TR","BL","BR"].forEach(()=>comp.append(el("div","Frame")));
  comp.style.filter="blur(8px) saturate(.4)"; comp.style.opacity=".5";
  box.append(comp, el("div","Scrim7"));
  const t=el("div","RecapFull__text stack gap2");
  const cap=el("div","t-h1 c-on-image");
  t.append(assign(el("div","t-meta c-thinking"),"COMPOSING WEEK 6"), cap);
  box.append(t); holder.append(box);
  const rs=UI.RenderStages(fx.stages); rs.classList.add("mt5"); holder.append(rs);
  AI.run(fx,{
    onStage(i,st){ rs.setStage(i);
      if(st.id==="caption") AI.stream(cap, "“"+fx.caption+"”"); },
    onSlow(f){ holder.append(assign(el("div","t-body c-thinking mt3"), f.slow_notice)); },
    onDone(){ rs.remove(); comp.style.filter=""; comp.style.opacity="";
      S._recapFixture="recap/success"; Router.swapTop("10"); }
  });
}

    dev.append(this.badge);
  },

  /* перехват — на фазе захвата, чтобы сработать раньше любого обработчика экрана */
  arm(){
    if(this._armed) return; this._armed=true;
    const stop=(e)=>{ if(this.on && !(this.badge && this.badge.contains(e.target))) this.stop(); };
    const dev=document.getElementById("device");
    ["pointerdown","touchstart","mousedown","keydown","wheel"].forEach(t=>
      dev.addEventListener(t, stop, {capture:true, passive:true}));
    document.addEventListener("keydown", stop, {capture:true});
  },

  start(){
    this.ui(); this.arm();
    this.on=true; this.badge.classList.remove("is-on");
    document.querySelectorAll(".DemoTap").forEach(n=>n.remove());
    this.loop();
  },

  stop(){
    if(!this.on) return;
    this.on=false;
    this.timers.forEach(clearTimeout); this.timers=[];
    if(this.waiter){ this.waiter.reject && this.waiter.reject("stopped"); this.waiter=null; }
    document.querySelectorAll(".DemoTap").forEach(n=>n.remove());
    this.badge.classList.add("is-on");
  },

  sleep(ms){
    return new Promise((res,rej)=>{
      if(!this.on) return rej("stopped");
      const id=setTimeout(()=>{ this.waiter=null; this.on ? res() : rej("stopped"); }, ms);
      this.timers.push(id);
      this.waiter={reject:()=>{ clearTimeout(id); rej("stopped"); }};
    });
  },

  /* видимый круг в точке тапа — иначе экраны просто мигают */
  async point(node){
    if(!this.on || !node) throw "stopped";
    const dev=document.getElementById("device").getBoundingClientRect();
    const r=node.getBoundingClientRect();
    const t=el("div","DemoTap");
    t.style.left=(r.left-dev.left+r.width/2)+"px";
    t.style.top =(r.top -dev.top +r.height/2)+"px";
    document.getElementById("device").append(t);
    requestAnimationFrame(()=>t.classList.add("is-on"));
    await this.sleep(420);
    t.remove();
  },

  async tap(node){ await this.point(node); if(!this.on) throw "stopped"; node.click(); },

  btn(label){
    const n=[...document.querySelectorAll(".Button__label")]
      .find(x=>x.textContent.trim()===label);
    return n ? n.closest(".Button") : null;
  },
  /* ждём появления элемента, но не бесконечно — демо не должно зависать */
  async until(fn, limit=9000){
    const t0=Date.now();
    while(this.on){
      const v=fn(); if(v) return v;
      await this.sleep(120);
      if(Date.now()-t0>limit) throw "timeout";
    }
    throw "stopped";
  },

  async loop(){
    try{
      while(this.on){
        await this.run();
        await this.sleep(1200);
      }
    }catch(e){ if(e!=="stopped" && this.on){ console.warn("demo:",e); this.stop(); } }
  },

  /* сквозной путь ядра. Паузы стоят там, где есть что прочесть. ~45 с круг. */
  async run(){
    /* сброс в начало */
    Object.assign(S,{todayKept:false,todayPreset:null,attempts:0,subscriber:false,
      coins:DEMO.coinsStart,diarySeen:true,photoDatesAllowed:true,onboarded:true});
    S._fixtureOverride=null; S._fixture="daily-frame/success"; S._recapFixture="recap/success";
    document.querySelectorAll("#sheetLayer .Sheet,#sheetLayer .Scrim,.StoreKit").forEach(n=>n.remove());
    document.getElementById("sheetLayer").style.pointerEvents="none";
    Router.reset("03");

    /* 03 — карточка фильтра дня: имя фильтра, обещание квоты, тикающий отсчёт */
    await this.sleep(4200);
    await this.tap(await this.until(()=>this.btn("Pick from today’s photos")));

    /* 04 — ряд Meantime picked собирается на устройстве */
    await this.sleep(1500);
    const pick=await this.until(()=>document.querySelectorAll(".PickRow .PickTile")[0]);
    await this.sleep(900);
    await this.tap(pick);

    /* 05 — проявление идёт своим ходом: этапы, строка про 24 часа */
    await this.until(()=>this.btn("Keep in diary"), 14000);
    await this.sleep(2600);
    await this.tap(this.btn("Keep in diary"));

    /* 06 — день сохранён: подпись кадра, счётчик, блок TOMORROW */
    await this.sleep(4600);
    await this.tap(await this.until(()=>this.btn("Open diary")));

    /* 07 — полка итогов и поле периода */
    await this.sleep(3800);
    const card=await this.until(()=>document.querySelector(".RecapCard"));
    await this.sleep(1400);
    await this.tap(card);

    /* 10 — рекап во весь экран, через 600 мс приходит пейвол */
    await this.sleep(3000);
    await this.until(()=>document.querySelector("#sheetLayer .Sheet"), 4000);
    await this.sleep(6000);           /* время прочитать список и оба плана */
    const yearly=[...document.querySelectorAll("#sheetLayer .PlanRow")][1];
    if(yearly) { await this.tap(yearly); await this.sleep(2200); }
    await this.tap(await this.until(()=>this.btn("Not now")));
    await this.sleep(2000);
  }
};
(function demoBoot(){
  const qs=new URLSearchParams(location.search);
  const bar=document.querySelector(".DevBar");
  if(bar){
    const b=document.createElement("button");
    b.textContent="Run demo";
    b.addEventListener("click",()=>Demo.start());
    bar.append(b);
  }
  if(qs.get("demo")!==null) setTimeout(()=>Demo.start(), 600);
})();
</script>
