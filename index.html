  --color-ai-error:#FF8A7A;
  --color-scrim-image-zero:rgba(0,0,0,0);
  --color-scrim-image-strong:rgba(0,0,0,.90);

  /* --- space · 9 (шкала 4, ритм 8) --- */
  --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;

  /* --- radius · 5 --- */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:26px; --radius-full:999px;

  /* --- size · 12 --- */
  --size-tap-min:44px;      --size-button-h:50px;
  --size-day-cell:40px;     --size-day-step:48px;
  --size-tabbar-w:300px;    --size-tabbar-h:56px;
  --size-recap-card-w:224px;--size-recap-h:152px;   --size-recap-spine-w:36px;
  --size-hairline:1px;      --size-safe-top:59px;   --size-safe-bottom:34px;

  /* --- blur · 4 --- */
  --blur-glass:24px; --blur-glass-dense:32px; --blur-glow-sm:12px; --blur-glow-lg:28px;

  /* --- эффект-стили · 5 --- */
  --effect-glass:blur(var(--blur-glass)) saturate(160%);
  --effect-glass-dense:blur(var(--blur-glass-dense)) saturate(140%);
  --effect-glow-accent-sm:0 0 var(--blur-glow-sm) rgba(74,107,224,.55);
  --effect-glow-accent-lg:0 0 20px 2px rgba(74,107,224,.90), 0 0 36px 6px rgba(143,179,255,.45);
  --effect-chrome-shadow:0 8px 24px rgba(0,0,0,.55);

  /* ==========================================================================
     расширение прототипа — НЕ из Figma (решение 13)
     Каждая величина с источником. Кандидаты в коллекцию «Meantime · Observatory».
     ======================================================================= */
  --size-frame-w:390px;          /* решение 5.1 — кадр iOS */
  --size-frame-h:844px;          /* решение 5.1 */
  --size-gutter:var(--space-6);  /* поле 24…366, ux-brief «Общее для всех экранов» */
  --size-hero-h:560px;           /* ui-spec §05 — кадр 390×560 */
  --size-hero-day-h:520px;       /* ux-brief §08 — кадр 390×520 */
  --size-frame-square:342px;     /* ui-spec §06 — кадр 342×342 */
  --size-frame-square-sm:300px;  /* ui-spec §06a — кадр ужат до 342×300 */
  --size-frame-today:300px;      /* решение 17.8 — кадр на вкладке Today, состояние «сохранено» */
  --size-filter-img-h:240px;     /* ui-spec §03 — образец кадра 342×240 */
  --size-recap-comp-h:250px;     /* ui-spec §10 — композиция 342×250 */
  --size-sheet-medium:440px;     /* компонент Sheet 95:14 */
  --size-sheet-large:720px;      /* компонент Sheet 95:14 */
  --size-effect-tile-h:190px;    /* ux-brief §11 — плитка 165×190 */
  --size-effect-prev-h:108px;    /* ux-brief §11 — превью 145×108 */
  --size-share-card-w:252px;     /* ux-brief §09 — карточка 9:16 */
  --size-share-card-h:448px;     /* ux-brief §09 */
  --size-sharecard-mark:26px;    /* решение 17.12 — вордмарк на карточке 252×448, ориентир 24–28 */
  --share-thumb-scale:.214;      /* 96 / 448 — во столько ужата карточка в превью шита.
                                    Ширина при этом 252 × .214 = 54 = --size-share-thumb-day-w */
  --size-pick-tile:110px;        /* ux-brief §04 — плитки ряда 110×110 */
  --size-pick-cell:94px;         /* ux-brief §04 — ячейка сетки 94 */
  --size-tomorrow-h:56px;        /* ui-spec §06 — блок TOMORROW сжат до 56 */
  --size-lens-mark:64px;         /* решение 17.13 — диафрагма в заглушке карточки дня */
  --size-shutter:72px;           /* решение 17.19 — спуск, как в системной камере iOS */
  /* Решение 17.33 — видоискатель перестал быть полноэкранным.
     Превью 3:4 по ширине: 390 × 520. Верхнее поле = safe top 59 + тулбар 44 = 103 → 104
     (кратно 8). Нижнее = 844 − 520 − 104 = 220: в нём спуск 72 и safe bottom 34,
     поэтому оно вдвое выше верхнего — так же устроена системная камера.
     Числа из hig-numbers.md: safe 59/34, тулбар 44, тап-зона 44. */
  --size-camera-preview-h:520px;
  --size-camera-top:104px;
  --size-shutter-ring:3px;       /* толщина кольца спуска */
  /* шит шеринга (решение 17) — имитация системного листа iOS в токенах проекта */
  --size-share-thumb-h:96px;       /* высота миниатюры карточки в строке превью */
  --size-share-thumb-day-w:54px;   /* 96 × 9/16 — карточка дня, ux-brief §09 */
  --size-share-thumb-week-w:132px; /* 96 × 342/250 — композиция рекапа, ui-spec §10 */
  --size-share-dest:60px;          /* круглая плитка адресата; ≥ 44 pt тап-зоны */
  --size-share-dest-icon:28px;     /* монохромный силуэт внутри плитки */
  --size-share-dest-col:68px;      /* колонка «плитка + подпись» — шаг ряда адресатов */

  /* моушен · hig-numbers.md + Material 3 Motion — interaction-registry.md */
  /* Решение 17.29 отменяет 17.27: значения вернулись к ориентирам HIG и Material 3.
     Ускорение до 260/300 пробовали и откатили — в руках оно читалось торопливым.
     Медленнее ручного идёт только автодемо, подменой на время прогона (решение 17.28). */
  --motion-micro:100ms;  --motion-icon:150ms;  --motion-alert:200ms;
  --motion-menu:250ms;   --motion-sheet-out:300ms; --motion-screen:350ms;
  --motion-sheet-in:400ms;
  --motion-render-fast:4000ms; --motion-render-quality:6000ms;
  --motion-stream-char:22ms;
  --motion-reveal-hold:1000ms;  /* решение 17.2 — оригинал стоит чётким до кросс-фейда */
  --motion-viewfinder:20000ms; /* решение 17.19 — 1.0 → 1.04 в видоискателе, туда и обратно */
  /* однократный показ дельты после проявления (решение 17.32) */
  --motion-delta-hold-result:900ms;    /* результат стоит, прежде чем показать оригинал */
  --motion-delta-fade:800ms;           /* кросс-фейд туда и обратно (17.50: было 600) */
  --motion-delta-hold-original:1200ms; /* оригинал стоит */
  --ease-standard:cubic-bezier(.32,.72,0,1);
  --ease-crossfade:cubic-bezier(.45,0,.55,1); /* решение 17.50 — симметричная кривая для смены кадра: без рывка на старте */
  --ease-sheet:cubic-bezier(.34,1.2,.64,1);
  --ease-accel:cubic-bezier(.3,0,.8,.15);

  --blur-tabbar-glow:9px;      /* Figma 90:26 — feGaussianBlur stdDeviation 9; в blur/* такого нет */
  --size-tabbar-glow:56px;     /* Figma 90:26 — эллипс 56×56, центр на иконке (y −8 + 28 = 20) */
  --size-daycell-month-label:9px; /* решение 15.10 — «SEP 1» в 11 pt не влезает в ячейку 40;
                                     9 pt — названный владельцем пол, ниже не опускаемся */
  --size-device-radius:47px;   /* физический радиус угла iPhone — рамка показа, не продукт */
  /* Витрина по прямой ссылке (решение 17.26). Значения презентации, а не интерфейса:
     в коллекции Figma их нет и быть не должно. Ориентир — обложка кейса.
     Применяются только вокруг устройства и только когда оно стоит рамкой по центру. */
  --color-stage-bg:#F4F5F7;
  --color-stage-bezel:#0B0D13;
  --color-stage-ink:#2A3040;
  --color-stage-ink-dim:#5B6472;
  --color-stage-hairline:rgba(20,25,40,.18);
  --color-stage-chip:rgba(255,255,255,.72);
  --color-stage-panel:#FFFFFF;                   /* пилюля панели витрины (решение 17.31) */
  --effect-stage-panel-shadow:0 6px 18px rgba(20,25,40,.14);
  --size-stage-panel-w:172px;                    /* колонка слева от устройства */
  --size-stage-bezel:12px;     /* внешний радиус = 47 + 12 = 59; см. отчёт про «около 44» */
  --effect-stage-shadow:0 18px 44px rgba(20,25,40,.28);
  --radius-indicator:3px;      /* индикаторы статус-бара — служебный chrome, не продуктовый радиус */
  --radius-hairline:1px;

  /* скрим на кадре: в Figma заведены только две крайние точки
     (color/scrim/image-zero и image-strong). Пять промежуточных стопов —
     это семь-стоповый градиент из ui-spec «Текст на кадре»; заводим их явно. */
  --color-scrim-image-1:rgba(0,0,0,.80);
  --color-scrim-image-2:rgba(0,0,0,.64);
  --color-scrim-image-3:rgba(0,0,0,.44);
  --color-scrim-image-4:rgba(0,0,0,.18);
  --color-scrim-image-5:rgba(0,0,0,.04);
  --color-scrim-sheet:rgba(0,0,0,.42);        /* затемнение под шторкой — с макета 107:78 */
  --color-scrim-corner:rgba(0,0,0,.55);       /* угловой скрим под вотермарком, ui-spec §06 */
  --color-scrim-kicker-fallback:rgba(0,0,0,.60); /* фолбэк решения 10.14, если все кадры ярче #CC */
  --color-bezel-outer:color-mix(in srgb,var(--color-text-primary) 6%,var(--color-bg-primary));
  --color-bezel-inner:color-mix(in srgb,var(--color-text-primary) 12%,var(--color-bg-primary));
  --color-devpanel-bg:color-mix(in srgb,var(--color-bg-primary) 94%,transparent);

  /* шрифтовой стек · hig-numbers.md. SF Pro в коде, Inter — фолбэк (решение 10.1) */
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  /* решение 17.16 — вордмарк и только он. Весь остальной интерфейс остаётся на системном:
     подмена системного шрифта сломала бы нативность, ради которой держим HIG (решение 5.1).
     Unbounded — гротеск, поэтому фолбэк системный: при несработавшем @font-face
     вордмарк остаётся в том же классе шрифтов, а не меняет характер. */
  --font-logo:"Unbounded",var(--font-ui);
}

/* ============================================================================
   §2 · БАЗА И CHROME
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;
  /* без этого дотягивание до края даёт резиновую отдачу, и под интерфейсом видно полосу */
  overscroll-behavior:none}
body{
  background:var(--color-bg-primary);
  font-family:var(--font-ui);
  color:var(--color-text-primary);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0;padding:0}

/* --- текстовые стили · 8, из Figma text styles --- */
.t-display{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.4px}
/* вордмарк · решение 17.16. Не текстовый стиль из Figma, а роль: слово `Meantime`,
   когда оно выступает логотипом — заставка, 01, шапка 03, метка на карточке шеринга.
   Размер и место берутся у стиля, с которым класс стоит в паре; отсюда только начерк.
   Вес 700. Трекинг подобран сравнением рендеров при -.05 · -.04 · -.03 · -.02 · 0:
   на -.04 (ориентир задания) пары «ea» и «nt» начинают слипаться, на -.02 слово
   держится как логотип и буквы остаются раздельными. Место есть — 208 pt при 342,
   поэтому трекинг здесь работает на оптику, а не на то, чтобы влезть. */
.t-logo{font-family:var(--font-logo);font-weight:700;letter-spacing:-.02em}
.t-h1{font-size:22px;line-height:28px;font-weight:600;letter-spacing:0}
.t-h2{font-size:17px;line-height:22px;font-weight:600;letter-spacing:0}
.t-body{font-size:17px;line-height:22px;font-weight:400;letter-spacing:0}
.t-caption{font-size:13px;line-height:18px;font-weight:400;letter-spacing:0}
.t-meta{font-size:11px;line-height:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase}
/* решение 10.4 / долг 10.15 — табличные цифры обязательны, в Figma их включить нельзя */
.t-counter{font-size:17px;line-height:22px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.t-counter-meta{font-size:11px;line-height:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.c-primary{color:var(--color-text-primary)}
.c-secondary{color:var(--color-text-secondary)}
.c-tertiary{color:var(--color-text-tertiary)}
.c-accent{color:var(--color-accent-default)}
.c-on-image{color:var(--color-text-on-image)}
.c-error{color:var(--color-ai-error)}
.c-thinking{color:var(--color-ai-thinking)}

/* --- сцена и устройство --- */
/* решение 17.45 — полноэкранная раскладка стала БАЗОВОЙ, без медиаусловий: на любом телефоне
   и внутри рамки кейса устройство занимает весь вьюпорт. Витрина для компьютера — исключение ниже
   с явным условием. Раньше было наоборот, и телефон, не прошедший условие, получал устройство
   390×844 по центру вместе с отладочной панелью под ним: панель занимала низ, верх уходил за экран */
.Stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.Device{
  position:fixed;inset:0;
  width:auto;height:auto;      /* решение 17.47 — без явной высоты: устройство привязано к верху и низу
                                  окна и следует за ним непрерывно. Явный 100dvh считался один раз при
                                  первой отрисовке в Chrome на Android, когда панель браузера ещё в переходном
                                  состоянии, и застывал на 5/6; перезагрузка давала уже верное значение */
  border-radius:0;overflow:hidden;
  background:var(--color-bg-primary);
  box-shadow:none;
  touch-action:pan-y;
}
.DevBar{display:none!important}
/* Мобильная ветка: устройство занимает окно целиком. Эта же ветка работает внутри рамки
   кейса шириной 390 — прототип и там обязан занимать её полностью.
   `dvh` убран: динамическая высота меняется непрерывно, пока Safari прячет и достаёт
   свою панель, раскладка пересчитывается на лету и снизу мелькает полоса.
   `svh` — высота при ВИДИМОЙ панели, она не меняется при скролле. Цена — несколько
   пунктов высоты, которыми мы всё равно не могли пользоваться надёжно.
   `position:fixed` вместо участия в потоке: `overflow:hidden` на body в iOS не гарантирует,
   что не прокрутится сама страница. Скроллится только .Screen__scroll внутри. */
/* Витрина по прямой ссылке (решение 17.26) — противоположная ветка того же условия:
   применяется ровно тогда, когда устройство НЕ растянуто на весь вьюпорт.
   На телефоне и внутри рамки кейса шириной 390 работает ветка выше, и здесь не меняется
   ничего. Меняется только оформление ВОКРУГ устройства: внутри те же тёмные токены,
   ни один экран приложения об этой правке не знает. */
@media (min-width:621px) and (min-height:901px) and (hover:hover){
  body{background:var(--color-stage-bg)}
  .Stage{gap:var(--space-4)}
  .Device{
    position:relative;inset:auto;
    width:var(--size-frame-w);height:var(--size-frame-h);
    border-radius:var(--size-device-radius);
    box-shadow:0 0 0 var(--size-stage-bezel) var(--color-stage-bezel), var(--effect-stage-shadow);
  }
  body .DevBar{display:flex!important}
  /* Панель управления витрины (решение 17.31): человек приходит по прямой ссылке
     из кейса, круг он уже видел и хочет потрогать — поэтому автостарта тут нет,
     экран открывается обычным и всё кликабельно. Кнопка запускает тот же Demo.start(). */
  body .StagePanel{display:flex}   /* со `body`: базовое правило описано ниже по файлу */
  /* Дев-панель берёт цвета из тёмной палитры и на светлом фоне пропадает — перекрашиваем.
     Селектор со `body` намеренно: базовые правила .DevBar описаны НИЖЕ по файлу
     и при равной специфичности выигрывали бы по порядку. */
  body .DevBar{color:var(--color-stage-ink-dim)}
  body .DevBar button,body .DevBar select{
    background:var(--color-stage-chip);
    border-color:var(--color-stage-hairline);
    color:var(--color-stage-ink);
  }
}

.ScreenStack{position:absolute;inset:0}
.Screen{
  position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(180deg,var(--color-bg-gradient-top) 0%,var(--color-bg-primary) 42%);
  will-change:transform,opacity;
}
.Screen__scroll{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:calc(var(--size-safe-top) + var(--space-2)) var(--size-gutter) calc(var(--size-safe-bottom) + var(--space-6));
}
.Screen__scroll--tab{padding-bottom:calc(var(--size-safe-bottom) + var(--size-tabbar-h) + var(--space-10))}
.Screen__scroll--flush{padding-left:0;padding-right:0}
.Screen__scroll--flush > *{padding-left:var(--size-gutter);padding-right:var(--size-gutter)}
.Screen__scroll--flush > .flush{padding-left:0;padding-right:0}
/* На flush-экранах поле задаётся паддингом прямых детей. Для .Segment это ломает сетку:
   у него есть собственный фон и рамка, и визуальный бокс становится 390 вместо 342 —
   сегмент упирается в края и режется скруглением устройства. Поле ему нужно маргином. */
.Screen__scroll--flush > .Segment{
  padding-left:2px;padding-right:2px;
  margin-inline:var(--size-gutter);
}
/* Центровка по высоте — только 03. Не justify-content:center на скролле:
   при содержимом выше вьюпорта он обрезал бы верх и до него нельзя было бы доскроллить.
   Флекс-колонка + min-height:100% у обёртки и margin-block:auto: есть слак — блок
   встаёт по центру, кончился — обычный скролл сверху вниз, ничего не отрезая. */
.Screen__scroll--center{display:flex;flex-direction:column}
.Screen__scroll--center > .Screen__mid{margin-block:auto;display:flex;flex-direction:column}

/* нижний скрим — третья правка решения 10.10: тёмный низ на любом положении скролла */
.ScrimBottom{
  position:absolute;left:0;right:0;bottom:0;height:190px;pointer-events:none;z-index:3;
  background:linear-gradient(180deg,transparent 0%,var(--color-bg-scrim-bottom) 78%);
}

/* --- статус-бар и home indicator (глобальный chrome) --- */
.StatusBar{
  position:absolute;top:0;left:0;right:0;height:var(--size-safe-top);z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--space-6) 0 var(--space-8);pointer-events:none;
}
.StatusBar__time{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0;pointer-events:auto;cursor:default}
.StatusBar__island{
  position:absolute;left:50%;transform:translateX(-50%);top:11px;
  width:124px;height:36px;border-radius:var(--radius-full);background:var(--color-text-inverse);
}
.StatusBar__ind{display:flex;align-items:center;gap:var(--space-1)}
.StatusBar__bar{width:17px;height:11px;border-radius:var(--radius-indicator);background:var(--color-text-primary);opacity:.55}
.StatusBar__bat{width:25px;height:12px;border-radius:var(--radius-indicator);border:1.5px solid var(--color-text-primary);opacity:.9;position:relative}
.StatusBar__bat::after{content:"";position:absolute;inset:1.5px;right:6px;background:var(--color-text-primary);border-radius:var(--radius-hairline)}
.HomeInd{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:140px;height:5px;border-radius:var(--radius-full);
  background:var(--color-text-primary);opacity:.35;z-index:45;pointer-events:none;
}

/* --- слои --- */
.SheetLayer,.BannerLayer{position:absolute;inset:0;z-index:30;pointer-events:none}
.BannerLayer{z-index:44}

/* ============================================================================
   §3 · КОМПОНЕНТЫ · 10 штук, 42 варианта — один в один с Figma

/* --- Button · 88:50 · Variant × State (12) ------------------------------- */
.Button{
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  width:100%;min-height:var(--size-button-h);height:var(--size-button-h);
  border-radius:var(--radius-full);
  font-size:17px;line-height:22px;font-weight:600;
  transition:transform var(--motion-micro) var(--ease-standard),
             opacity var(--motion-micro) var(--ease-standard),
             background-color var(--motion-micro) var(--ease-standard);
  user-select:none;
}
.Button[data-variant="primary"]{background:var(--color-accent-default);color:var(--color-text-inverse)}
.Button[data-variant="secondary"]{
  background:var(--color-glass-fill);color:var(--color-text-primary);
  border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass);-webkit-backdrop-filter:var(--effect-glass);
  position:relative;isolation:isolate;
}
/* «пол» решения 10.10 — вторичная кнопка стоит на кадре, фон под ней непредсказуем */
.Button[data-variant="secondary"]::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--color-glass-floor);z-index:-1;
}
.Button[data-variant="text"]{
  background:none;color:var(--color-accent-default);height:var(--size-tap-min);min-height:var(--size-tap-min);
}
.Button[data-state="pressed"],.Button:active{transform:scale(.97);opacity:.8}
.Button[data-state="disabled"]{
  background:var(--color-surface-raised);color:var(--color-text-tertiary);
  border-color:var(--color-border-default);pointer-events:none;transform:none;opacity:1;
}
.Button[data-state="disabled"]::before{background:none}
.Button[data-state="loading"]{pointer-events:none}
.Button[data-state="loading"] .Button__label{visibility:hidden}
.Button[data-state="loading"]::after{
  content:"";position:absolute;width:20px;height:20px;border-radius:var(--radius-full);
  border:2px solid currentColor;border-top-color:transparent;animation:spin 800ms linear infinite;
}
.Button{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- DayCell · 89:16 · State (6) ---------------------------------------- */
.DayCell{
  position:relative;width:var(--size-day-cell);height:var(--size-day-cell);
  border-radius:var(--radius-sm);overflow:visible;
  background:var(--color-surface-day-empty);
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--motion-micro) var(--ease-standard);
}
.DayCell::after{ /* тап-зона 44 при ячейке 40 — вылет псевдоэлементом, шаг 48 не трогаем */
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--size-tap-min);height:var(--size-tap-min);
}
.DayCell .Frame{border-radius:var(--radius-sm);overflow:hidden;position:absolute;inset:0}
.DayCell[data-state="kept"],.DayCell[data-state="kept-extra"],.DayCell[data-state="today"]{cursor:pointer}
.DayCell[data-state="kept"]:active,.DayCell[data-state="kept-extra"]:active,
.DayCell[data-state="today"]:active,.DayCell[data-state="skipped-available"]:active{transform:scale(.94)}
/* Kept-extra — единственная тихая точка в продукте (решение 9.2) */
.DayCell[data-state="kept-extra"]::before{
  content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;z-index:2;
  border-radius:var(--radius-full);background:var(--color-accent-default);
  box-shadow:var(--effect-glow-accent-sm);
}
/* Today — свечение, а не толщина обводки (решение 10.12) */
.DayCell[data-state="today"]{
  box-shadow:var(--effect-glow-accent-lg);
  outline:2px solid var(--color-accent-default);outline-offset:0;
}
/* Skipped-available — «+N» приглашением, без обводки (решения 10.7, 10.8) */
.DayCell[data-state="skipped-available"]{
  color:var(--color-accent-default);cursor:pointer;
  box-shadow:var(--effect-glow-accent-sm);
}
/* Future и Skipped-empty совпадают попиксельно — намеренно (решения 4.5, 10.7) */
.DayCell[data-state="future"],.DayCell[data-state="skipped-empty"]{background:var(--color-surface-day-empty)}
/* решение 15.5 — число дня месяца, только на ячейках с кадром.
   Текст лежит на кадре без плашки (10.11): читаемость угловым скримом,
   у которого нет видимого начала, — тот же приём, что у вотермарка. */
.DayCell__num{
  position:absolute;left:4px;bottom:2px;z-index:2;
  color:var(--color-text-on-image);
  text-shadow:0 1px 4px var(--color-scrim-image-strong);
  pointer-events:none;
}
.DayCell__num--month{
  font-size:var(--size-daycell-month-label);letter-spacing:.4px;
}
.DayCell__numScrim--wide{width:100%}
.DayCell__numScrim{
  position:absolute;left:0;bottom:0;width:75%;height:55%;z-index:1;pointer-events:none;
  border-radius:0 0 0 var(--radius-sm);
  background:radial-gradient(130% 130% at 0% 100%,
    var(--color-scrim-image-strong) 0%, var(--color-scrim-image-zero) 72%);
}

/* --- TabBar · 90:56 · Active (3) ---------------------------------------- */
.TabBar{
  position:absolute;bottom:calc(var(--size-safe-bottom) + var(--space-2));left:50%;
  transform:translateX(-50%);
  width:var(--size-tabbar-w);height:var(--size-tabbar-h);z-index:20;
  border-radius:var(--radius-full);
  background:var(--color-glass-fill);
  border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass);-webkit-backdrop-filter:var(--effect-glass);
  box-shadow:var(--effect-chrome-shadow);
  display:flex;isolation:isolate;overflow:hidden;
}
.TabBar::before{content:"";position:absolute;inset:0;background:var(--color-glass-floor);z-index:-1}
/* свечение — ровно как в Figma 90:26: круг 56, accent/glow 55 %, размытие 9.
   Свою версию (жёсткий диск 34 pt + двойная тень) убрал: под стеклом она читалась
   тёмным пятном, которого в макете нет. Геометрия и поведение прежние — центр на иконке,
   едет вместе с активным табом. */
.TabBar__glow{
  position:absolute;top:20px;left:0;
  width:var(--size-tabbar-glow);height:var(--size-tabbar-glow);
  transform:translate(-50%,-50%);border-radius:var(--radius-full);
  background:var(--color-accent-glow);opacity:.55;
  filter:blur(var(--blur-tabbar-glow));
  transition:left var(--motion-menu) var(--ease-standard);pointer-events:none;
}
.TabBar__item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--color-text-secondary); /* решение 10.10 — неактивный таб на secondary, не tertiary */
  transition:color var(--motion-icon) var(--ease-standard);
  z-index:1;
}
.TabBar__item[aria-selected="true"]{color:var(--color-accent-default)}
.TabBar__icon{width:22px;height:22px;display:block;transition:transform var(--motion-icon) var(--ease-standard)}
.TabBar__item:active .TabBar__icon{transform:scale(.9)}

/* --- RecapCard · 91:21 · State (2) -------------------------------------- */
.RecapCard{
  position:relative;flex:0 0 auto;
  width:var(--size-recap-card-w);height:var(--size-recap-h);
  border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;
  background:var(--color-surface-raised);
  transition:transform var(--motion-micro) var(--ease-standard);
}
.RecapCard:active{transform:scale(.98)}
.RecapComp{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.RecapComp .Frame{border-radius:0}
/* решение 10.11 — текст на кадре, без плашки; скрим в семь стопов, чтобы у него не было начала */
.Scrim7{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,
    var(--color-scrim-image-strong) 0%,
    var(--color-scrim-image-1) 14%,
    var(--color-scrim-image-2) 28%,
    var(--color-scrim-image-3) 40%,
    var(--color-scrim-image-4) 55%,
    var(--color-scrim-image-5) 75%,
    var(--color-scrim-image-zero) 100%);
}
.RecapCard__text{position:absolute;left:var(--space-3);right:var(--space-3);bottom:var(--space-3);z-index:2}
.RecapCard[data-state="composing"]{cursor:default}
.RecapCard[data-state="composing"] .RecapComp{filter:blur(6px) saturate(.4);opacity:.5}

/* --- RecapSpine · 91:29 ------------------------------------------------- */
.RecapSpine{
  position:relative;flex:0 0 auto;
  width:var(--size-recap-spine-w);height:var(--size-recap-h);
  border-radius:var(--radius-md);overflow:hidden;cursor:pointer;
  background:var(--color-surface-raised);
}
.RecapSpine .Scrim7{ /* тот же приём, но от левого края: текст стоит вертикально */
  background:linear-gradient(90deg,
    var(--color-scrim-image-strong) 0%, var(--color-scrim-image-1) 14%, var(--color-scrim-image-2) 28%,
    var(--color-scrim-image-3) 40%, var(--color-scrim-image-4) 55%, var(--color-scrim-image-5) 75%,
    var(--color-scrim-image-zero) 100%);
}
.RecapSpine__label{
  position:absolute;left:0;top:0;bottom:0;width:100%;z-index:2;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
}

/* --- BalanceChip · 94:16 · State (2) ------------------------------------ */
.BalanceChip{
  display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:var(--size-tabbar-h);
  padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);
  background:var(--color-surface-raised);border:var(--size-hairline) solid var(--color-border-default);
}
.BalanceChip__main{flex:1;min-width:0}
.BalanceChip[data-state="low"] .BalanceChip__coins{color:var(--color-ai-error)}

/* --- EffectTile · 94:51 · State (3) ------------------------------------- */
.EffectTile{
  position:relative;height:var(--size-effect-tile-h);
  border-radius:var(--radius-lg);overflow:hidden;text-align:left;
  background:var(--color-surface-raised);border:var(--size-hairline) solid var(--color-border-default);
  display:flex;flex-direction:column;
  transition:transform var(--motion-micro) var(--ease-standard);
}
.EffectTile:active{transform:scale(.97)}
.EffectTile__prev{height:var(--size-effect-prev-h);position:relative;overflow:hidden}
.EffectTile__body{padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-1)}
.EffectTile[data-state="not-enough"] .EffectTile__price{color:var(--color-ai-error)}
.EffectTile[data-state="not-enough"] .EffectTile__prev{opacity:.45}
.EffectTile[data-state="rendering"]{pointer-events:none}
.EffectTile[data-state="rendering"] .EffectTile__prev::after{
  content:"";position:absolute;inset:0;background:var(--color-accent-wash);
  animation:pulse 1600ms linear infinite;
}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}

/* --- Sheet · 95:14 · Detent (2) ----------------------------------------- */
.Scrim{
  position:absolute;inset:0;background:var(--color-scrim-sheet);opacity:0;pointer-events:auto;
  transition:opacity var(--motion-sheet-in) var(--ease-standard);
}
.Scrim.is-in{opacity:1}
.Sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  background:var(--color-surface-raised);
  backdrop-filter:var(--effect-glass-dense);-webkit-backdrop-filter:var(--effect-glass-dense);
  box-shadow:var(--effect-chrome-shadow);
  transform:translateY(100%);
  transition:transform var(--motion-sheet-in) var(--ease-sheet);
  display:flex;flex-direction:column;pointer-events:auto;touch-action:none;
  overflow:hidden;
}
.Sheet::before{ /* светлая кромка сверху */
  content:"";position:absolute;top:0;left:var(--space-6);right:var(--space-6);height:var(--size-hairline);
  background:var(--color-glass-specular);
}
.Sheet[data-detent="medium"]{height:var(--size-sheet-medium)}
.Sheet[data-detent="large"]{height:var(--size-sheet-large)}
.Sheet.is-in{transform:translateY(0)}
.Sheet.is-out{transition:transform var(--motion-sheet-out) var(--ease-accel)}
.Sheet__grab{
  width:36px;height:5px;border-radius:var(--radius-full);background:var(--color-text-tertiary);
  opacity:.6;margin:var(--space-2) auto var(--space-1);flex:0 0 auto;
}
.Sheet__body{
  flex:1;overflow-y:auto;padding:var(--space-4) var(--size-gutter) var(--size-safe-bottom);
  display:flex;flex-direction:column;gap:var(--space-2);
}

/* --- RenderStages · 103:80 · Stage (3) ---------------------------------- */
.RenderStages{display:flex;flex-direction:column;gap:var(--space-3)}
.RenderStages__row{display:flex;align-items:center;gap:var(--space-3)}
.RenderStages__dot{

  border:2px solid var(--color-text-tertiary);

}
.RenderStages__label{flex:1;color:var(--color-text-tertiary);transition:color var(--motion-menu) var(--ease-standard)}
.RenderStages__done{color:var(--color-accent-default);opacity:0;transition:opacity var(--motion-menu) var(--ease-standard)}
.RenderStages__row[data-status="done"] .RenderStages__dot{border-color:var(--color-accent-default);background:var(--color-accent-default)}
.RenderStages__row[data-status="done"] .RenderStages__label{color:var(--color-text-secondary)}
.RenderStages__row[data-status="done"] .RenderStages__done{opacity:1}
.RenderStages__row[data-status="active"] .RenderStages__dot{

  padding:var(--space-3) var(--space-3);
  border-radius:var(--radius-md);
  background:var(--color-surface-raised);
  border:var(--size-hairline) solid var(--color-border-default);
  transition:border-color var(--motion-menu) var(--ease-standard),
             background-color var(--motion-menu) var(--ease-standard),
             transform var(--motion-micro) var(--ease-standard);

<style>
/* ============================================================================
   §4 · ЭКРАНЫ
   ========================================================================= */

/* --- кадр и процедурная заглушка (решение 8.12) ------------------------- */
/* height:100% — у .Frame нет содержимого в потоке (все слои абсолютные), поэтому
   без этого он схлопывается в 0 в любом контейнере с заданной высотой:
   .Hero, .Reveal, .KeptFrame, .ShareCard, .FilterCard__img, .PickTile, .RecapSpine.
   Там, где высота задана точечно (.PickGrid, инлайн-стиль), правило перекрывается. */
.Frame{position:relative;overflow:hidden;background:var(--color-surface-raised);height:100%}
/* ЗАГЛУШКА, НЕ ДИЗАЙН. Кадра под эффектом Snow globe в макете нет: нода `106:92` содержит
   тот же файл, что обычный апгрейд (assets/FRAMES.md п. 3). Без обработки третья позиция
   переключателя читалась бы как «ничего не произошло». Берём today.jpg и гоним через
   выраженный холодный сдвиг, подъём яркости и размытие по краям. Заменить настоящим
   рендером по промпту из assets/PROMPTS.md — см. «известные срезы» в component-map.md. */
.Frame--fx .Frame__img{filter:hue-rotate(165deg) saturate(1.45) brightness(1.18) contrast(1.05)}
.Frame--fx::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  -webkit-mask-image:radial-gradient(112% 92% at 50% 44%,transparent 50%,var(--color-bg-primary) 100%);
          mask-image:radial-gradient(112% 92% at 50% 44%,transparent 50%,var(--color-bg-primary) 100%);
}
.Frame--fx::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,var(--color-accent-wash) 0%,transparent 58%);
}

/* подмена версии кадра — кросс-фейд поверх старого слоя, размер не меняется (реестр №33) */
.Frame--fade{position:absolute;inset:0;opacity:0;
  transition:opacity var(--motion-menu) var(--ease-crossfade)}
.Frame--fade.is-in{opacity:1}
.Frame__ph{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 88% at var(--px) var(--py),
      color-mix(in srgb,var(--color-accent-default) 22%,transparent) 0%, transparent 62%),
    radial-gradient(95% 70% at var(--qx) var(--qy),
      color-mix(in srgb,var(--color-accent-glow) 38%,transparent) 0%, transparent 72%),
    linear-gradient(var(--ang),
      var(--color-bg-gradient-top) 0%,
      var(--color-surface-raised) 52%,
      var(--color-bg-primary) 100%);
  filter:hue-rotate(var(--hue)) saturate(var(--sat));
}
.Frame__ph::after{ /* тихое зерно из токена текста, не из случайного цвета */
  content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(var(--ang2),
    color-mix(in srgb,var(--color-text-primary) 3%,transparent) 0 1px,
    transparent 1px 3px);
}
.Frame__vig{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(105% 88% at 50% 42%,
    var(--color-scrim-image-zero) 26%, var(--color-scrim-image-strong) 100%);
}
.Frame__img{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity var(--motion-menu) var(--ease-standard);
}
.Frame__img.is-in{opacity:1}

/* --- навбар --- */
.NavBar{display:flex;align-items:center;min-height:var(--size-tap-min);margin-left:calc(var(--space-1) * -1)}
.NavBar__back{display:flex;align-items:center;gap:2px;color:var(--color-accent-default);
  height:var(--size-tap-min);padding-right:var(--space-3);font-size:17px;font-weight:400}
.NavBar__title{flex:1;text-align:center;padding-right:var(--space-10)}

.stack{display:flex;flex-direction:column}
.gap1{gap:var(--space-1)}.gap2{gap:var(--space-2)}.gap3{gap:var(--space-3)}
.gap4{gap:var(--space-4)}.gap5{gap:var(--space-5)}.gap6{gap:var(--space-6)}
.row{display:flex;align-items:center}
.mt2{margin-top:var(--space-2)}.mt3{margin-top:var(--space-3)}.mt4{margin-top:var(--space-4)}
.mt5{margin-top:var(--space-5)}.mt6{margin-top:var(--space-6)}.mt8{margin-top:var(--space-8)}
.center{text-align:center}
.card{background:var(--color-surface-raised);border-radius:var(--radius-lg);overflow:hidden}
.hair{height:var(--size-hairline);background:var(--color-border-default)}

/* --- 03 карточка фильтра --- */
.FilterCard{border-radius:var(--radius-lg);overflow:hidden;background:var(--color-surface-raised)}
.FilterCard__img{position:relative;height:var(--size-filter-img-h)}
/* Заглушка карточки дня (решение 17.13). У дневного апгрейда нет имени и нет превью
   (решение 15) — фотография здесь читалась бы как образец результата и обещала бы то,
   чего продукт не обещает. Диафрагма отсылает к съёмке и к оптике направления
   и при этом не обещает ничего. Скрима под текстом нет: кадра под ним тоже нет. */
.FilterCard__blank{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--color-bg-gradient-top) 0%,transparent 72%),
             var(--color-surface-raised);
  color:var(--color-text-tertiary);
}
.FilterCard__blank svg{width:var(--size-lens-mark);height:var(--size-lens-mark);
  margin-bottom:var(--space-10)}
.FilterCard__text{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-4);z-index:2}
.FilterCard__foot{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}

/* --- 05 проявление --- */
.Hero{position:relative;height:var(--size-hero-h);width:100%}
.Hero--day{height:var(--size-hero-day-h)}
.Hero__glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 42%,var(--color-accent-wash) 0%,transparent 70%)}
.Hero__text{position:absolute;left:var(--size-gutter);right:var(--size-gutter);bottom:var(--space-6);z-index:3}
.Reveal{position:absolute;inset:0;transition:filter var(--motion-menu) linear}
/* .Reveal__veil убран решением 17.2: вуаль означала «ещё не готово», а теперь
   оригинал готов с первого кадра. Читаемость заголовка держит .Scrim7 */
/* --- заставка (решение 17.4): вордмарк на свечении героя, без спиннера и прогресса --- */
.Splash{position:absolute;inset:0;z-index:35;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--color-bg-primary);opacity:0;
  transition:opacity var(--motion-sheet-in) var(--ease-standard)}
.Splash.is-in{opacity:1}
.Splash.is-out{transition:opacity var(--motion-alert) var(--ease-accel)}
.Splash > .t-display{position:relative;z-index:1}
/* решение 17.2 — снизу настоящий оригинал, сверху результат; кросс-фейд идёт весь рендер */
.Reveal__after{position:absolute;inset:0;opacity:0}

/* --- вотермарк на кадре, без плашки --- */
.Watermark{position:absolute;right:var(--space-3);bottom:var(--space-3);z-index:3;
  color:var(--color-text-on-image);opacity:.85;
  text-shadow:0 1px 8px var(--color-scrim-image-strong)}
.CornerScrim{position:absolute;right:0;bottom:0;width:60%;height:40%;pointer-events:none;
  background:radial-gradient(120% 120% at 100% 100%,var(--color-scrim-corner) 0%,transparent 70%)}

/* --- сегмент-контрол --- */
.Segment{position:relative;display:flex;padding:2px;border-radius:var(--radius-full);
  background:var(--color-surface-raised);border:var(--size-hairline) solid var(--color-border-default)}
.Segment__ind{position:absolute;top:2px;bottom:2px;border-radius:var(--radius-full);
  background:var(--color-accent-wash);border:var(--size-hairline) solid var(--color-accent-default);
  transition:left var(--motion-menu) var(--ease-standard),width var(--motion-menu) var(--ease-standard)}
.Segment__item{flex:1;z-index:1;min-height:var(--size-tap-min);display:flex;align-items:center;
  justify-content:center;color:var(--color-text-secondary);
  transition:color var(--motion-menu) var(--ease-standard);padding:0 var(--space-2)}
.Segment__item[aria-selected="true"]{color:var(--color-accent-default)}

/* --- блок TOMORROW (идея 21) --- */
.Tomorrow{display:flex;align-items:center;gap:var(--space-3);
  min-height:var(--size-tomorrow-h);padding:0 var(--space-4);
  background:var(--color-surface-raised);border-radius:var(--radius-md)}

/* --- 07 полка и поле --- */
.Shelf{display:flex;gap:var(--space-2);overflow-x:auto;scroll-snap-type:x proximity;
  padding:0 var(--size-gutter);scrollbar-width:none}
.Shelf::-webkit-scrollbar{display:none}
.Shelf > *{scroll-snap-align:start}
.WeekHead,.DayField{display:grid;grid-template-columns:repeat(7,var(--size-day-cell));
  gap:calc(var(--size-day-step) - var(--size-day-cell));justify-content:center}
.WeekHead > span{text-align:center;color:var(--color-text-tertiary)}

/* --- 04a камера (решение 17.19) ----------------------------------------
   Видоискатель во весь кадр, без скруглений: он не карточка, он изображение.
   Ни вспышки, ни переключения камер, ни режимов — нерабочая кнопка приглашает
   на тап, который ничего не делает; лучше пусто. */
.Camera{position:absolute;inset:0;background:var(--color-bg-primary);overflow:hidden;
  display:flex;flex-direction:column}
/* поля сверху и снизу — на них живут элементы; раньше они лежали поверх изображения */
.Camera__top{flex:0 0 var(--size-camera-top);display:flex;align-items:center;
  padding:var(--size-safe-top) var(--space-4) 0}
.Camera__view{position:relative;flex:0 0 var(--size-camera-preview-h);overflow:hidden}
.Camera__view .Frame{border-radius:0}
/* очень медленный масштаб: изображение читается живым, а не фотографией.
   alternate вместо простого повтора — иначе на 20-й секунде кадр скачком возвращается в 1.0 */
.Camera__view .Frame__img{
  animation:viewfinder var(--motion-viewfinder) linear infinite alternate;
  transform-origin:50% 50%;
}
@keyframes viewfinder{from{transform:scale(1)}to{transform:scale(1.04)}}
.Camera__close{
  position:relative;z-index:3;
  width:var(--size-tap-min);height:var(--size-tap-min);border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;color:var(--color-text-on-image);
  background:var(--color-glass-fill);backdrop-filter:var(--effect-glass);
  -webkit-backdrop-filter:var(--effect-glass);isolation:isolate;
  transition:transform var(--motion-micro) var(--ease-standard)}
.Camera__close::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--color-glass-floor);z-index:-1}
.Camera__close:active{transform:scale(.97);opacity:.8}
.Camera__bar{
  flex:1;z-index:3;padding:0 var(--size-gutter) var(--size-safe-bottom);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.Camera__thumb{
  justify-self:start;width:var(--size-tap-min);height:var(--size-tap-min);
  border-radius:var(--radius-md);overflow:hidden;position:relative;
  border:var(--size-hairline) solid var(--color-glass-hairline);
  transition:transform var(--motion-micro) var(--ease-standard)}
.Camera__thumb:active{transform:scale(.97);opacity:.8}
/* спуск — белое кольцо с заливкой, как в системной камере */
.Camera__shutter{
  justify-self:center;width:var(--size-shutter);height:var(--size-shutter);
  border-radius:var(--radius-full);
  border:var(--size-shutter-ring) solid var(--color-text-on-image);
  display:flex;align-items:center;justify-content:center;background:none}
.Camera__shutter::after{
  content:"";width:calc(100% - var(--space-2));height:calc(100% - var(--space-2));
  border-radius:var(--radius-full);background:var(--color-text-on-image);
  transition:transform var(--motion-micro) var(--ease-standard)}
.Camera__shutter:active::after{transform:scale(.88)}

/* .GalleryOne снят решением 17.22 вместе с одиночным снимком: галерея снова
   ряд MEANTIME PICKED плюс сетка Recents на .PickTile и .PickGrid */

/* --- 09 карточка шеринга --- */
.ShareCard{position:relative;width:var(--size-share-card-w);height:var(--size-share-card-h);
  border-radius:var(--radius-lg);overflow:hidden;margin:0 auto}
.ShareCard__text{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-5);z-index:2}
/* решение 17.12 — вотермарк стал вордмарком: тот же начерк, что t-display на 01 и 03,
   размер под карточку. У неподписчика он же служит меткой, у подписчика снимается. */
.ShareCard__mark{
  font-size:var(--size-sharecard-mark);line-height:1.08;white-space:nowrap;
  text-shadow:0 1px 10px var(--color-scrim-image-strong);
}
.TapRow{display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:var(--size-tap-min);padding:0 var(--space-4);border-radius:var(--radius-md);
  background:var(--color-surface-raised);border:var(--size-hairline) solid var(--color-border-default);
  transition:transform var(--motion-micro) var(--ease-standard)}
.TapRow:active{transform:scale(.98)}

/* --- панель витрины (решение 17.31) -------------------------------------
   Живёт только в ветке витрины: показывается правилом .StagePanel{display:flex}
   внутри её медиазапроса. На телефоне, на узком окне и внутри рамки кейса 390
   ветка не срабатывает и панели нет — там приложение занимает вьюпорт целиком,
   а в кейсе управление даёт сама страница, дублировать его нельзя. */
.StagePanel{
  /* Якорь — центр .Stage, он же центр устройства: сама .Stage шире устройства,
     потому что снизу в ней лежит дев-бар, и right:100% увёл бы панель за край окна. */
  display:none;position:absolute;top:0;
  right:calc(50% + (var(--size-frame-w) / 2) + var(--space-8));
  width:var(--size-stage-panel-w);flex-direction:column;gap:var(--space-3);
  align-items:flex-start;font-family:var(--font-ui)}
.StagePanel__btn{
  padding:var(--space-3) var(--space-5);border-radius:var(--radius-full);
  background:var(--color-stage-panel);color:var(--color-stage-ink);
  box-shadow:var(--effect-stage-panel-shadow);
  font-size:15px;font-weight:600;white-space:nowrap;
  transition:transform var(--motion-micro) var(--ease-standard),opacity var(--motion-micro) var(--ease-standard)}
.StagePanel__btn:active{transform:scale(.97)}
.StagePanel__btn[disabled]{opacity:.45;cursor:default}
.StagePanel__note{color:var(--color-stage-ink-dim);font-size:13px;line-height:18px}

/* --- ShareSheet · шит после шеринга (решение 17) ------------------------
   Имитация системного листа iOS в токенах проекта: строка превью,
   ряд адресатов горизонтальным скроллом, группа действий. --------------- */
.ShareSheet{display:flex;flex-direction:column;gap:var(--space-4)}
.ShareSheet__prev{display:flex;align-items:center;gap:var(--space-3);
  padding:0 var(--size-gutter)}
.ShareSheet__thumb{position:relative;flex:0 0 auto;
  height:var(--size-share-thumb-h);border-radius:var(--radius-md);overflow:hidden}
.ShareSheet[data-kind="day"]  .ShareSheet__thumb{width:var(--size-share-thumb-day-w)}
.ShareSheet[data-kind="week"] .ShareSheet__thumb{width:var(--size-share-thumb-week-w)}
/* превью повторяет композицию карточки один в один: та же разметка, ужатая трансформом.
   Своей разметки у превью нет намеренно — иначе оно расходится с тем, что уйдёт в шеринг. */
.ShareSheet__thumb .ShareCard--mini{position:absolute;top:0;left:0;margin:0;
  transform-origin:0 0;transform:scale(var(--share-thumb-scale))}
.ShareSheet__dests{display:flex;gap:var(--space-3);overflow-x:auto;scrollbar-width:none;
  padding:0 var(--size-gutter)}
.ShareSheet__dests::-webkit-scrollbar{display:none}
.ShareSheet__dest{flex:0 0 auto;width:var(--size-share-dest-col);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
  transition:transform var(--motion-micro) var(--ease-standard)}
.ShareSheet__dest:active{transform:scale(.97);opacity:.8}
.ShareSheet__disc{width:var(--size-share-dest);height:var(--size-share-dest);
  border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;
  background:var(--color-surface-raised);
  border:var(--size-hairline) solid var(--color-border-default);
  color:var(--color-text-secondary)}
.ShareSheet__disc svg{width:var(--size-share-dest-icon);height:var(--size-share-dest-icon)}
.ShareSheet__cap{color:var(--color-text-secondary);text-align:center;
  width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ShareSheet__acts{margin:0 var(--size-gutter)}
.ShareSheet__act{display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:var(--size-tap-min);height:var(--size-button-h);padding:0 var(--space-4);
  color:var(--color-text-primary);
  transition:background var(--motion-micro) var(--ease-standard)}
.ShareSheet__act:active{background:var(--color-accent-wash)}
.ShareSheet__act svg{color:var(--color-text-secondary);flex:0 0 auto;
  width:var(--space-5);height:var(--space-5)}
.ShareSheet__act > span:last-child{display:flex;align-items:center}

/* --- 10 композиция рекапа --- */
.RecapFull{position:relative;height:var(--size-recap-comp-h);border-radius:var(--radius-lg);overflow:hidden}
/* Усиление скрима под текстовым блоком. Плашка запрещена решением 10.11, поэтому тянем
   тот же градиент — но только снизу: к границе квадрантов (50 % высоты) слой уходит в ноль,
   верхний ряд с размытыми квадрантами пейвола не трогается вовсе.
   Нужно потому, что текст шириной 310 лежит на обоих нижних кадрах, и правило тёмного ряда
   даёт запас всего 4.76:1 в худшей точке — на пороге. С усилением запас 5.5–6:1. */
.RecapFull .Scrim7::after,.RecapCard .Scrim7::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:50%;
  background:linear-gradient(0deg,
    var(--color-scrim-image-3) 0%,
    var(--color-scrim-image-3) 45%,
    var(--color-scrim-image-4) 92%,
    var(--color-scrim-image-zero) 100%);
}
.RecapFull .RecapComp .Frame[data-locked="1"]{filter:blur(9px) saturate(.5)}
.RecapFull__text{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-4);z-index:2}

/* --- 04 пикер --- */
.PickRow{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;padding:0 var(--size-gutter)}
.PickRow::-webkit-scrollbar{display:none}
.PickTile{position:relative;flex:0 0 auto;width:var(--size-pick-tile);height:var(--size-pick-tile);
  border-radius:var(--radius-md);overflow:hidden}
.PickTile[aria-selected="true"]{outline:3px solid var(--color-accent-default);outline-offset:-3px}
.PickTile__badge{position:absolute;right:var(--space-2);top:var(--space-2);z-index:2;
  width:22px;height:22px;border-radius:var(--radius-full);background:var(--color-accent-default);
  color:var(--color-text-inverse);display:none;align-items:center;justify-content:center;
  font-size:12px;font-weight:700}
.PickTile[aria-selected="true"] .PickTile__badge{display:flex}
.PickGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:0 2px}
.PickGrid .Frame{height:var(--size-pick-cell)}
.Skeleton{background:var(--color-surface-raised);border-radius:var(--radius-md);
  animation:pulse 1600ms linear infinite}

/* --- баннер сверху (в iOS нет тостов) --- */
.Banner{position:absolute;top:calc(var(--size-safe-top) - var(--space-2));left:var(--space-4);right:var(--space-4);
  padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);
  background:var(--color-glass-fill);border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass);-webkit-backdrop-filter:var(--effect-glass);
  box-shadow:var(--effect-chrome-shadow);isolation:isolate;
  transform:translateY(-140%);transition:transform var(--motion-menu) var(--ease-standard);
  pointer-events:auto}
.Banner::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--color-glass-floor);z-index:-1}
.Banner.is-in{transform:translateY(0)}
.Banner.is-out{transition:transform var(--motion-alert) var(--ease-accel)}

/* --- action sheet --- */
.ActionSheet{position:absolute;left:var(--space-2);right:var(--space-2);
  bottom:calc(var(--size-safe-bottom) + var(--space-2));z-index:2;
  display:flex;flex-direction:column;gap:var(--space-2);pointer-events:auto;
  transform:translateY(120%);transition:transform var(--motion-menu) var(--ease-standard)}
.ActionSheet.is-in{transform:translateY(0)}
.ActionSheet__grp{border-radius:var(--radius-lg);overflow:hidden;background:var(--color-surface-raised)}
.ActionSheet__btn{width:100%;min-height:var(--size-tap-min);height:var(--size-button-h);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.ActionSheet__btn[data-role="destructive"]{color:var(--color-ai-error)}
.ActionSheet__btn[data-role="cancel"]{font-weight:600;color:var(--color-accent-default)}

/* --- симуляция StoreKit --- */
.StoreKit{position:absolute;left:var(--space-3);right:var(--space-3);
  bottom:calc(var(--size-safe-bottom) + var(--space-3));z-index:3;
  padding:var(--space-5);border-radius:var(--radius-xl);
  background:var(--color-glass-fill);border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass-dense);-webkit-backdrop-filter:var(--effect-glass-dense);
  isolation:isolate;pointer-events:auto;
  transform:translateY(120%);transition:transform var(--motion-sheet-in) var(--ease-sheet)}
.StoreKit::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--color-glass-floor);z-index:-1}
.StoreKit.is-in{transform:translateY(0)}

/* --- список выгод --- */
.Bullets{display:flex;flex-direction:column;gap:var(--space-1);margin:0;padding:0;list-style:none}
.Bullets li{display:flex;gap:var(--space-3);align-items:flex-start}
.Bullets li::before{content:"";flex:0 0 auto;width:5px;height:5px;margin-top:7px;
  border-radius:var(--radius-full);background:var(--color-accent-default);box-shadow:var(--effect-glow-accent-sm)}

/* --- панель разработчика (вне устройства, на десктопе) --- */
.DevBar{display:flex;gap:var(--space-2);align-items:center;color:var(--color-text-tertiary);font-size:12px}
.DevBar button,.DevBar select{padding:6px 12px;border-radius:var(--radius-full);
  border:var(--size-hairline) solid var(--color-border-default);
  background:var(--color-surface-raised);color:var(--color-text-secondary);font-size:12px}
.EventLog{position:absolute;inset:0;z-index:60;background:var(--color-devpanel-bg);
  padding:calc(var(--size-safe-top) + var(--space-2)) var(--space-4) var(--space-8);
  overflow-y:auto;display:none;font-size:11px;line-height:16px;
  font-family:ui-monospace,monospace;color:var(--color-text-secondary)}
.EventLog.is-on{display:block}
.EventLog b{color:var(--color-accent-default);font-weight:600}

/* ============================================================================
   §12 · АВТОДЕМО (решение 14) — отдельный блок, выключается целиком
   ========================================================================= */
.DemoTap{
  position:absolute;z-index:50;width:56px;height:56px;margin:-28px 0 0 -28px;
  border-radius:var(--radius-full);pointer-events:none;
  background:var(--color-accent-wash);
  border:var(--size-hairline) solid var(--color-accent-default);
  box-shadow:var(--effect-glow-accent-lg);
  opacity:0;transform:scale(.4);
}
.DemoTap.is-on{animation:demoTap 620ms var(--ease-standard) forwards}
@keyframes demoTap{
  0%{opacity:0;transform:scale(.4)}
  35%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.25)}
}
.DemoBadge{
  position:absolute;z-index:52;left:50%;transform:translateX(-50%);
  bottom:calc(var(--size-safe-bottom) + var(--size-tabbar-h) + var(--space-5));
  padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);
  background:var(--color-glass-fill);border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass);-webkit-backdrop-filter:var(--effect-glass);
  isolation:isolate;color:var(--color-text-tertiary);
  opacity:0;transition:opacity var(--motion-menu) var(--ease-standard);pointer-events:auto;
}
.DemoBadge::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--color-glass-floor);z-index:-1}
.DemoBadge.is-on{opacity:1}
@media (prefers-reduced-motion:reduce){ .DemoTap.is-on{animation-duration:var(--motion-menu)} }

/* --- решение 28 реестра: prefers-reduced-motion --- */
@media (prefers-reduced-motion:reduce){
  /* решение 17.36 — длительности переходов остаются по гайдам; при «уменьшить движение»
     выключаются только самоиграющие анимации (пульс, наезд видоискателя, показ дельты) */
  .RenderStages__row[data-status="active"] .RenderStages__dot,

}

<script>
"use strict";
/* ============================================================================
   §5 · STATE — демо-состояние решения 8.5, единственный источник чисел
   ========================================================================= */
const DEMO = {
  periodStart:new Date(2026,7,5),   // среда 5 августа 2026
  today:new Date(2026,8,13),        // воскресенье 13 сентября 2026
  periodLength:100,
  dayIndex:40,
  kept:37,                          // 40 прошедших − 3 пропущенных; на всех экранах постоянно
  skipped:{12:0, 36:3, 38:1},       // день → сколько кадров той даты лежит в библиотеке
  /* upgradeToday снят решением 17.14: карточка задаёт вопрос, а не вешает ярлык функции */
  upgradeTomorrow:"ANOTHER UPGRADE",
  countdownStart:14*3600 + 32*60 + 6, // FREE UPGRADE RENEWS IN 14:32:06
  coinsStart:8,

};
const S = {
  period:"100 days",
  coins:DEMO.coinsStart,
  subscriber:false,
  /* photoDatesAllowed и diarySeen сняты решением 17.21 вместе со шторкой пре-пермишна:
     доступ к датам считается выданным всегда, показывать шторку при входе в Diary нечему */

  todayPreset:null,       // "upgraded" | "EXTRA" | "none"; имя эффекта — в effectName
  attempts:0,             // попытки рендера сегодня (мягкий потолок 3, решение 8.1)
  pickedFrame:null,
  effectPreset:null,
  effectSpent:0,
  effectName:null,        // имя эффекта из плитки каталога (находка QA №2)

  countdown:DEMO.countdownStart,
  onboarded:false
};
const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function dayDate(i){ const d=new Date(DEMO.periodStart); d.setDate(d.getDate()+i-1); return d; }
function fmtMD(d){ return MONTH[d.getMonth()]+" "+d.getDate(); }
function fmtMDup(d){ return (MONTH[d.getMonth()]+" "+d.getDate()).toUpperCase(); }
function dayState(i){
  if(i===DEMO.dayIndex) return S.todayKept ? (isExtra() ? "kept-extra":"kept") : "today";
  if(i>DEMO.dayIndex) return "future";
  /* решение 17.21 — доступ к датам выдан по умолчанию, метки +N видны всегда */
  if(i in DEMO.skipped) return DEMO.skipped[i]>0 ? "skipped-available" : "skipped-empty";
  return "kept";
}
/* решение 15.10 — первый СОХРАНЁННЫЙ кадр месяца несёт метку месяца вместо числа.
   В демо-состоянии это AUG 5 (старт периода) и SEP 1. Октябрь и ноябрь метки не получают:
   их дни ещё впереди, кадров у них нет, а пустая ячейка чисел не несёт (решение 16.2). */
function firstKeptOfMonth(i){
  const d=dayDate(i), st=dayState(i);
  if(!(st==="kept"||st==="kept-extra"||(st==="today"&&S.todayKept))) return false;
  for(let j=1;j<i;j++){
    const p=dayDate(j), ps=dayState(j);
    if(p.getMonth()===d.getMonth() && p.getFullYear()===d.getFullYear() &&
       (ps==="kept"||ps==="kept-extra")) return false;
  }
  return true;
}

/* кадр дня. Номер файла ≠ номер дня периода: пропущенные дни номер не занимают
   (карта `assets/FRAMES.md`, решение 17.7). Пропуски — 12 (16 авг), 36 (9 сен), 38 (11 сен).
   Последняя ячейка (день 40) несёт кадр сегодняшнего дня, а не `day-37` — решение 17.7. */
function frameOf(i){
  if(i===DEMO.dayIndex) return "today";
  if(i>DEMO.dayIndex || (i in DEMO.skipped)) return null;   /* будущее и пропуски кадра не имеют */
  let n=i;
  if(i>12) n--;
  if(i>36) n--;
  if(i>38) n--;
  return "day-" + String(n).padStart(2,"0");
}
function saveState(){ try{ localStorage.setItem("meantime.state", JSON.stringify(S)); }catch(e){} }
/* loadState убран решением 17.4: состояние живёт только внутри сессии.
   saveState() остаётся — он держит состояние при переходах между экранами. */

/* ============================================================================
   §6 · Img — кадры из ./assets, процедурная заглушка из токенов (решение 8.12)
   Пути только относительные — прототип уезжает на GitHub Pages (решение 12.2).
   ========================================================================= */
/* Заглушка эффекта: `fx-after` физически не существует, см. assets/FRAMES.md п. 3 */
/* решение 17.18 — заглушка снята: настоящие кадры эффектов лежат в assets/ */
const ASSET_ALIAS = {};

const Img = {
  status:{},   // name -> "ok" | "miss" | Promise
  hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); },
  /* заглушка целиком из токенов: угол, фаза и лёгкий поворот тона — детерминированы по имени */
  /* variant меняет ту же сцену, а не берёт другую: одно зерно, три сдвига
     из решения 15.6 — тональность и направление света, отделение объекта, температура */
  phVars(name, variant){
    const h=this.hash(name);
    let ang=((h)%140)+110, px=((h>>5)%80)+10, py=((h>>9)%60)+10,
        qx=((h>>13)%80)+10, qy=((h>>17)%70)+25,
        hue=((h>>21)%50)-25, sat=0.85+((h>>25)%40)/100;
    /* Сцена обязана остаться узнаваемой: композицию не зеркалим, двигаем свет.
       Решение 15.6 — за один переход меняются три вещи и только они:
       тональность и направление света · отделение объекта от фона · температура. */
    if(variant==="upgraded"){          /* дневной апгрейд */
      ang+=12;                                        /* тональность: градиент разворачивается */
      px=Math.min(88,px+20); py=Math.max(8,py-14);    /* направление света: ключевой свет уходит вверх-вправо */
      qx=Math.min(90,qx+10); qy=Math.max(12,qy-8);
      hue+=10; sat*=1.34;                             /* температура холоднее, цвет плотнее */
    }else if(variant==="small-delta"){ /* кадр уже хороший: глубина и зерно, тон почти тот же */
      ang+=5; py=Math.max(8,py-5); hue+=3; sat*=1.10;
    }else if(variant==="effect"){      /* эффект за монеты: другой мир, разница обязана быть крупной */
      ang+=88; px=100-px; py=100-py; qx=100-qx; hue-=46; sat*=1.75;
    }
    return "--ang:"+ang+"deg;--ang2:"+(((h>>3)%180))+"deg;"+
           "--px:"+px+"%;--py:"+py+"%;--qx:"+qx+"%;--qy:"+qy+"%;"+
           "--hue:"+hue+"deg;--sat:"+sat.toFixed(2)+";";
  },
  probe(name){
    if(this.status[name]) return Promise.resolve(this.status[name]);
    const p = new Promise(res=>{
      const im=new Image();
      im.onload  = ()=>{ this.status[name]="ok";   res("ok"); };
      im.onerror = ()=>{ this.status[name]="miss"; res("miss"); };
      im.src = "./assets/"+name+".jpg";
    });
    this.status[name]=p; return p;
  },
  /* Frame: заглушка стоит сразу, настоящий кадр приходит кросс-фейдом, раскладка не дёргается */
  make(name, cls, opts){
    opts=opts||{};
    const f=document.createElement("div");
    f.className="Frame"+(cls?" "+cls:"");
    f.dataset.img=name;
    const ph=document.createElement("div");
    ph.className="Frame__ph";
    ph.setAttribute("style", this.phVars(opts.seed||name, opts.variant));
    f.append(ph);
    /* отделение объекта от фона — виньетка поверх, только у обработанных вариантов */
    if(opts.variant){
      const v=document.createElement("div"); v.className="Frame__vig";
      v.style.opacity = opts.variant==="upgraded" ? ".55" : ".72";
      f.append(v);
    }
    const im=document.createElement("div"); im.className="Frame__img";
    f.append(im);
    if(!name) return f;   /* пропуск или будущий день — остаётся только заглушка */
    /* fx-after в макете нет: нода эффекта содержит тот же файл, что обычный апгрейд
       (assets/FRAMES.md п. 3). Берём today.jpg и метим слой под CSS-обработку. */
    const file = ASSET_ALIAS[name] || name;
    if(ASSET_ALIAS[name]) f.classList.add("Frame--fx");
    Promise.resolve(this.status[file] instanceof Promise ? this.status[file] : this.probe(file)).then(r=>{
      if(r==="ok"){ im.style.backgroundImage="url(./assets/"+file+".jpg)"; requestAnimationFrame(()=>im.classList.add("is-in")); }
    });
    return f;
  }
};

const AI = {
  cache:{},
  async load(path){
    if(this.cache[path]) return this.cache[path];
    try{
      const r = await fetch("./fixtures/ai/"+path+".json", {cache:"no-store"});
      if(r.ok){ const j = await r.json(); this.cache[path]=j; return j; }
    }catch(e){ /* file:// — ожидаемо, идём в инлайн-копию */ }
    this.cache[path] = FIXTURES[path];
    return FIXTURES[path];
  },
  /* прогон этапов; onStage(i,stage), onProgress(0..1), onSlow(), onDone(fx), onFail(fx) */
  run(fx, cb){
    const ctl = {cancelled:false, stage:null, timers:[]};
    const t = (fn,ms)=>{ const id=setTimeout(fn,ms); ctl.timers.push(id); return id; };
    ctl.cancel = ()=>{ ctl.cancelled=true; ctl.timers.forEach(clearTimeout); };
    Analytics.track("ai_request_started",{scenario:fx.scenario,preset_id:fx.preset_id||null,tier:fx.tier||null});
    const t0 = Date.now();

    if(fx.error_type && !fx.stages){       // мгновенные отказы вроде filter-missing
      t(()=>{ if(!ctl.cancelled) cb.onFail && cb.onFail(fx); }, fx.fail_after_ms||600);
      return ctl;
    }
    if(fx.error_type){                     // сбой посреди этапов
      let acc=0;
      (fx.stages||[]).forEach((s,i)=>{ t(()=>{ if(!ctl.cancelled){ctl.stage=s.id; cb.onStage&&cb.onStage(i,s);} }, acc); acc+=s.ms; });
      t(()=>{ if(ctl.cancelled) return;
        Analytics.track("ai_response_failed",{scenario:fx.scenario,error_type:fx.error_type});
        cb.onFail && cb.onFail(fx); }, fx.fail_after_ms||2500);
      return ctl;
    }
    let acc=0;
    (fx.stages||[]).forEach((s,i)=>{
      t(()=>{ if(!ctl.cancelled){ ctl.stage=s.id; cb.onStage && cb.onStage(i,s); } }, acc);
      acc += s.ms;
    });
    if(fx.slow_threshold_ms && fx.latency_ms > fx.slow_threshold_ms)
      t(()=>{ if(!ctl.cancelled) cb.onSlow && cb.onSlow(fx); }, fx.slow_threshold_ms);
    t(()=>{
      if(ctl.cancelled) return;
      Analytics.track("ai_response_completed",{scenario:fx.scenario,latency_ms:Date.now()-t0,
        fixture:fx.fixture,tier:fx.tier||null});
      if(fx.result && fx.result.confidence==="low")
        Analytics.track("ai_low_confidence_shown",{preset_id:fx.preset_id||null});
      cb.onDone && cb.onDone(fx);
    }, fx.latency_ms);
    return ctl;
  },
  /* стриминг подписи: посимвольно, чанк по словам (реестр №14) */
  stream(el, text, done){
    const step = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--motion-stream-char")) || 22;
    if(step===0){ el.textContent=text; done&&done(); return {cancel(){}}; }
    let i=0, id=null;
    const tick=()=>{
      let n=i+1; while(n<text.length && text[n]!==" ") n++;   // чанк по словам
      i=Math.min(n+1,text.length); el.textContent=text.slice(0,i);
      if(i<text.length) id=setTimeout(tick, step*(i-Math.max(0,i-6)));
      else done&&done();
    };
    tick();
    return {cancel(){ clearTimeout(id); }};
  }
};

    'stroke-linecap="round" stroke-linejoin="round">';
  const S2=S1;
  const g={
    /* волны и точка — «раздача рядом», а не знак производителя */
    airdrop:S1+'<path d="M4.8 10.2a10 10 0 0 1 14.4 0"/><path d="M8 13.3a5.6 5.6 0 0 1 8 0"/>'+
      '<circle cx="12" cy="17" r="1.5" fill="currentColor" stroke="none"/></svg>',
    messages:S1+'<path d="M20.5 11.4c0 3.6-3.8 6.6-8.5 6.6-1 0-1.9-.1-2.8-.4-1 .8-2.4 1.5-4 1.7'+

    /* обычная камера, без радужного контура и без квадрата с точкой в углу */
    instagram:S1+'<rect x="3.2" y="7" width="17.6" height="12.4" rx="3.2"/>'+
      '<circle cx="12" cy="13.2" r="3.5"/><path d="M8.6 7l1.1-2.2h4.6L15.4 7"/></svg>',
    /* две реплики внахлёст — разговор, а не телефонная трубка в круге */
    whatsapp:S1+'<path d="M3.6 9.2c0-2.6 2.8-4.7 6.2-4.7s6.2 2.1 6.2 4.7-2.8 4.7-6.2 4.7'+
      'c-.7 0-1.4-.1-2-.3-.8.6-1.8 1.1-2.9 1.3.6-.7 1-1.4 1.1-2.1C4.5 11.9 3.6 10.6 3.6 9.2z"/>'+
      '<path d="M13.4 15.6c1.9-.2 3.5-1 4.5-2.1 1.4.9 2.3 2.2 2.3 3.6 0 .9-.4 1.8-1.1 2.5'+
      '.1.6.5 1.2 1 1.8-1-.2-1.8-.6-2.5-1.1-.6.2-1.2.3-1.9.3-2.1 0-3.9-1-4.7-2.4"/></svg>',
    mail:S1+'<rect x="3" y="5.6" width="18" height="12.8" rx="2.6"/><path d="M4 8l8 5.6L20 8"/></svg>',
    save_image:S2+'<path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M4.5 17.5v1.2'+
      'a1.3 1.3 0 0 0 1.3 1.3h12.4a1.3 1.3 0 0 0 1.3-1.3v-1.2"/></svg>',
    copy:S2+'<rect x="8.5" y="8.5" width="11" height="11" rx="2.4"/>'+

const UI = {
  /* Button · 88:50 · Variant = Primary|Secondary|Text × State = Default|Pressed|Disabled|Loading */
  Button({label, variant="primary", state="default", onTap, icon}){
    const b=el("button","Button");
    b.dataset.variant=variant; b.dataset.state=state;
    const s=el("span","Button__label"); s.textContent=label;
    if(icon){ const i=el("span",null,icon); b.append(i); }
    b.append(s);
    if(onTap) b.addEventListener("click", e=>{ if(b.dataset.state==="disabled") return; onTap(e); });
    return b;
  },

  /* DayCell · 89:16 · State = Kept|Kept-extra|Today|Future|Skipped-available|Skipped-empty */
  DayCell({state, index, count, onTap}){
    const c=el("button","DayCell");
    c.dataset.state=state; c.dataset.day=index;
    c.setAttribute("aria-label","Day "+index);
    const hasFrame = (state==="kept"||state==="kept-extra"||(state==="today"&&S.todayKept));
    if(hasFrame){
      c.append(Img.make(frameOf(index), null,
        index===DEMO.dayIndex ? VERSION_OPTS[1] : null));
      /* решение 16.2 — число несут все три состояния с кадром: kept, kept-extra, today.
         Пустые (skipped-available с +N, skipped-empty, future) — не несут. */
      const d=dayDate(index), isMonthMark=firstKeptOfMonth(index);
      const scrim=el("div","DayCell__numScrim"+(isMonthMark?" DayCell__numScrim--wide":""));
      c.append(scrim);

         и по полю встречались два «5» и два «6» */
      n.textContent = isMonthMark ? (MONTH[d.getMonth()].toUpperCase()+" "+d.getDate())

      r.append(el("span","RenderStages__dot"),
               assign(el("span","RenderStages__label t-body"),s.label),
               assign(el("span","RenderStages__done t-meta"),"DONE"));
      w.append(r);
    });
    w.setStage=(i)=>{
      [...w.children].forEach((r,j)=>{ r.dataset.status = j<i ? "done" : (j===i ? "active":"idle"); });
      w.dataset.stage = stages[Math.min(i,stages.length-1)].id;
    };
    w.finish=()=>{ [...w.children].forEach(r=>r.dataset.status="done"); };
    w.setStage(0);
    return w;
  },

    const acts=el("div","ShareSheet__acts card");
    SHARE_ACTS.forEach(([label,id],i)=>{
