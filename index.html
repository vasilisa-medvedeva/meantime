/* ============================================================================
   §2 · БАЗА И CHROME
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* --- текстовые стили · 8, из Figma text styles --- */
.t-display{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.4px}
/* вордмарк · решение 17.16. Не текстовый стиль из Figma, а роль: слово `meantime`,
   когда оно выступает логотипом — заставка, 01, шапка 03, метка на карточке шеринга.
   Размер и место берутся у стиля, с которым класс стоит в паре; отсюда только начерк.
   Syne 800 шире системного, поэтому отрицательный трекинг t-display снимается. */
.t-logo{font-family:var(--font-logo);font-weight:800;letter-spacing:-.01em}

.t-meta{font-size:11px;line-height:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase}
/* решение 10.4 / долг 10.15 — табличные цифры обязательны, в Figma их включить нельзя */
.t-counter{font-size:17px;line-height:22px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.t-counter-meta{font-size:11px;line-height:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* Центровка по высоте — только 03. Не justify-content:center на скролле:

   Флекс-колонка + min-height:100% у обёртки и margin-block:auto: есть слак — блок
   встаёт по центру, кончился — обычный скролл сверху вниз, ничего не отрезая. */
.Screen__scroll--center{display:flex;flex-direction:column}

</head>
<body>
<style>
/* ============================================================================
   §4 · ЭКРАНЫ
   ========================================================================= */

/* --- кадр и процедурная заглушка (решение 8.12) ------------------------- */
/* height:100% — у .Frame нет содержимого в потоке (все слои абсолютные), поэтому
   без этого он схлопывается в 0 в любом контейнере с заданной высотой:
   .Hero, .Reveal, .KeptFrame, .ShareCard, .FilterCard__img, .PickTile, .RecapSpine.
   Там, где высота задана точечно (.PickGrid, инлайн-стиль), правило перекрывается. */
.Frame{position:relative;overflow:hidden;background:var(--color-surface-raised);height:100%}
/* ЗАГЛУШКА, НЕ ДИЗАЙН. Кадра под эффектом Snow globe в макете нет: нода `106:92` содержит
   тот же файл, что обычный апгрейд (assets/FRAMES.md п. 3). Без обработки третья позиция
   переключателя читалась бы как «ничего не произошло». Берём today.jpg и гоним через
   выраженный холодный сдвиг, подъём яркости и размытие по краям. Заменить настоящим
   рендером по промпту из assets/PROMPTS.md — см. «известные срезы» в component-map.md. */
.Frame--fx .Frame__img{filter:hue-rotate(165deg) saturate(1.45) brightness(1.18) contrast(1.05)}
.Frame--fx::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  -webkit-mask-image:radial-gradient(112% 92% at 50% 44%,transparent 50%,var(--color-bg-primary) 100%);
          mask-image:radial-gradient(112% 92% at 50% 44%,transparent 50%,var(--color-bg-primary) 100%);
}
.Frame--fx::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,var(--color-accent-wash) 0%,transparent 58%);
}

/* подмена версии кадра — кросс-фейд поверх старого слоя, размер не меняется (реестр №33) */
.Frame--fade{position:absolute;inset:0;opacity:0;
  transition:opacity var(--motion-menu) var(--ease-standard)}
.Frame--fade.is-in{opacity:1}
.Frame__ph{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 88% at var(--px) var(--py),
      color-mix(in srgb,var(--color-accent-default) 22%,transparent) 0%, transparent 62%),
    radial-gradient(95% 70% at var(--qx) var(--qy),
      color-mix(in srgb,var(--color-accent-glow) 38%,transparent) 0%, transparent 72%),
    linear-gradient(var(--ang),
      var(--color-bg-gradient-top) 0%,
      var(--color-surface-raised) 52%,
      var(--color-bg-primary) 100%);
  filter:hue-rotate(var(--hue)) saturate(var(--sat));
}
.Frame__ph::after{ /* тихое зерно из токена текста, не из случайного цвета */
  content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(var(--ang2),
    color-mix(in srgb,var(--color-text-primary) 3%,transparent) 0 1px,
    transparent 1px 3px);
}
.Frame__vig{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(105% 88% at 50% 42%,
    var(--color-scrim-image-zero) 26%, var(--color-scrim-image-strong) 100%);
}
.Frame__img{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity var(--motion-menu) var(--ease-standard);
}
.Frame__img.is-in{opacity:1}

/* --- навбар --- */
.NavBar{display:flex;align-items:center;min-height:var(--size-tap-min);margin-left:calc(var(--space-1) * -1)}
.NavBar__back{display:flex;align-items:center;gap:2px;color:var(--color-accent-default);
  height:var(--size-tap-min);padding-right:var(--space-3);font-size:17px;font-weight:400}
.NavBar__title{flex:1;text-align:center;padding-right:var(--space-10)}

.stack{display:flex;flex-direction:column}
.gap1{gap:var(--space-1)}.gap2{gap:var(--space-2)}.gap3{gap:var(--space-3)}
.gap4{gap:var(--space-4)}.gap5{gap:var(--space-5)}.gap6{gap:var(--space-6)}
.row{display:flex;align-items:center}
.mt2{margin-top:var(--space-2)}.mt3{margin-top:var(--space-3)}.mt4{margin-top:var(--space-4)}
.mt5{margin-top:var(--space-5)}.mt6{margin-top:var(--space-6)}.mt8{margin-top:var(--space-8)}
.center{text-align:center}
.card{background:var(--color-surface-raised);border-radius:var(--radius-lg);overflow:hidden}
.hair{height:var(--size-hairline);background:var(--color-border-default)}

/* --- 03 карточка фильтра --- */
.FilterCard{border-radius:var(--radius-lg);overflow:hidden;background:var(--color-surface-raised)}
.FilterCard__img{position:relative;height:var(--size-filter-img-h)}
/* Заглушка карточки дня (решение 17.13). У дневного апгрейда нет имени и нет превью
   (решение 15) — фотография здесь читалась бы как образец результата и обещала бы то,
   чего продукт не обещает. Диафрагма отсылает к съёмке и к оптике направления
   и при этом не обещает ничего. Скрима под текстом нет: кадра под ним тоже нет. */
.FilterCard__blank{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--color-bg-gradient-top) 0%,transparent 72%),
             var(--color-surface-raised);
  color:var(--color-text-tertiary);
}
.FilterCard__blank svg{width:var(--size-lens-mark);height:var(--size-lens-mark);
  margin-bottom:var(--space-10)}
.FilterCard__text{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-4);z-index:2}
.FilterCard__foot{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}

/* --- 05 проявление --- */
.Hero{position:relative;height:var(--size-hero-h);width:100%}
.Hero--day{height:var(--size-hero-day-h)}
.Hero__glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 42%,var(--color-accent-wash) 0%,transparent 70%)}
.Hero__text{position:absolute;left:var(--size-gutter);right:var(--size-gutter);bottom:var(--space-6);z-index:3}
.Reveal{position:absolute;inset:0;transition:filter var(--motion-menu) linear}
/* .Reveal__veil убран решением 17.2: вуаль означала «ещё не готово», а теперь
   оригинал готов с первого кадра. Читаемость заголовка держит .Scrim7 */
/* --- заставка (решение 17.4): вордмарк на свечении героя, без спиннера и прогресса --- */
.Splash{position:absolute;inset:0;z-index:35;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--color-bg-primary);opacity:0;
  transition:opacity var(--motion-sheet-in) var(--ease-standard)}
.Splash.is-in{opacity:1}
.Splash.is-out{transition:opacity var(--motion-alert) var(--ease-accel)}
.Splash > .t-display{position:relative;z-index:1}
/* решение 17.2 — снизу настоящий оригинал, сверху результат; кросс-фейд идёт весь рендер */
.Reveal__after{position:absolute;inset:0;opacity:0}

/* --- вотермарк на кадре, без плашки --- */
.Watermark{position:absolute;right:var(--space-3);bottom:var(--space-3);z-index:3;
  color:var(--color-text-on-image);opacity:.85;
  text-shadow:0 1px 8px var(--color-scrim-image-strong)}
.CornerScrim{position:absolute;right:0;bottom:0;width:60%;height:40%;pointer-events:none;
  background:radial-gradient(120% 120% at 100% 100%,var(--color-scrim-corner) 0%,transparent 70%)}

/* --- сегмент-контрол --- */
.Segment{position:relative;display:flex;padding:2px;border-radius:var(--radius-full);
  background:var(--color-surface-raised);border:var(--size-hairline) solid var(--color-border-default)}
.Segment__ind{position:absolute;top:2px;bottom:2px;border-radius:var(--radius-full);
  background:var(--color-accent-wash);border:var(--size-hairline) solid var(--color-accent-default);
  transition:left var(--motion-menu) var(--ease-standard),width var(--motion-menu) var(--ease-standard)}
.Segment__item{flex:1;z-index:1;min-height:var(--size-tap-min);display:flex;align-items:center;
  justify-content:center;color:var(--color-text-secondary);
  transition:color var(--motion-menu) var(--ease-standard);padding:0 var(--space-2)}
.Segment__item[aria-selected="true"]{color:var(--color-accent-default)}

/* --- блок TOMORROW (идея 21) --- */
.Tomorrow{display:flex;align-items:center;gap:var(--space-3);
  min-height:var(--size-tomorrow-h);padding:0 var(--space-4);
  background:var(--color-surface-raised);border-radius:var(--radius-md)}

/* --- 07 полка и поле --- */
.Shelf{display:flex;gap:var(--space-2);overflow-x:auto;scroll-snap-type:x proximity;
  padding:0 var(--size-gutter);scrollbar-width:none}
.Shelf::-webkit-scrollbar{display:none}
.Shelf > *{scroll-snap-align:start}
.WeekHead,.DayField{display:grid;grid-template-columns:repeat(7,var(--size-day-cell));
  gap:calc(var(--size-day-step) - var(--size-day-cell));justify-content:center}
.WeekHead > span{text-align:center;color:var(--color-text-tertiary)}

/* --- 04a камера (решение 17.19) ----------------------------------------
   Видоискатель во весь кадр, без скруглений: он не карточка, он изображение.
   Ни вспышки, ни переключения камер, ни режимов — нерабочая кнопка приглашает
   на тап, который ничего не делает; лучше пусто. */
.Camera{position:absolute;inset:0;background:var(--color-bg-primary);overflow:hidden}
.Camera__view{position:absolute;inset:0}
.Camera__view .Frame{border-radius:0}
/* очень медленный масштаб: изображение читается живым, а не фотографией.
   alternate вместо простого повтора — иначе на 20-й секунде кадр скачком возвращается в 1.0 */
.Camera__view .Frame__img{
  animation:viewfinder var(--motion-viewfinder) linear infinite alternate;
  transform-origin:50% 50%;
}
@keyframes viewfinder{from{transform:scale(1)}to{transform:scale(1.04)}}
.Camera__close{
  position:absolute;top:calc(var(--size-safe-top) + var(--space-2));left:var(--space-4);z-index:3;
  width:var(--size-tap-min);height:var(--size-tap-min);border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;color:var(--color-text-on-image);
  background:var(--color-glass-fill);backdrop-filter:var(--effect-glass);
  -webkit-backdrop-filter:var(--effect-glass);isolation:isolate;
  transition:transform var(--motion-micro) var(--ease-standard)}
.Camera__close::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--color-glass-floor);z-index:-1}
.Camera__close:active{transform:scale(.97);opacity:.8}
.Camera__bar{
  position:absolute;left:var(--size-gutter);right:var(--size-gutter);z-index:3;
  bottom:calc(var(--size-safe-bottom) + var(--space-4));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.Camera__thumb{
  justify-self:start;width:var(--size-tap-min);height:var(--size-tap-min);
  border-radius:var(--radius-md);overflow:hidden;position:relative;
  border:var(--size-hairline) solid var(--color-glass-hairline);
  transition:transform var(--motion-micro) var(--ease-standard)}
.Camera__thumb:active{transform:scale(.97);opacity:.8}
/* спуск — белое кольцо с заливкой, как в системной камере */
.Camera__shutter{
  justify-self:center;width:var(--size-shutter);height:var(--size-shutter);
  border-radius:var(--radius-full);
  border:var(--size-shutter-ring) solid var(--color-text-on-image);
  display:flex;align-items:center;justify-content:center;background:none}
.Camera__shutter::after{
  content:"";width:calc(100% - var(--space-2));height:calc(100% - var(--space-2));
  border-radius:var(--radius-full);background:var(--color-text-on-image);
  transition:transform var(--motion-micro) var(--ease-standard)}
.Camera__shutter:active::after{transform:scale(.88)}

/* единственный снимок дня в галерее (решение 17.19) */
.GalleryOne{position:relative;display:block;
  width:calc(100% - var(--size-gutter) * 2);height:var(--size-gallery-one);
  border-radius:var(--radius-lg);overflow:hidden;margin:0 var(--size-gutter);
  transition:transform var(--motion-micro) var(--ease-standard)}
.GalleryOne:active{transform:scale(.98)}
.GalleryOne .PickTile__badge{display:flex}

/* --- 09 карточка шеринга --- */
.ShareCard{position:relative;width:var(--size-share-card-w);height:var(--size-share-card-h);
  border-radius:var(--radius-lg);overflow:hidden;margin:0 auto}
.ShareCard__text{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-5);z-index:2}
/* решение 17.12 — вотермарк стал вордмарком: тот же начерк, что t-display на 01 и 03,
   размер под карточку. У неподписчика он же служит меткой, у подписчика снимается. */
.ShareCard__mark{
  font-size:var(--size-sharecard-mark);line-height:1.08;white-space:nowrap;
  text-shadow:0 1px 10px var(--color-scrim-image-strong);
}
.TapRow{display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:var(--size-tap-min);padding:0 var(--space-4);border-radius:var(--radius-md);
  background:var(--color-surface-raised);border:var(--size-hairline) solid var(--color-border-default);
  transition:transform var(--motion-micro) var(--ease-standard)}
.TapRow:active{transform:scale(.98)}

/* --- ShareSheet · шит после шеринга (решение 17) ------------------------
   Имитация системного листа iOS в токенах проекта: строка превью,
   ряд адресатов горизонтальным скроллом, группа действий. --------------- */
.ShareSheet{display:flex;flex-direction:column;gap:var(--space-4)}
.ShareSheet__prev{display:flex;align-items:center;gap:var(--space-3);
  padding:0 var(--size-gutter)}
.ShareSheet__thumb{position:relative;flex:0 0 auto;
  height:var(--size-share-thumb-h);border-radius:var(--radius-md);overflow:hidden}
.ShareSheet[data-kind="day"]  .ShareSheet__thumb{width:var(--size-share-thumb-day-w)}
.ShareSheet[data-kind="week"] .ShareSheet__thumb{width:var(--size-share-thumb-week-w)}
/* превью повторяет композицию карточки один в один: та же разметка, ужатая трансформом.
   Своей разметки у превью нет намеренно — иначе оно расходится с тем, что уйдёт в шеринг. */
.ShareSheet__thumb .ShareCard--mini{position:absolute;top:0;left:0;margin:0;
  transform-origin:0 0;transform:scale(var(--share-thumb-scale))}
.ShareSheet__dests{display:flex;gap:var(--space-3);overflow-x:auto;scrollbar-width:none;
  padding:0 var(--size-gutter)}
.ShareSheet__dests::-webkit-scrollbar{display:none}
.ShareSheet__dest{flex:0 0 auto;width:var(--size-share-dest-col);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
  transition:transform var(--motion-micro) var(--ease-standard)}
.ShareSheet__dest:active{transform:scale(.97);opacity:.8}
.ShareSheet__disc{width:var(--size-share-dest);height:var(--size-share-dest);
  border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;
  background:var(--color-surface-raised);
  border:var(--size-hairline) solid var(--color-border-default);
  color:var(--color-text-secondary)}
.ShareSheet__disc svg{width:var(--size-share-dest-icon);height:var(--size-share-dest-icon)}
.ShareSheet__cap{color:var(--color-text-secondary);text-align:center;
  width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ShareSheet__acts{margin:0 var(--size-gutter)}
.ShareSheet__act{display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:var(--size-tap-min);height:var(--size-button-h);padding:0 var(--space-4);
  color:var(--color-text-primary);
  transition:background var(--motion-micro) var(--ease-standard)}
.ShareSheet__act:active{background:var(--color-accent-wash)}
.ShareSheet__act svg{color:var(--color-text-secondary);flex:0 0 auto;
  width:var(--space-5);height:var(--space-5)}
.ShareSheet__act > span:last-child{display:flex;align-items:center}

/* --- 10 композиция рекапа --- */
.RecapFull{position:relative;height:var(--size-recap-comp-h);border-radius:var(--radius-lg);overflow:hidden}
/* Усиление скрима под текстовым блоком. Плашка запрещена решением 10.11, поэтому тянем
   тот же градиент — но только снизу: к границе квадрантов (50 % высоты) слой уходит в ноль,
   верхний ряд с размытыми квадрантами пейвола не трогается вовсе.
   Нужно потому, что текст шириной 310 лежит на обоих нижних кадрах, и правило тёмного ряда
   даёт запас всего 4.76:1 в худшей точке — на пороге. С усилением запас 5.5–6:1. */
.RecapFull .Scrim7::after,.RecapCard .Scrim7::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:50%;
  background:linear-gradient(0deg,
    var(--color-scrim-image-3) 0%,
    var(--color-scrim-image-3) 45%,
    var(--color-scrim-image-4) 92%,
    var(--color-scrim-image-zero) 100%);
}
.RecapFull .RecapComp .Frame[data-locked="1"]{filter:blur(9px) saturate(.5)}
.RecapFull__text{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-4);z-index:2}

/* --- 04 пикер --- */
.PickRow{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;padding:0 var(--size-gutter)}
.PickRow::-webkit-scrollbar{display:none}
.PickTile{position:relative;flex:0 0 auto;width:var(--size-pick-tile);height:var(--size-pick-tile);
  border-radius:var(--radius-md);overflow:hidden}
.PickTile[aria-selected="true"]{outline:3px solid var(--color-accent-default);outline-offset:-3px}
.PickTile__badge{position:absolute;right:var(--space-2);top:var(--space-2);z-index:2;
  width:22px;height:22px;border-radius:var(--radius-full);background:var(--color-accent-default);
  color:var(--color-text-inverse);display:none;align-items:center;justify-content:center;
  font-size:12px;font-weight:700}
.PickTile[aria-selected="true"] .PickTile__badge{display:flex}
.PickGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:0 2px}
.PickGrid .Frame{height:var(--size-pick-cell)}
.Skeleton{background:var(--color-surface-raised);border-radius:var(--radius-md);
  animation:pulse 1600ms linear infinite}

/* --- баннер сверху (в iOS нет тостов) --- */
.Banner{position:absolute;top:calc(var(--size-safe-top) - var(--space-2));left:var(--space-4);right:var(--space-4);
  padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);
  background:var(--color-glass-fill);border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass);-webkit-backdrop-filter:var(--effect-glass);
  box-shadow:var(--effect-chrome-shadow);isolation:isolate;
  transform:translateY(-140%);transition:transform var(--motion-menu) var(--ease-standard);
  pointer-events:auto}
.Banner::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--color-glass-floor);z-index:-1}
.Banner.is-in{transform:translateY(0)}
.Banner.is-out{transition:transform var(--motion-alert) var(--ease-accel)}

/* --- action sheet --- */
.ActionSheet{position:absolute;left:var(--space-2);right:var(--space-2);
  bottom:calc(var(--size-safe-bottom) + var(--space-2));z-index:2;
  display:flex;flex-direction:column;gap:var(--space-2);pointer-events:auto;
  transform:translateY(120%);transition:transform var(--motion-menu) var(--ease-standard)}
.ActionSheet.is-in{transform:translateY(0)}
.ActionSheet__grp{border-radius:var(--radius-lg);overflow:hidden;background:var(--color-surface-raised)}
.ActionSheet__btn{width:100%;min-height:var(--size-tap-min);height:var(--size-button-h);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.ActionSheet__btn[data-role="destructive"]{color:var(--color-ai-error)}
.ActionSheet__btn[data-role="cancel"]{font-weight:600;color:var(--color-accent-default)}

/* --- симуляция StoreKit --- */
.StoreKit{position:absolute;left:var(--space-3);right:var(--space-3);
  bottom:calc(var(--size-safe-bottom) + var(--space-3));z-index:3;
  padding:var(--space-5);border-radius:var(--radius-xl);
  background:var(--color-glass-fill);border:var(--size-hairline) solid var(--color-glass-hairline);
  backdrop-filter:var(--effect-glass-dense);-webkit-backdrop-filter:var(--effect-glass-dense);
  isolation:isolate;pointer-events:auto;
  transform:translateY(120%);transition:transform var(--motion-sheet-in) var(--ease-sheet)}
.StoreKit::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--color-glass-floor);z-index:-1}
.StoreKit.is-in{transform:translateY(0)}

/* --- список выгод --- */
.Bullets{display:flex;flex-direction:column;gap:var(--space-1);margin:0;padding:0;list-style:none}
.Bullets li{display:flex;gap:var(--space-3);align-items:flex-start}
.Bullets li::before{content:"";flex:0 0 auto;width:5px;height:5px;margin-top:7px;

"use strict";
/* ============================================================================
   §5 · STATE — демо-состояние решения 8.5, единственный источник чисел
   ========================================================================= */
const DEMO = {
  periodStart:new Date(2026,7,5),   // среда 5 августа 2026
  today:new Date(2026,8,13),        // воскресенье 13 сентября 2026
  periodLength:100,
  dayIndex:40,
  kept:37,                          // 40 прошедших − 3 пропущенных; на всех экранах постоянно
  skipped:{12:0, 36:3, 38:1},       // день → сколько кадров той даты лежит в библиотеке
  /* upgradeToday снят решением 17.14: карточка задаёт вопрос, а не вешает ярлык функции */
  upgradeTomorrow:"ANOTHER UPGRADE",
  countdownStart:14*3600 + 32*60 + 6, // NEXT UPGRADE IN 14:32:06
  coinsStart:8,
  periodEnd:new Date(2026,10,12),   // Nov 12
  weeks:15
};
const S = {
  period:"100 days",
  coins:DEMO.coinsStart,
  subscriber:false,
  /* photoDatesAllowed и diarySeen сняты решением 17.21 вместе со шторкой пре-пермишна:
     доступ к датам считается выданным всегда, показывать шторку при входе в Diary нечему */
  todayKept:false,
  todayPreset:null,       // "upgraded" | "EXTRA" | "none"; имя эффекта — в effectName
  attempts:0,             // попытки рендера сегодня (мягкий потолок 3, решение 8.1)
  pickedFrame:null,
  effectPreset:null,
  effectSpent:0,
  effectName:null,        // имя эффекта из плитки каталога (находка QA №2)
  effectPrice:0,
  entered:false,
  countdown:DEMO.countdownStart,
  onboarded:false
};
const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function dayDate(i){ const d=new Date(DEMO.periodStart); d.setDate(d.getDate()+i-1); return d; }
function fmtMD(d){ return MONTH[d.getMonth()]+" "+d.getDate(); }
function fmtMDup(d){ return (MONTH[d.getMonth()]+" "+d.getDate()).toUpperCase(); }
function dayState(i){
  if(i===DEMO.dayIndex) return S.todayKept ? (isExtra() ? "kept-extra":"kept") : "today";
  if(i>DEMO.dayIndex) return "future";
  /* решение 17.21 — доступ к датам выдан по умолчанию, метки +N видны всегда */
  if(i in DEMO.skipped) return DEMO.skipped[i]>0 ? "skipped-available" : "skipped-empty";
  return "kept";
}
/* решение 15.10 — первый СОХРАНЁННЫЙ кадр месяца несёт метку месяца вместо числа.
   В демо-состоянии это AUG 5 (старт периода) и SEP 1. Октябрь и ноябрь метки не получают:
   их дни ещё впереди, кадров у них нет, а пустая ячейка чисел не несёт (решение 16.2). */
function firstKeptOfMonth(i){
  const d=dayDate(i), st=dayState(i);
  if(!(st==="kept"||st==="kept-extra"||(st==="today"&&S.todayKept))) return false;
  for(let j=1;j<i;j++){
    const p=dayDate(j), ps=dayState(j);
    if(p.getMonth()===d.getMonth() && p.getFullYear()===d.getFullYear() &&
       (ps==="kept"||ps==="kept-extra")) return false;
  }
  return true;
}

/* кадр дня. Номер файла ≠ номер дня периода: пропущенные дни номер не занимают
   (карта `assets/FRAMES.md`, решение 17.7). Пропуски — 12 (16 авг), 36 (9 сен), 38 (11 сен).
   Последняя ячейка (день 40) несёт кадр сегодняшнего дня, а не `day-37` — решение 17.7. */
function frameOf(i){
  if(i===DEMO.dayIndex) return "today";
  if(i>DEMO.dayIndex || (i in DEMO.skipped)) return null;   /* будущее и пропуски кадра не имеют */
  let n=i;
  if(i>12) n--;
  if(i>36) n--;
  if(i>38) n--;
  return "day-" + String(n).padStart(2,"0");
}
function saveState(){ try{ localStorage.setItem("meantime.state", JSON.stringify(S)); }catch(e){} }
/* loadState убран решением 17.4: состояние живёт только внутри сессии.
   saveState() остаётся — он держит состояние при переходах между экранами. */

/* ============================================================================
   §6 · Img — кадры из ./assets, процедурная заглушка из токенов (решение 8.12)
   Пути только относительные — прототип уезжает на GitHub Pages (решение 12.2).
   ========================================================================= */
/* Заглушка эффекта: `fx-after` физически не существует, см. assets/FRAMES.md п. 3 */
/* решение 17.18 — заглушка снята: настоящие кадры эффектов лежат в assets/ */
const ASSET_ALIAS = {};

const Img = {
  status:{},   // name -> "ok" | "miss" | Promise
  hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); },
  /* заглушка целиком из токенов: угол, фаза и лёгкий поворот тона — детерминированы по имени */
  /* variant меняет ту же сцену, а не берёт другую: одно зерно, три сдвига
     из решения 15.6 — тональность и направление света, отделение объекта, температура */
  phVars(name, variant){
    const h=this.hash(name);
    let ang=((h)%140)+110, px=((h>>5)%80)+10, py=((h>>9)%60)+10,
        qx=((h>>13)%80)+10, qy=((h>>17)%70)+25,
        hue=((h>>21)%50)-25, sat=0.85+((h>>25)%40)/100;
    /* Сцена обязана остаться узнаваемой: композицию не зеркалим, двигаем свет.
       Решение 15.6 — за один переход меняются три вещи и только они:
       тональность и направление света · отделение объекта от фона · температура. */
    if(variant==="upgraded"){          /* дневной апгрейд */
      ang+=12;                                        /* тональность: градиент разворачивается */
      px=Math.min(88,px+20); py=Math.max(8,py-14);    /* направление света: ключевой свет уходит вверх-вправо */
      qx=Math.min(90,qx+10); qy=Math.max(12,qy-8);
      hue+=10; sat*=1.34;                             /* температура холоднее, цвет плотнее */
    }else if(variant==="small-delta"){ /* кадр уже хороший: глубина и зерно, тон почти тот же */
      ang+=5; py=Math.max(8,py-5); hue+=3; sat*=1.10;
    }else if(variant==="effect"){      /* эффект за монеты: другой мир, разница обязана быть крупной */
      ang+=88; px=100-px; py=100-py; qx=100-qx; hue-=46; sat*=1.75;
    }
    return "--ang:"+ang+"deg;--ang2:"+(((h>>3)%180))+"deg;"+
           "--px:"+px+"%;--py:"+py+"%;--qx:"+qx+"%;--qy:"+qy+"%;"+
           "--hue:"+hue+"deg;--sat:"+sat.toFixed(2)+";";
  },
  probe(name){
    if(this.status[name]) return Promise.resolve(this.status[name]);
    const p = new Promise(res=>{
      const im=new Image();
      im.onload  = ()=>{ this.status[name]="ok";   res("ok"); };
      im.onerror = ()=>{ this.status[name]="miss"; res("miss"); };
      im.src = "./assets/"+name+".jpg";
    });
    this.status[name]=p; return p;
  },
  /* Frame: заглушка стоит сразу, настоящий кадр приходит кросс-фейдом, раскладка не дёргается */
  make(name, cls, opts){
    opts=opts||{};
    const f=document.createElement("div");
    f.className="Frame"+(cls?" "+cls:"");
    f.dataset.img=name;
    const ph=document.createElement("div");
    ph.className="Frame__ph";
    ph.setAttribute("style", this.phVars(opts.seed||name, opts.variant));
    f.append(ph);
    /* отделение объекта от фона — виньетка поверх, только у обработанных вариантов */
    if(opts.variant){
      const v=document.createElement("div"); v.className="Frame__vig";
      v.style.opacity = opts.variant==="upgraded" ? ".55" : ".72";
      f.append(v);
    }
    const im=document.createElement("div"); im.className="Frame__img";
    f.append(im);
    if(!name) return f;   /* пропуск или будущий день — остаётся только заглушка */
    /* fx-after в макете нет: нода эффекта содержит тот же файл, что обычный апгрейд
       (assets/FRAMES.md п. 3). Берём today.jpg и метим слой под CSS-обработку. */
    const file = ASSET_ALIAS[name] || name;
    if(ASSET_ALIAS[name]) f.classList.add("Frame--fx");
    Promise.resolve(this.status[file] instanceof Promise ? this.status[file] : this.probe(file)).then(r=>{
      if(r==="ok"){ im.style.backgroundImage="url(./assets/"+file+".jpg)"; requestAnimationFrame(()=>im.classList.add("is-in")); }
    });
    return f;
  }
};

const AI = {
  cache:{},
  async load(path){
    if(this.cache[path]) return this.cache[path];
    try{
      const r = await fetch("./fixtures/ai/"+path+".json", {cache:"no-store"});
      if(r.ok){ const j = await r.json(); this.cache[path]=j; return j; }
    }catch(e){ /* file:// — ожидаемо, идём в инлайн-копию */ }
    this.cache[path] = FIXTURES[path];
    return FIXTURES[path];
  },
  /* прогон этапов; onStage(i,stage), onProgress(0..1), onSlow(), onDone(fx), onFail(fx) */
  run(fx, cb){
    const ctl = {cancelled:false, stage:null, timers:[]};
    const t = (fn,ms)=>{ const id=setTimeout(fn,ms); ctl.timers.push(id); return id; };
    ctl.cancel = ()=>{ ctl.cancelled=true; ctl.timers.forEach(clearTimeout); };
    Analytics.track("ai_request_started",{scenario:fx.scenario,preset_id:fx.preset_id||null,tier:fx.tier||null});
    const t0 = Date.now();

    if(fx.error_type && !fx.stages){       // мгновенные отказы вроде filter-missing
      t(()=>{ if(!ctl.cancelled) cb.onFail && cb.onFail(fx); }, fx.fail_after_ms||600);
      return ctl;
    }
    if(fx.error_type){                     // сбой посреди этапов
      let acc=0;
      (fx.stages||[]).forEach((s,i)=>{ t(()=>{ if(!ctl.cancelled){ctl.stage=s.id; cb.onStage&&cb.onStage(i,s);} }, acc); acc+=s.ms; });
      t(()=>{ if(ctl.cancelled) return;
        Analytics.track("ai_response_failed",{scenario:fx.scenario,error_type:fx.error_type});
        cb.onFail && cb.onFail(fx); }, fx.fail_after_ms||2500);
      return ctl;
    }
    let acc=0;
    (fx.stages||[]).forEach((s,i)=>{
      t(()=>{ if(!ctl.cancelled){ ctl.stage=s.id; cb.onStage && cb.onStage(i,s); } }, acc);
      acc += s.ms;
    });
    if(fx.slow_threshold_ms && fx.latency_ms > fx.slow_threshold_ms)
      t(()=>{ if(!ctl.cancelled) cb.onSlow && cb.onSlow(fx); }, fx.slow_threshold_ms);
    t(()=>{
      if(ctl.cancelled) return;
      Analytics.track("ai_response_completed",{scenario:fx.scenario,latency_ms:Date.now()-t0,
        fixture:fx.fixture,tier:fx.tier||null});
      if(fx.result && fx.result.confidence==="low")
        Analytics.track("ai_low_confidence_shown",{preset_id:fx.preset_id||null});
      cb.onDone && cb.onDone(fx);
    }, fx.latency_ms);
    return ctl;
  },
  /* стриминг подписи: посимвольно, чанк по словам (реестр №14) */
  stream(el, text, done){
    const step = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--motion-stream-char")) || 22;
    if(step===0){ el.textContent=text; done&&done(); return {cancel(){}}; }
    let i=0, id=null;
    const tick=()=>{
      let n=i+1; while(n<text.length && text[n]!==" ") n++;   // чанк по словам
      i=Math.min(n+1,text.length); el.textContent=text.slice(0,i);
      if(i<text.length) id=setTimeout(tick, step*(i-Math.max(0,i-6)));
      else done&&done();
    };
    tick();
    return {cancel(){ clearTimeout(id); }};
  }
};

/* ============================================================================
   §9 · UI — фабрики компонентов. Один в один с Figma: имя PascalCase,
   варианты Figma живут в data-* теми же словами.
   ========================================================================= */

  if(txt!=null) n.textContent=txt; return n; };
const frag=(...kids)=>{ const f=document.createDocumentFragment(); f.append(...kids); return f; };

    /* HIG Modality — одна шторка за раз: новая закрывает предыдущую, стопки не бывает */
    layer.querySelectorAll(".Sheet").forEach(x=>{ if(x._api) x._api.close(); else x.remove(); });
    layer.querySelectorAll(".Scrim").forEach(x=>x.remove());
    layer.style.pointerEvents="auto";
    const scrim=el("div","Scrim");
    const sheet=el("div","Sheet"); sheet.dataset.detent=detent;
    const grab=el("div","Sheet__grab");
    const body=el("div","Sheet__body");
    sheet.append(grab, body);
    layer.append(scrim, sheet);
    const api={
      el:sheet, body,
      close(){
        if(api._closed) return; api._closed=true;
        sheet.classList.add("is-out"); sheet.classList.remove("is-in"); scrim.classList.remove("is-in");
        setTimeout(()=>{ scrim.remove(); sheet.remove();
          if(!layer.querySelector(".Sheet")) layer.style.pointerEvents="none"; }, 320);
        onDismiss && onDismiss();
      }
    };
    sheet._api=api;
    build(body, api);
    const show=()=>{ requestAnimationFrame(()=>{ scrim.classList.add("is-in"); sheet.classList.add("is-in"); }); };
    delay ? setTimeout(show, delay) : show();
    if(dismissible){
      scrim.addEventListener("click", api.close);
      dragToDismiss(sheet, api.close);
    }
    return api;
  }
};
function assign(n, txt){ n.textContent=txt; return n; }

/* реестр №7 — шторка тянется за пальцем, порог 25 % высоты или скорость > .5 px/ms */
function dragToDismiss(sheet, close){
  let y0=0,t0=0,dy=0,active=false;
  const down=e=>{ const p=e.touches?e.touches[0]:e;
    const body=sheet.querySelector(".Sheet__body");   /* у камеры тела шторки нет */
    if(body && body.scrollTop>0 && !e.target.closest(".Sheet__grab")) return;
    active=true; y0=p.clientY; t0=Date.now(); dy=0; sheet.style.transition="none"; };
  const move=e=>{ if(!active) return; const p=e.touches?e.touches[0]:e;
    dy=Math.max(0,p.clientY-y0); sheet.style.transform="translateY("+dy+"px)";
    if(e.cancelable) e.preventDefault(); };
  const up=()=>{ if(!active) return; active=false;
    const v=dy/Math.max(1,Date.now()-t0);
    sheet.style.transition="";
    if(dy > sheet.offsetHeight*0.25 || v>0.5){ sheet.style.transform=""; close(); }
    else sheet.style.transform="";
  };
  sheet.addEventListener("touchstart",down,{passive:true});
  sheet.addEventListener("touchmove",move,{passive:false});
  sheet.addEventListener("touchend",up);
  sheet.addEventListener("mousedown",down);
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",up);
}

/* ============================================================================
   §11 · Router — push/pop слайдом, zoom-from-thumbnail (решение 13.2),
   интерактивный свайп от края, следующий за пальцем (решение 13.4).
   ========================================================================= */
const MS = k => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(k))||0;
const Router = {
  stack:[], current:null, busy:false,
  root:{today:"03", diary:"07", effects:"11"},
  el(){ return document.getElementById("stack"); },

  build(route){
    const make = Screens[route];
    if(!make) throw new Error("no screen "+route);
    const s = el("div","Screen"); s.dataset.route=route;
    make(s);
    return s;
  },

  /* корень таба — без анимации содержимого (HIG, реестр №4) */
  tab(id){
    const route=this.root[id];
    if(this.stack.length===1 && this.current===route) return;
    this.stack.forEach(f=>f.el.remove());
    const s=this.build(route);
    this.el().append(s);
    this.stack=[{route, el:s, mode:"root"}];
    this.current=route;
    location.hash="#/"+route;
  },

  /* корень + экран поверх: «назад» с 06 возвращает на 03 в состоянии «после Keep» */
  resetTo(rootRoute, route){
    this.reset(rootRoute);
    const s=this.build(route); this.el().append(s);
    this.stack.push({route, el:s, mode:"slide"});
    this.current=route; location.hash="#/"+route;
  },

  reset(route){
    this.stack.forEach(f=>f.el.remove());
    const s=this.build(route); this.el().append(s);
    this.stack=[{route, el:s, mode:"root"}];
    this.current=route; location.hash="#/"+route;
  },

  go(route, opts){
    opts=opts||{};
    if(this.busy) return; this.busy=true;
    const below=this.stack[this.stack.length-1];
    const s=this.build(route);
    const D=MS("--motion-screen"), DZ=MS("--motion-sheet-in");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    let mode = opts.cover ? "cover" : (opts.from ? "zoom" : "slide"), origin=null;

    /* HIG Modality — полноэкранная модалка приходит снизу и снизу же уходит.
       Экран под ней остаётся на месте: он не «уехал назад», он накрыт (реестр №37). */
    if(mode==="cover"){
      const easeSheet=getComputedStyle(document.documentElement).getPropertyValue("--ease-sheet");
      s.style.transform="translateY(100%)";
      this.el().append(s);
      requestAnimationFrame(()=>{
        s.style.transition="transform "+DZ+"ms "+easeSheet;
        s.style.transform="translateY(0)";
      });
      setTimeout(()=>{ s.style.transition=""; this.busy=false; }, DZ+20);
    }else if(mode==="zoom"){
      const dev=document.getElementById("device").getBoundingClientRect();
      const r=opts.from.getBoundingClientRect();
      origin={cx:r.left-dev.left+r.width/2, cy:r.top-dev.top+r.height/2, scale:Math.max(.08, r.width/dev.width)};
      s.style.transformOrigin=origin.cx+"px "+origin.cy+"px";
      s.style.transform="scale("+origin.scale+")";
      s.style.opacity="0";
      this.el().append(s);
      requestAnimationFrame(()=>{
        s.style.transition="transform "+DZ+"ms "+ease+", opacity "+DZ+"ms "+ease;
        s.style.transform="scale(1)"; s.style.opacity="1";
      });
      setTimeout(()=>{ s.style.transition=""; this.busy=false; }, DZ+20);
    }else{
      s.style.transform="translateX(100%)";
      this.el().append(s);
      requestAnimationFrame(()=>{
        s.style.transition="transform "+D+"ms "+ease;
        s.style.transform="translateX(0)";
        if(below){ below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
          below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6"; }
      });
      setTimeout(()=>{ s.style.transition=""; this.busy=false; }, D+20);
    }
    this.stack.push({route, el:s, mode, origin, from:opts.from||null});
    this.current=route; location.hash="#/"+route;
    return s;
  },

  back(){
    if(this.stack.length<2 || this.busy) return; this.busy=true;
    const top=this.stack.pop(), below=this.stack[this.stack.length-1];
    const D=MS("--motion-screen"), DZ=MS("--motion-sheet-in");
    const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
    if(top.mode!=="cover"){
      below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      below.el.style.transform="translateX(0)"; below.el.style.opacity="1";
    }
    if(top.mode==="cover"){
      const OUT=MS("--motion-sheet-out");
      const easeAccel=getComputedStyle(document.documentElement).getPropertyValue("--ease-accel");
      top.el.style.transition="transform "+OUT+"ms "+easeAccel;
      top.el.style.transform="translateY(100%)";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, OUT+20);
    }else if(top.mode==="zoom" && top.origin){
      top.el.style.transition="transform "+DZ+"ms "+ease+", opacity "+DZ+"ms "+ease;
      top.el.style.transform="scale("+top.origin.scale+")"; top.el.style.opacity="0";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, DZ+20);
    }else{
      top.el.style.transition="transform "+D+"ms "+ease;
      top.el.style.transform="translateX(100%)";
      setTimeout(()=>{ top.el.remove(); this.busy=false; }, D+20);
    }
    this.current=below.route; location.hash="#/"+below.route;
  },

  /* заменить верхний экран без анимации (например 06 → 06a после Keep as today) */
  swapTop(route){
    const top=this.stack.pop(); if(top) top.el.remove();
    const s=this.build(route); this.el().append(s);
    this.stack.push({route, el:s, mode:"slide"});
    this.current=route; location.hash="#/"+route;
  }
};

/* --- интерактивный свайп от края (решение 13.4, реестр №3) ---------------
   Жест ведёт ровно ту анимацию, которой экран был открыт: слайд — слайдом,
   zoom — обратным зумом. «Назад — зеркало того, как вошёл» держится и жестом. */
(function edgeSwipe(){
  const dev=document.getElementById("device");
  let act=false, x0=0, t0=0, dx=0, top=null, below=null;
  const W=()=>dev.getBoundingClientRect().width;

  const start=e=>{
    if(Router.busy || Router.stack.length<2) return;
    if(document.querySelector("#sheetLayer .Sheet")) return;
    const p=e.touches?e.touches[0]:e;
    const rel=p.clientX-dev.getBoundingClientRect().left;
    if(rel>20) return;
    act=true; x0=p.clientX; t0=Date.now(); dx=0;
    top=Router.stack[Router.stack.length-1]; below=Router.stack[Router.stack.length-2];
    top.el.style.transition="none"; below.el.style.transition="none";
  };
  const move=e=>{
    if(!act) return;
    const p=e.touches?e.touches[0]:e;
    dx=Math.max(0,p.clientX-x0);
    const k=Math.min(1, dx/W());
    if(top.mode==="zoom" && top.origin){
      const s=1+(top.origin.scale-1)*k;
      top.el.style.transform="scale("+s+")"; top.el.style.opacity=String(1-k*0.9);
    }else{
      top.el.style.transform="translateX("+dx+"px)";
      below.el.style.transform="translateX("+(-30+30*k)+"%)";
      below.el.style.opacity=String(.6+.4*k);
    }
    if(e.cancelable) e.preventDefault();
  };
  const end=()=>{
    if(!act) return; act=false;
    const v=dx/Math.max(1,Date.now()-t0);
    top.el.style.transition=""; below.el.style.transition="";
    if(dx>W()*0.3 || v>0.5){
      top.el.style.transform=""; top.el.style.opacity="";
      below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6";
      Router.back();
    }else{
      const D=MS("--motion-menu");
      const ease=getComputedStyle(document.documentElement).getPropertyValue("--ease-standard");
      top.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      below.el.style.transition="transform "+D+"ms "+ease+", opacity "+D+"ms "+ease;
      top.el.style.transform= top.mode==="zoom" ? "scale(1)" : "translateX(0)";
      top.el.style.opacity="1";
      below.el.style.transform="translateX(-30%)"; below.el.style.opacity=".6";
      setTimeout(()=>{ top.el.style.transition=""; below.el.style.transition=""; }, D+20);
    }
  };
  dev.addEventListener("touchstart",start,{passive:true});
  dev.addEventListener("touchmove",move,{passive:false});
  dev.addEventListener("touchend",end);
  dev.addEventListener("mousedown",start);
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
})();

/* --- часы и отсчёт: один таймер на всё приложение (правило 4 карты) ------- */
const Countdown = {

    return h+":"+m+":"+q; },
  tick(){

  }
};

/* три версии одного кадра: оригинал · дневной апгрейд · эффект (решения 15.6, 10.20).
   Зерно заглушки — today-original: один сюжет во всех состояниях (решение 17.1). */
const VERSION_OPTS=[null,{seed:"today-original",variant:"upgraded"},{seed:"today-original",variant:"effect"}];

/* позиция сегмента → кадр и вариант заглушки. Ключ — индекс, а не подпись:
   третья позиция называется именем купленного эффекта, а не всегда «Snow globe» */
const FRAME_VERSIONS=[
  {src:"today-original", opts:VERSION_OPTS[0]},
  {src:"today",          opts:VERSION_OPTS[1]},
  {src:"fx-after",       opts:VERSION_OPTS[2]}
];
/* Имя эффекта берётся из плитки каталога, а не из фикстуры (находка QA №2):
   фикстура одна на каталог, кадр тоже один — fx-after, это осознанный срез.
   todayPreset несёт маркер "EXTRA", имя живёт отдельно в effectName. */
const presetId    = n => String(n||"").toLowerCase().replace(/[^a-z]+/g,"_");
const effectTitle = ()=> S.effectName || "Snow globe";
const effectUpper = ()=> effectTitle().toUpperCase();
const effectPrice = ()=> S.effectPrice || 4;
const isExtra     = ()=> S.todayPreset==="EXTRA";
/* подстановка имени поверх фикстуры эффекта: preset, preset_id и подписи стадий */
function effectFixture(fx){
  if(!fx || fx.scenario!=="effect") return fx;
  const name=effectTitle(), id=presetId(name);
  const c=Object.assign({},fx);
  if(c.preset)    c.preset=name;
  if(c.preset_id) c.preset_id=id;
  if(c.title)     c.title=c.title.replace(/Snow globe/g, name);
  if(c.stages)    c.stages=c.stages.map(st=>Object.assign({},st,{label:st.label.replace(/Snow globe/g,name)}));
  if(c.result)    c.result=Object.assign({},c.result,{preset:name.toUpperCase(),preset_id:id});
  return c;
}
/* Переключатель версий кадра (реестр №33, решения 15.6, 15.14, 17.1).
   hostFn возвращает контейнер, первый ребёнок которого — текущий кадр.
   Подмена кросс-фейдом в том же размере: «свет изменился», а не прыжок вёрстки. */
function versionSegment(labels, sel, hostFn, override){
  return segment(labels, sel, (i)=>{
    const host = hostFn(); if(!host) return;
    const v = FRAME_VERSIONS[i]; if(!v) return;
    const old = host.firstChild;
    const nf = Img.make(v.src, null, (override && override[i]) || v.opts);
    nf.classList.add("Frame--fade");
    host.insertBefore(nf, old ? old.nextSibling : null);
    requestAnimationFrame(()=>nf.classList.add("is-in"));
    setTimeout(()=>{
      if(old && old.parentNode===host) old.remove();
      nf.classList.remove("Frame--fade","is-in");
    }, MS("--motion-menu")+40);
  });
}

/* --- 05 · Проявление --------------------------------------------------- */
Screens["05"]=s=>{
  const path = S._fixture || "daily-frame/success";
  const isEffect = path.indexOf("effect/")===0;
  const w=scrollBox(s,null,true);
  w.style.padding="0 0 calc(var(--size-safe-bottom) + var(--space-4))";

  const hero=el("div","Hero flush");
  const reveal=el("div","Reveal");
  /* решение 17.2 — снизу настоящий оригинал, чёткий с первого кадра;
     сверху результат, пока прозрачный. Резкость больше не изображает проявку. */
  const before=Img.make("today-original");
  const after = isEffect ? Img.make("fx-after",null,VERSION_OPTS[2])
                         : Img.make("today",   null,VERSION_OPTS[1]);
  after.classList.add("Reveal__after");
  reveal.append(before, after);
  hero.append(reveal, el("div","Hero__glow"), el("div","Scrim7"));
  const ht=el("div","Hero__text stack gap2");
  const kick=assign(el("div","t-meta c-on-image"), fmtMDup(DEMO.today)+(isEffect?" · "+effectUpper():""));
  const title=assign(el("div","t-h1 c-on-image"),"Rendering…");
  ht.append(kick,title); hero.append(ht);
  w.append(hero);

  const panel=el("div","stack gap4"); panel.style.padding="var(--space-5) var(--size-gutter) 0";
  w.append(panel);

  AI.load(path).then(raw=>{
    const fx = effectFixture(raw);
    if(!fx){ panel.append(assign(el("div","t-body c-error"),"Fixture not found: "+path)); return; }
    const stages=fx.stages||[{id:"reading",label:"Reading your frame",ms:600}];
    const rs=UI.RenderStages(stages);
    panel.append(rs);
    if(!isEffect && !S._serverNoteSeen){
      panel.append(assign(el("div","t-caption c-tertiary"),
        "Your frame goes to our servers to render, and is deleted within 24 hours."));
      S._serverNoteSeen=true;
    }
    const actions=el("div","stack gap2"); panel.append(actions);
    const cancel=UI.Button({label: isEffect? "Cancel — no charge" : "Cancel — nothing is used yet",
      variant:"text", onTap:()=>{
        ctl.cancel();
        Analytics.track("ai_response_stopped",{scenario:fx.scenario,stage:ctl.stage,quota_spent:false});
        Router.back();
      }});
    actions.append(cancel);

    title.textContent = stages[0].label.replace("…","") + "…";
    const dur = fx.latency_ms || MS("--motion-render-fast");
    /* решение 17.2 — оригинал стоит чётким --motion-reveal-hold, затем верхний слой
       набирает непрозрачность за остаток рендера: кадр и подпись доходят вместе */
    const hold = MS("--motion-reveal-hold");
    after.style.transition="opacity "+Math.max(MS("--motion-menu"), dur-hold)+"ms var(--ease-standard)";
    setTimeout(()=>{ after.style.opacity="1"; }, hold);

    const ctl = AI.run(fx,{
      onStage(i,st){
        rs.setStage(i); title.textContent = st.label.endsWith("…") ? st.label : st.label+"…";
        if(st.id===(fx.cancelable_until||"developing")) cancel.style.display="none";
      },
      onSlow(f){
        const n=assign(el("div","t-body c-thinking"), f.slow_notice);
        panel.insertBefore(n, actions);
      },
      onDone(f){
        rs.finish(); rs.remove();
        /* проявка кончилась — сводим два слоя в один: дальше кадром правит переключатель */
        after.style.transition=""; after.style.opacity="1";
        after.classList.remove("Reveal__after");
        if(before.parentNode) before.remove();
        const small = !!(f.result && f.result.delta==="small");
        if(small){
          const v=after.querySelector(".Frame__vig"); if(v) v.style.opacity=".22";
          const ph=after.querySelector(".Frame__ph");
          if(ph) ph.setAttribute("style", Img.phVars("today-original","small-delta"));
        }
        title.textContent = fmtMD(DEMO.today)+(isEffect?" · "+effectTitle():" · Upgraded");
        kick.textContent = f.result.confidence==="low" ? "LOW CONFIDENCE" : "READY";
        /* решения 15.6, 17.1 — пара «до / после» доступна и на бесплатном пути.
           На 05 переключатель стоит ПОД кадром, а не над ним, как на 03/06/08/14:
           кадр здесь во всю ширину и прижат к верхнему краю, над ним только
           Dynamic Island. Место названо в отчёте как расхождение с заданием. */
        if(!isEffect && !panel.querySelector(".Segment")){
          const seg=versionSegment(["Original","Upgraded"], 1, ()=>reveal,
            small ? {1:{seed:"today-original",variant:"small-delta"}} : null);
          seg.style.marginBottom="var(--space-4)";
          panel.insertBefore(seg, panel.firstChild);
        }
        actions.innerHTML="";
        if(f.notice) actions.append(assign(el("div","t-body c-thinking"), f.notice));
        if(isEffect) Screens._effectDone(actions, f);
        else Screens._dailyDone(actions, f);
      },
      onFail(f){
        rs.remove();
        /* решение 17.2 — при ошибке верхний слой уходит в ноль: остаётся чистый оригинал,
           кадр никуда не делся. Размывать его обратно было бы неправдой */
        after.style.transition="opacity var(--motion-menu) var(--ease-standard)";
        after.style.opacity="0";
        title.textContent=f.title; kick.textContent="";
        actions.innerHTML="";
        actions.append(assign(el("div","t-body c-error"), f.body||""));
        (f.actions||[]).forEach(a=>actions.append(UI.Button({label:a.label,variant:a.variant,
          onTap:()=>Screens._failAction(a.id, f)})));
      }
    });
  });
};

/* --- сегмент-контрол (реестр №11) -------------------------------------- */
function segment(items, sel, onChange){
  const g=el("div","Segment");
  const ind=el("div","Segment__ind"); g.append(ind);
  items.forEach((t,i)=>{
    const b=el("button","Segment__item t-caption"); b.textContent=t;
    b.setAttribute("aria-selected", String(i===sel));
    b.addEventListener("click",()=>{
      [...g.querySelectorAll(".Segment__item")].forEach((x,j)=>x.setAttribute("aria-selected",String(j===i)));
      place(i); onChange && onChange(i,t);
    });
    g.append(b);
  });
  function place(i){
    const items2=g.querySelectorAll(".Segment__item");
    const r=items2[i].getBoundingClientRect(), gr=g.getBoundingClientRect();
    ind.style.left=(r.left-gr.left)+"px"; ind.style.width=r.width+"px";
  }
  requestAnimationFrame(()=>place(sel));
  return g;
}

function recapFull(fx, captionEl){
  const box=el("div","RecapFull");
  const comp=el("div","RecapComp");
  ["TL","TR","BL","BR"].forEach(q=>{
    const it=(fx.quadrants||[]).find(x=>x.q===q);
    if(!it){ comp.append(el("div","Frame")); return; }
    const f=Img.make(it.asset);
    if(it.locked && !S.subscriber) f.dataset.locked="1";
    comp.append(f);
  });
  box.append(comp, el("div","Scrim7"));
  const t=el("div","RecapFull__text stack gap2");
  captionEl.textContent = "“"+fx.caption+"”";
  t.append(assign(el("div","t-meta c-on-image"),fx.kicker), captionEl,
           assign(el("div","t-counter-meta c-on-image"),fx.stat));
  box.append(t);
  /* решение 10.14 — фолбэк, если все четыре кадра ярче #CC */
  const allBright=(fx.quadrants||[]).every(q=>q.luma>0.80);
  if(allBright || fx.kicker_scrim_fallback){
    const f=el("div"); f.style.cssText="position:absolute;inset:0;z-index:1;pointer-events:none;"+
      "background:linear-gradient(0deg,var(--color-scrim-kicker-fallback) 0%,transparent 62%)";
    box.insertBefore(f, t);
  }
  return box;
}
function composeRecap(holder, fx){
  const box=el("div","RecapFull");
  const comp=el("div","RecapComp");
  ["TL","TR","BL","BR"].forEach(()=>comp.append(el("div","Frame")));
  comp.style.filter="blur(8px) saturate(.4)"; comp.style.opacity=".5";
  box.append(comp, el("div","Scrim7"));
  const t=el("div","RecapFull__text stack gap2");
  const cap=el("div","t-h1 c-on-image");
  t.append(assign(el("div","t-meta c-thinking"),"COMPOSING WEEK 6"), cap);
  box.append(t); holder.append(box);
  const rs=UI.RenderStages(fx.stages); rs.classList.add("mt5"); holder.append(rs);
  AI.run(fx,{
    onStage(i,st){ rs.setStage(i);
      if(st.id==="caption") AI.stream(cap, "“"+fx.caption+"”"); },
    onSlow(f){ holder.append(assign(el("div","t-body c-thinking mt3"), f.slow_notice)); },
    onDone(){ rs.remove(); comp.style.filter=""; comp.style.opacity="";
      S._recapFixture="recap/success"; Router.swapTop("10"); }
  });
}

Sheets.confirmCoins = ({name, price, extra})=>{
  UI.Sheet({detent:"medium", build(b, api){
    const head=el("div","row gap3");
    const th=Img.make("today"); th.style.cssText="width:72px;height:72px;border-radius:var(--radius-md);flex:0 0 auto";
    const tx=el("div","stack gap1");
    tx.append(assign(el("div","t-h2"),name),
              assign(el("div","t-caption c-secondary"),"on today’s frame · "+fmtMDup(DEMO.today)),
              assign(el("div","t-meta c-tertiary"),"EXTRA RENDER · BEYOND TODAY’S FREE ONE"));
    head.append(th,tx); b.append(head);
    const enough=S.coins>=price;
    b.append(assign(el("div","t-counter"+(enough?"":" c-error")),
      enough ? "◎ "+price+" coins → "+(S.coins-price)+" left after" : "◎ "+price+" coins · you have "+S.coins));
    b.append(assign(el("div","t-caption c-tertiary"),"This photo leaves your phone to be rendered."),
             assign(el("div","t-caption c-tertiary"),"Effects change what’s in the frame. Your original stays."));
    const sp=el("div"); sp.style.flex="1"; b.append(sp);
    if(enough){
      b.append(UI.Button({label:"Render · "+price+" coins",onTap:()=>{
        Analytics.track("effect_confirmed",{preset_id:presetId(name),
          price, balance_after:S.coins-price});
        S.coins-=price; S.effectSpent=price;
        /* находка QA №2 — имя пресета едет из плитки каталога, а не из фикстуры.
           «Upgrade again» (extra) — не эффект каталога, имя не перебиваем */
        if(!extra){ S.effectName=name; S.effectPrice=price; }
        saveState(); api.close();
        S._fixture = S._fixtureOverride && S._fixtureOverride.indexOf("effect/")===0
          ? S._fixtureOverride : "effect/success";
        setTimeout(()=>Router.go("05"),120);
      }}));
    }else{
      b.append(UI.Button({label:"Get coins",onTap:()=>{ api.close(); setTimeout(Sheets.coinPacks,320); }}));
    }
    b.append(UI.Button({label:"Cancel",variant:"text",onTap:api.close}));
  }});
};

(function boot(){
  const qs=new URLSearchParams(location.search);
  if(qs.get("reset")!==null) { try{ localStorage.clear(); }catch(e){} }
  /* решение 17.4 — состояние не переживает перезагрузку: каждая загрузка начинается
     с заставки и пустого Today. Внутри сессии saveState() работает как раньше.
     Буфер событий meantime.events не трогаем — он нужен для отчёта по метрикам. */
  try{ localStorage.removeItem("meantime.state"); }catch(e){}
  S.onboarded=true;   /* 01 и 02 выпали из пути по умолчанию, живут в дев-панели */
  EventLogView.node=document.getElementById("eventLog");

  /* дев-панель: сценарии фикстур, чтобы состояния AI были достижимы вручную */
  const bar=document.querySelector(".DevBar");
  const sel=document.createElement("select");
  sel.style.cssText="background:var(--color-surface-raised);color:var(--color-text-secondary);"+
    "border:1px solid var(--color-border-default);border-radius:var(--radius-full);padding:5px 10px;font-size:12px";
  Object.keys(FIXTURES).forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=k; sel.append(o); });
  sel.value="daily-frame/success";
  sel.addEventListener("change",()=>{ S._fixtureOverride=sel.value; });
  bar.insertBefore(sel, bar.children[1]);
  if(qs.get("fixture")) { S._fixtureOverride=qs.get("fixture"); sel.value=qs.get("fixture"); }

  document.getElementById("devLog").addEventListener("click",()=>{
    document.getElementById("eventLog").classList.toggle("is-on"); });
  document.getElementById("eventLog").addEventListener("click",function(){ this.classList.remove("is-on"); });
  document.getElementById("devReset").addEventListener("click",()=>{
    try{ localStorage.clear(); }catch(e){} location.href=location.pathname; });

  /* решение 17.4 — онбординг и выбор периода выпали из пути по умолчанию,
     но нужны для кейса: держим их достижимыми отсюда */
  const devBtn=(label,fn)=>{ const b=document.createElement("button");
    b.textContent=label; b.addEventListener("click",fn); bar.append(b); };
  devBtn("01 Onboarding",()=>{ S.todayKept=false; S.todayPreset=null; S.attempts=0;
    saveState(); Router.reset("01"); });
  devBtn("02 Period",()=>Sheets.period(false));

  Analytics.track("session_started",{returning:false,day_index:DEMO.dayIndex,period:S.period});

  /* решение 17.11 — экран из адреса не восстанавливается: `Router` пишет hash на каждом
     переходе, и обновление страницы открывало, например, модальный 09 без таб-бара.
     Старт всегда с пустого Today; hash чистится, чтобы следующее обновление тоже начало с нуля.
     Отладочный вход — явный `?screen=NN`. Запись hash во время работы остаётся:
     на ней держится кнопка «назад» в браузере. */
  const forced=qs.get("screen");
  Router.reset(forced && Screens[forced] ? forced : "03");
  /* hash, записанный первым же reset, сразу стираем: обновление страницы обязано
     начинаться с нуля. Дальнейшие переходы пишут hash как раньше — на нём «назад» браузера. */
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  splash();
})();

/* ============================================================================
   §12 · АВТОДЕМО (решение 14)
   Включается ?demo или кнопкой в дев-панели. Прогоняет сквозной путь ядра
   по кругу. Любое касание или клик мгновенно останавливает демо и отдаёт
   управление человеку — без задержек, подтверждений и «доиграет шаг».
   Выключается целиком: не вызывать Demo.start() — остального кода не касается.
   ========================================================================= */
const Demo = {
  on:false, timers:[], badge:null, waiter:null,

  /* Телеметрия для страницы кейса: прототип встраивается как живой мокап с ?demo,
     рядом идёт полоса прогресса. Полоса должна идти по настоящему кругу, а не по
     своему таймеру, поэтому раз в секунду отправляем родительскому окну, где мы.
     Вне рамки не шлём ничего: слать некому. */
  /* Полный период круга вместе с паузой 1200 мс между кругами — замерено прогоном,
     два круга подряд дали одно и то же: 43.6 с. Полоса на странице кейса берёт длительность
     отсюда, поэтому число обязано быть измеренным, а не прикинутым. */
  totalMs:43600,
  t0:0, step:"", beat:null,

  tick(){
    if(window.parent===window) return;
    try{
      parent.postMessage({
        source:"meantime-demo",
        elapsed:this.on ? Math.min(this.totalMs, Date.now()-this.t0) : 0,
        total:this.totalMs,
        on:this.on,
        step:this.step
      },"*");
    }catch(e){}
  },
  /* смена шага сообщается сразу, не дожидаясь следующей секунды */
  at(name){ this.step=name; this.tick(); },

  ui(){
    if(this.badge) return;
    const dev=document.getElementById("device");
    this.badge=el("div","DemoBadge t-caption");
    this.badge.textContent="Demo paused · tap to resume";
    this.badge.addEventListener("click",e=>{ e.stopPropagation(); this.start(); });
    dev.append(this.badge);
  },

  /* перехват — на фазе захвата, чтобы сработать раньше любого обработчика экрана */
  arm(){
    if(this._armed) return; this._armed=true;
    const stop=(e)=>{ if(this.on && !(this.badge && this.badge.contains(e.target))) this.stop(); };
    const dev=document.getElementById("device");
    ["pointerdown","touchstart","mousedown","keydown","wheel"].forEach(t=>
      dev.addEventListener(t, stop, {capture:true, passive:true}));
    document.addEventListener("keydown", stop, {capture:true});
  },

  start(){
    this.ui(); this.arm();
    this.on=true; this.badge.classList.remove("is-on");
    document.querySelectorAll(".DemoTap").forEach(n=>n.remove());
    if(!this.beat) this.beat=setInterval(()=>this.tick(), 1000);
    this.tick();
    this.loop();
  },

  stop(){
    if(!this.on) return;
    this.on=false;
    this.timers.forEach(clearTimeout); this.timers=[];
    if(this.waiter){ this.waiter.reject && this.waiter.reject("stopped"); this.waiter=null; }
    document.querySelectorAll(".DemoTap").forEach(n=>n.remove());
    this.badge.classList.add("is-on");
    /* последнее сообщение с on:false — по нему полоса на странице гаснет
       и подпись меняется на «управление у вас». В этом весь смысл перехвата */
    if(this.beat){ clearInterval(this.beat); this.beat=null; }
    this.tick();
  },

  sleep(ms){
    return new Promise((res,rej)=>{
      if(!this.on) return rej("stopped");
      const id=setTimeout(()=>{ this.waiter=null; this.on ? res() : rej("stopped"); }, ms);
      this.timers.push(id);
      this.waiter={reject:()=>{ clearTimeout(id); rej("stopped"); }};
    });
  },

  /* видимый круг в точке тапа — иначе экраны просто мигают */
  async point(node){
    if(!this.on || !node) throw "stopped";
    const dev=document.getElementById("device").getBoundingClientRect();
    const r=node.getBoundingClientRect();
    const t=el("div","DemoTap");
    t.style.left=(r.left-dev.left+r.width/2)+"px";
    t.style.top =(r.top -dev.top +r.height/2)+"px";
    document.getElementById("device").append(t);
    requestAnimationFrame(()=>t.classList.add("is-on"));
    await this.sleep(420);
    t.remove();
  },

  async tap(node){ await this.point(node); if(!this.on) throw "stopped"; node.click(); },

  btn(label){
    const n=[...document.querySelectorAll(".Button__label")]
      .find(x=>x.textContent.trim()===label);
    return n ? n.closest(".Button") : null;
  },
  /* ждём появления элемента, но не бесконечно — демо не должно зависать */
  async until(fn, limit=9000){
    const t0=Date.now();
    while(this.on){
      const v=fn(); if(v) return v;
      await this.sleep(120);
      if(Date.now()-t0>limit) throw "timeout";
    }
    throw "stopped";
  },

  async loop(){
    try{
      while(this.on){
        await this.run();
        await this.sleep(1200);
      }
    }catch(e){ if(e!=="stopped" && this.on){ console.warn("demo:",e); this.stop(); } }
  },

  /* сквозной путь ядра. Паузы стоят там, где есть что прочесть. ~45 с круг. */
  async run(){
    this.t0=Date.now(); this.at("today");
    /* сброс в начало */
    Object.assign(S,{todayKept:false,todayPreset:null,attempts:0,subscriber:false,
      coins:DEMO.coinsStart,onboarded:true});
    S._fixtureOverride=null; S._fixture="daily-frame/success"; S._recapFixture="recap/success";
    document.querySelectorAll("#sheetLayer .Sheet,#sheetLayer .Scrim,.StoreKit").forEach(n=>n.remove());
    document.getElementById("sheetLayer").style.pointerEvents="none";
    Router.reset("03");

    /* 03 — карточка дня: вопрос, обещание квоты, тикающий отсчёт */
    await this.sleep(4200);
    await this.tap(await this.until(()=>this.btn("Take a photo")));

    /* 04a — камера: пауза, чтобы зритель понял, что это видоискатель, а не фотография */
    this.at("camera");
    await this.until(()=>document.querySelector(".Camera__shutter"), 4000);
    await this.sleep(1600);

    /* 04 — вторая дверь в проявление: галерея из одного снимка (решение 17.19).
       Показываем и закрываем — снимать всё равно будем спуском */
    this.at("gallery");
    await this.tap(document.querySelector(".Camera__thumb"));
    await this.until(()=>document.querySelector("#sheetLayer .GalleryOne:not(.Skeleton)"), 4000);
    await this.sleep(1600);
    await this.tap(await this.until(()=>this.btn("Cancel")));
    await this.sleep(700);

    /* спуск — первый шаг core-flow, ради которого и заведён экран камеры */
    this.at("shutter");
    await this.tap(await this.until(()=>document.querySelector(".Camera__shutter")));

    /* 05 — проявление идёт своим ходом: этапы, строка про 24 часа */
    this.at("reveal");
    await this.until(()=>this.btn("Keep in diary"), 14000);
    await this.sleep(2600);
    await this.tap(this.btn("Keep in diary"));

    /* 06 — день сохранён: подпись кадра, счётчик, блок TOMORROW */
    this.at("kept");
    await this.sleep(4600);
    await this.tap(await this.until(()=>this.btn("Open diary")));

    /* 07 — полка итогов и поле периода */
    this.at("diary");
    await this.sleep(3800);
    const card=await this.until(()=>document.querySelector(".RecapCard"));
    await this.sleep(1400);
    await this.tap(card);

    /* 10 — рекап во весь экран, через 600 мс приходит пейвол */
    this.at("recap");
    await this.sleep(3000);
    await this.until(()=>document.querySelector("#sheetLayer .Sheet"), 4000);
    await this.sleep(6000);           /* время прочитать список и оба плана */
    this.at("paywall");
    const yearly=[...document.querySelectorAll("#sheetLayer .PlanRow")][1];
    if(yearly) { await this.tap(yearly); await this.sleep(2200); }
    await this.tap(await this.until(()=>this.btn("Not now")));
    await this.sleep(2000);
  }
};
(function demoBoot(){
  const qs=new URLSearchParams(location.search);
  const bar=document.querySelector(".DevBar");
  if(bar){
    const b=document.createElement("button");
    b.textContent="Run demo";
    b.addEventListener("click",()=>Demo.start());
    bar.append(b);
  }
  /* автодемо стартует после заставки (решение 17.4), а не поверх неё */
  if(qs.get("demo")!==null) setTimeout(()=>Demo.start(), SPLASH_MS()+MS("--motion-alert"));
})();
